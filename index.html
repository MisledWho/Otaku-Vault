<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Otaku Vault</title>
<style>
:root {
  --bg: #000000;
  --surface: #101114;
  --surface2: #17181c;
  --dialog: #0A0B0D;
  --text: #F3F3F6;
  --text2: #B8B9C2;
  --text3: #8E8F99;
  --accent: #BAC5EE;
  --accent-ink: #1b2340;
  --pill: #43495E;
  --divider: #303138;
  --danger: #F2A8A8;
  --ok: #A8E0B8;
  --warn: #F0D49A;
  --rail: 88px;
  --bar: 64px;
  --radius: 8px;
  --cardw: 150px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: Roboto, "Google Sans", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px;
  overscroll-behavior: none; }
body { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); }
a { color: var(--accent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 24px; height: 24px; fill: currentColor; flex: none; display: block; }

/* ---------- shell ---------- */
#app { position: fixed; inset: 0; display: flex; }
#nav { flex: none; background: var(--surface); display: flex; z-index: 20; }
#main { flex: 1; min-width: 0; position: relative; }
.wide #nav { width: var(--rail); flex-direction: column; justify-content: center; gap: 8px; }
.compact #app { flex-direction: column-reverse; }
.compact #nav { height: var(--bar); flex-direction: row; justify-content: space-around; align-items: center;
  border-top: 1px solid var(--divider); }
.navbtn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text2);
  font-size: 13px; min-width: 64px; min-height: 48px; justify-content: center; position: relative; }
.wide .navbtn { padding: 6px 0; font-size: 14px; }
.navbtn .pillwrap { width: 56px; height: 32px; border-radius: 16px; display: grid; place-items: center; transition: background .15s; }
.navbtn[aria-current="page"] { color: var(--text); font-weight: 500; }
.navbtn[aria-current="page"] .pillwrap { background: var(--pill); }
.navbtn .dot { position: absolute; top: 2px; left: calc(50% + 6px); background: #E46A6A; color: #fff;
  font-size: 11px; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; }
.compact .navbtn .dot { top: 0; }
body.reading #nav { display: none; }

.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.screen[hidden] { display: none; }
.topbar { flex: none; height: 64px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 16px; }
.topbar h1 { font-size: 22px; font-weight: 400; margin: 0 0 0 8px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar h1.lead { margin-left: 12px; }
.topbar .sub { font-size: 13px; color: var(--text2); }
.iconbtn { width: 48px; height: 48px; border-radius: 24px; display: grid; place-items: center; color: var(--text); flex: none; }
.iconbtn:active { background: #ffffff14; }
.iconbtn.on { color: var(--warn); }
.iconbtn[disabled] { opacity: .35; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.pad { padding: 0 16px 24px; }
.searchbar { display: flex; align-items: center; gap: 8px; flex: 1; background: var(--surface2); border-radius: 24px; padding: 0 8px 0 16px; height: 44px; }
.searchbar input { flex: 1; background: none; border: 0; outline: 0; min-width: 0; }

/* ---------- tabs and chips ---------- */
.tabs { flex: none; display: flex; border-bottom: 1px solid var(--divider); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; min-width: 90px; height: 48px; padding: 0 16px; color: var(--text2); font-weight: 500; font-size: 15px; position: relative; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--accent); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 25%; right: 25%; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chiprow { flex: none; display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 10px; scrollbar-width: none; }
.chiprow::-webkit-scrollbar { display: none; }
.chip { height: 36px; padding: 0 16px; border: 1px solid #5a5d6b; border-radius: 10px; color: var(--text); white-space: nowrap; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"], .chip.sel { background: var(--pill); border-color: var(--pill); }
.chip small { color: var(--text2); }
.tag { display: inline-block; border: 1px solid var(--divider); border-radius: 8px; padding: 4px 10px; font-size: 13px; color: var(--text2); }

/* ---------- library grid ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cardw), 1fr)); gap: 10px; padding: 4px 12px 24px; }
.card { position: relative; display: flex; flex-direction: column; justify-content: flex-start; align-self: start; width: 100%; text-align: left; }
.card .cv { width: 100%; }
.card .cv { position: relative; border-radius: var(--radius); overflow: hidden; background: var(--surface2); aspect-ratio: 2 / 3; }
.card .cv img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .ttl { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 8px 8px; background: linear-gradient(transparent, rgba(0,0,0,.88)); }
/* titles: two whole lines at most, ending in an ellipsis — never a sliced third line */
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.25; max-height: 2.5em; word-break: break-word; }
.card .ttl .clamp2 { font-size: 14px; font-weight: 500; color: #fff; text-shadow: 0 1px 2px #000; }
.card .ttl2 { padding: 6px 2px 2px; }
.card .ttl2 .clamp2 { font-size: 14px; color: var(--text); }
.card .badges { position: absolute; top: 6px; left: 6px; right: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
.badge { background: var(--pill); color: var(--text); border-radius: 6px; font-size: 12px; font-weight: 600; padding: 2px 6px; min-width: 22px; text-align: center; }
.badge.unread { background: var(--accent); color: var(--accent-ink); }
.badge.dl { background: #2e5a43; }
.badge.web { background: #5a4a2e; }
.card.dim img { opacity: .55; }
.card.sel .cv { outline: 3px solid var(--accent); outline-offset: -3px; }
.card.sel .cv::after { content: "✓"; position: absolute; top: 6px; right: 6px; background: var(--accent); color: var(--accent-ink); width: 24px; height: 24px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; }
.card .noimg { width: 100%; height: 100%; display: grid; place-items: center; color: var(--text3); font-size: 40px; }
.grid.mode-covers { gap: 6px; }
.list .row { display: flex; gap: 12px; padding: 8px 16px; align-items: center; min-height: 76px; width: 100%; text-align: left; }
.list .row img, .list .row .noimg { width: 50px; height: 72px; object-fit: cover; border-radius: 6px; background: var(--surface2); flex: none; display: grid; place-items: center; color: var(--text3); }
.list .row .t2 { font-size: 16px; }
.list .row .badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: 40%; }
.list .row.sel { background: #43495e66; }

/* ---------- rows ---------- */
.group { padding: 18px 16px 6px; color: var(--text2); font-size: 15px; font-weight: 500; }
.row { display: flex; align-items: center; gap: 14px; padding: 8px 8px 8px 16px; min-height: 56px; width: 100%; text-align: left; }
.row .cov { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; background: var(--surface2); flex: none; }
.row .cov.tall { width: 66px; height: 96px; }
.row .body { flex: 1; min-width: 0; }
.row .t { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { font-size: 14px; color: var(--text2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.row.read .t, .row.read .s { color: #8b8c96; }
.udot { width: 8px; height: 8px; border-radius: 4px; background: var(--accent); flex: none; }
.row:active { background: #ffffff0a; }
.row.sel { background: #43495e66; }
.srcicon { width: 52px; height: 52px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 22px; flex: none; }
.cap { font-size: 12px; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
.cap.integrated { background: #23324f; color: #bcd0ff; }
.cap.website { background: #3f3524; color: #f0d49a; }
.cap.experimental { background: #3b2a46; color: #e1c2f5; }
.cap.local { background: #213b2d; color: #a8e0b8; }
.health { font-size: 12px; color: var(--text2); }
.health.ok { color: var(--ok); } .health.bad { color: var(--danger); } .health.warn { color: var(--warn); }
.textbtn { color: var(--accent); font-weight: 500; padding: 10px 12px; border-radius: 20px; font-size: 15px; }
.textbtn:active { background: #bac5ee1a; }

/* ---------- settings rows ---------- */
.set { display: flex; align-items: center; gap: 20px; padding: 14px 20px; min-height: 64px; width: 100%; text-align: left; }
.set .i { color: var(--accent); }
.set .body { flex: 1; min-width: 0; }
.set .t { font-size: 17px; }
.set .s { font-size: 14px; color: var(--text2); margin-top: 3px; }
.sep { height: 1px; background: var(--divider); margin: 4px 0; }
.switch { width: 52px; height: 32px; border-radius: 16px; border: 2px solid #8e909a; position: relative; flex: none; background: #2a2b31; transition: .15s; }
.switch::after { content: ""; position: absolute; top: 6px; left: 6px; width: 16px; height: 16px; border-radius: 8px; background: #8e909a; transition: .15s; }
.switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.switch[aria-checked="true"]::after { left: 22px; top: 2px; width: 24px; height: 24px; border-radius: 12px; background: var(--accent-ink); }
.check { display: flex; align-items: center; gap: 22px; min-height: 52px; width: 100%; text-align: left; font-size: 17px; }
.check .box { width: 22px; height: 22px; border: 2px solid #c7c8d0; border-radius: 3px; flex: none; display: grid; place-items: center; margin-left: 8px; }
.check[aria-checked="true"] .box { background: var(--accent); border-color: var(--accent); }
.check[aria-checked="true"] .box::after { content: ""; width: 6px; height: 12px; border: solid var(--accent-ink); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); }
.field { width: 100%; background: var(--surface2); border: 1px solid var(--divider); border-radius: 12px; padding: 14px 16px; outline: 0; }
.field:focus { border-color: var(--accent); }
.btn { height: 44px; padding: 0 22px; border-radius: 22px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.tonal { background: var(--pill); color: var(--text); }
.btn.ghost { background: none; color: var(--accent); border: 1px solid #5a5d6b; }
.btn[disabled] { opacity: .45; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
.slider { width: 100%; accent-color: var(--accent); }

/* ---------- details ---------- */
.dhead { display: flex; gap: 16px; padding: 4px 16px 12px; }
.dhead .cover { width: 120px; aspect-ratio: 2/3; border-radius: 8px; object-fit: cover; background: var(--surface2); flex: none; }
.dhead h2 { font-size: 21px; margin: 2px 0 8px; font-weight: 500; line-height: 1.25; }
.meta { color: var(--text2); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.meta span { display: flex; align-items: center; gap: 6px; }
.actions { display: flex; justify-content: space-around; padding: 4px 8px 8px; }
.act { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; color: var(--text2); min-width: 72px; min-height: 56px; justify-content: center; border-radius: 12px; }
.act.on { color: var(--accent); }
.desc { padding: 0 16px; color: var(--text2); font-size: 15px; line-height: 1.5; white-space: pre-wrap; position: relative; }
.desc.clamp { max-height: 4.5em; overflow: hidden; }
.desc.clamp::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 1.5em; background: linear-gradient(transparent, var(--bg)); }
.resume { margin: 10px 16px; }
.chhead { display: flex; align-items: center; padding: 10px 8px 4px 16px; gap: 4px; }
.chhead b { flex: 1; font-weight: 500; }

/* ---------- dialogs, sheets, toasts ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; }
.dialog { background: var(--dialog); border-radius: 24px; width: min(560px, 100%); max-height: calc(100% - 32px); display: flex; flex-direction: column; border: 1px solid #1d1e23; }
.dialog .dh { padding: 22px 24px 8px; font-size: 22px; }
.dialog .db { padding: 8px 24px 12px; overflow-y: auto; color: var(--text2); line-height: 1.45; }
.dialog .df { padding: 12px 16px 16px; display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.sheet { background: var(--dialog); border-radius: 24px; width: min(720px, 100%); max-height: min(86vh, 100%); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #1d1e23; }
.compact .sheet-scrim { align-items: flex-end; padding: 0; }
.compact .sheet { border-radius: 24px 24px 0 0; width: 100%; max-height: 88vh; }
.sheet > div { display: flex; flex-direction: column; min-height: 0; max-height: 100%; }
.sheet .tabs, .sheet .scopebar { flex: none; }
.sheet .sb { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 8px 24px calc(24px + env(safe-area-inset-bottom)); }
.sheet .scopebar { flex-wrap: wrap; }
@media (orientation: landscape) and (max-height: 600px) { .sheet { max-height: calc(100vh - 16px); } .sheet-scrim { padding: 8px; } }
.sheet h4 { margin: 18px 0 12px; font-weight: 500; color: var(--text2); font-size: 16px; }
.sheet h4:first-child { margin-top: 10px; }
.menu { position: fixed; z-index: 70; background: #1a1b20; border-radius: 12px; padding: 8px 0; min-width: 220px; box-shadow: 0 8px 28px #000c; }
.menu button { display: block; width: 100%; text-align: left; padding: 13px 20px; font-size: 16px; }
.menu button:active { background: #ffffff14; }
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 90; display: flex; flex-direction: column; gap: 8px; width: min(560px, calc(100% - 32px)); pointer-events: none; }
.compact #toasts { bottom: calc(var(--bar) + 16px); }
.toast { background: #e6e6ec; color: #18191d; border-radius: 8px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; font-size: 15px; pointer-events: auto; box-shadow: 0 4px 16px #0008; }
.toast span { flex: 1; }
.toast button { color: #3b4a85; font-weight: 600; }
.empty { padding: 56px 24px; text-align: center; color: var(--text2); display: flex; flex-direction: column; gap: 14px; align-items: center; }
.empty .big { font-size: 46px; color: var(--text3); }
.empty b { color: var(--text); font-size: 18px; font-weight: 500; }
.notice { margin: 8px 16px; padding: 12px 14px; border-radius: 12px; background: #1b1c22; color: var(--text2); font-size: 14px; line-height: 1.4; border: 1px solid var(--divider); }
.notice.warn { border-color: #5c4d2b; background: #221d12; color: #e8d6a8; }
.notice.err { border-color: #5c2b2b; background: #221212; color: #f0c0c0; }
.spinner { width: 28px; height: 28px; border: 3px solid #ffffff22; border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 24px auto; }
.spinner.sm { width: 18px; height: 18px; border-width: 2px; margin: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.fab { position: absolute; right: 16px; bottom: 16px; height: 56px; padding: 0 20px; border-radius: 16px; background: var(--pill); display: flex; align-items: center; gap: 10px; font-weight: 500; box-shadow: 0 4px 14px #0009; z-index: 5; }
.selbar { flex: none; height: 64px; display: flex; align-items: center; gap: 4px; padding: 0 8px; background: var(--surface); }
.selbar b { flex: 1; margin-left: 8px; font-weight: 500; font-size: 18px; }
.stages { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
.stage { display: flex; gap: 10px; align-items: center; color: var(--text3); font-size: 15px; }
.stage.on { color: var(--text); } .stage.done { color: var(--ok); } .stage.fail { color: var(--danger); }
.preview { display: flex; gap: 14px; margin-top: 12px; align-items: flex-start; }
.preview img { width: 84px; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; background: var(--surface2); }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; margin-top: 10px; }
.thumbs label { position: relative; display: block; }
.thumbs label img { width: 100%; height: 130px; object-fit: cover; border-radius: 6px; background: var(--surface2); display: block; }
.thumbs input { position: absolute; top: 6px; left: 6px; width: 20px; height: 20px; accent-color: var(--accent); }
.thumbs span { position: absolute; bottom: 4px; right: 6px; font-size: 12px; background: #000a; padding: 1px 5px; border-radius: 4px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--text3); } .kv dd { margin: 0; color: var(--text); word-break: break-word; }
table.matrix { width: 100%; border-collapse: collapse; font-size: 13px; }
table.matrix td, table.matrix th { border-bottom: 1px solid var(--divider); padding: 8px 6px; text-align: left; vertical-align: top; }
table.matrix th { color: var(--text2); font-weight: 500; }
.inc-banner { flex: none; background: #2b2d3a; color: var(--text); font-size: 13px; text-align: center; padding: 4px; }

/* ---------- reader ---------- */
#reader { position: fixed; inset: 0; z-index: 40; background: var(--rbg, #000); touch-action: none; user-select: none; -webkit-user-select: none; }
#reader[hidden] { display: none; }
#reader .viewport { position: absolute; inset: 0; overflow: hidden; }
#reader .strip { position: absolute; inset: 0; overflow-y: auto; overflow-x: auto; touch-action: pan-x pan-y; overscroll-behavior: contain; scrollbar-width: none; }
#reader .strip::-webkit-scrollbar { display: none; }
#reader .stripin { margin: 0 auto; width: calc(100% * var(--zoom, 1)); padding: 0 var(--pad, 0%); }
#reader .pg { position: relative; width: 100%; background: transparent; }
#reader .pg img, #reader .pg canvas { display: block; width: 100%; height: auto; }
#reader .gap .pg + .pg { margin-top: var(--gap, 12px); }
#reader .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #9a9ba4; font-size: 15px; text-align: center; padding: 12px; }
#reader.bg-white .ph, #reader.bg-gray .ph { color: #444; }
#reader .ph .num { font-size: 32px; font-weight: 300; opacity: .6; }
#reader .trans { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #ddd; text-align: center; padding: 32px 24px; background: #0b0b0d; }
#reader .trans .lbl { color: #9a9ba4; font-size: 14px; }
#reader .trans .ch { font-size: 18px; font-weight: 500; }
#reader .trans .warn { color: var(--warn); font-size: 14px; max-width: 420px; }
#reader .paged { position: absolute; inset: 0; overflow: hidden; }
#reader .ptrack { position: absolute; inset: 0; display: flex; will-change: transform; }
#reader .ptrack.anim { transition: transform .22s ease-out; }
#reader .ptrack.vert { flex-direction: column; }
#reader .pslot { flex: none; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; padding: 0 var(--pad, 0%); }
#reader .pslot .pwrap { position: relative; max-width: 100%; max-height: 100%; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
#reader .pslot img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; transform-origin: center; }
#reader .pslot.fitw img { max-height: none; width: 100%; height: auto; }
#reader .pslot.fith img { height: 100%; width: auto; max-width: none; max-height: none; flex: none; }
#reader .pslot.fill img { width: 100%; height: 100%; max-width: none; max-height: none; object-fit: cover; }
#reader .pslot.stretch img { width: 100%; height: 100%; max-width: none; max-height: none; object-fit: fill; }
#reader .pslot.fill, #reader .pslot.stretch, #reader .pslot.fith { padding: 0; }
#reader .pslot .half { overflow: hidden; position: relative; max-width: 100%; max-height: 100%; }
#reader .zoomer { transform-origin: 0 0; will-change: transform; }
#reader .chrome { position: absolute; left: 0; right: 0; z-index: 3; transition: opacity .15s, transform .15s; }
#reader .chrome.hide { opacity: 0; pointer-events: none; }
#reader .rtop { top: 0; background: rgba(16,17,20,.94); height: 72px; display: flex; align-items: center; gap: 4px; padding: 0 8px; }
#reader .rtop.hide { transform: translateY(-100%); }
#reader .rtop .tt { flex: 1; min-width: 0; padding-left: 8px; }
#reader .rtop .tt div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#reader .rtop .tt .a { font-size: 19px; } #reader .rtop .tt .b { font-size: 14px; color: var(--text2); }
#reader .rbot { bottom: 0; padding: 10px 12px 0; display: flex; flex-direction: column; gap: 10px; }
#reader .rbot.hide { transform: translateY(100%); }
#reader .seekrow { display: flex; align-items: center; gap: 10px; }

<script>

const NATIVE = typeof window.OVNative !== 'undefined';
/** Web version served by the home server (iPhone / any browser): pages and images go through the server's /proxy and /img. */
const WEB = !NATIVE && !!window.OV_WEB;
const PROXIED = NATIVE || WEB;
const FETCH_CREDS = WEB ? 'same-origin' : 'omit';
const APP_VERSION = '1.0.18';

// ---------------------------------------------------------------- tiny helpers
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function esc(v) {

    out += s;

      const v = vals[i];

      else if (Array.isArray(v)) out += v.map(x => x instanceof Raw ? x.s : esc(x)).join('');

function el(markup) {

}
function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
function natCmp(a, b) { return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' }); }

function dayKey(ts) { const d = new Date(ts); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function dayLabel(ts) {
  const d = new Date(ts); const now = new Date();
  const start = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((start(now) - start(d)) / 86400000);
  if (diff <= 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  if (diff < 7) return diff + ' days ago';
  return d.toLocaleDateString(undefined, { month: 'numeric', day: 'numeric', year: '2-digit' });
}
function timeLabel(ts) { return new Date(ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); }
function agoLabel(ts) {
  if (!ts) return 'never';
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return plural(Math.round(s / 60), 'minute') + ' ago';
  if (s < 86400) return plural(Math.round(s / 3600), 'hour') + ' ago';
  return plural(Math.round(s / 86400), 'day') + ' ago';
}
function dateShort(ts) { return ts ? new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : ''; }

function b64FromBytes(bytes) {
  let s = ''; const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  return btoa(s);
}
function b64FromText(t) { return b64FromBytes(new TextEncoder().encode(t)); }

// ---------------------------------------------------------------- URL helpers
/** Normalizes user input to an https URL or throws a friendly error. */
function normalizeInputUrl(input) {
  let s = String(input || '').trim();
  const m = s.match(/https?:\/\/[^\s<>"']+/i);
  if (m) s = m[0];
  s = s.replace(/[)\].,;!]+$/, '');
  if (!s) throw new Error('Paste a web address first.');
  if (/^[a-z][a-z0-9+.-]*:/i.test(s) && !/^https?:/i.test(s)) throw new Error('Only web (https) addresses can be added.');
  if (!/^https?:\/\//i.test(s)) s = 'https://' + s.replace(/^\/+/, '');
  let u;
  try { u = new URL(s); } catch { throw new Error('That does not look like a valid web address.'); }
  if (u.username || u.password) throw new Error('Addresses containing a username or password are not allowed.');
  if (!u.hostname.includes('.')) throw new Error('That address is missing a domain such as example.com.');
  if (/^(localhost|.*\.local|.*\.localhost)$/i.test(u.hostname) || /^(127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|0\.|169\.254\.)/.test(u.hostname) || u.hostname.startsWith('[')) {
    throw new Error('Local and private network addresses are not allowed.');
  }
  u.protocol = 'https:';
  u.hostname = u.hostname.toLowerCase();
  u.hash = '';
  for (const p of [...u.searchParams.keys()]) {
    if (/^(utm_|fbclid$|gclid$|ref$|ref_src$|igshid$|mc_)/i.test(p)) u.searchParams.delete(p);
  }
  return u;
}
/** Exact host match; www. is treated as the same host. Never substring matching. */
function hostMatches(host, list) {
  const h = host.toLowerCase().replace(/^www\./, '');
  return list.some(x => x.toLowerCase().replace(/^www\./, '') === h);
}
function absUrl(href, base) {
  if (!href) return '';
  try { return new URL(href.trim(), base).href; } catch { return ''; }
}
function pathSegs(u) { return u.pathname.split('/').filter(Boolean).map(decodeURIComponent); }

// ---------------------------------------------------------------- preferences
const DEFAULT_PREFS = {
  startTab: 'library',
  gridSize: 0,              // 0 = auto
  libraryDisplay: 'grid',   // legacy
  displayMode: 'compact',   // compact | comfortable | covers | list (Library, Browse and search)
  showUnreadBadge: true,
  showDownloadBadge: true,
  showSourceBadge: false,
  librarySort: 'title',
  librarySortDesc: false,
  libraryFilter: { unread: false, downloaded: false, source: '', status: '' },
  libraryCategory: 'all',
  downloadedOnly: false,
  incognito: false,
  updateOnLaunch: true,
  updateIntervalHours: 12,
  wifiOnly: false,
  chapterSortDesc: true,
  dedupeReleases: 'all',    // all | prefer-first
  mdLangs: ['en'],
  mdRatings: ['safe', 'suggestive'],
  mdDataSaver: false,
  showNsfwSources: false,
  pinnedSources: [],
  hidePaidSeries: false,
  hideLockedChapters: false,
  disabledSources: [],
  lastUsedSource: '',
  katanaServer: '',
  confirmExit: false,
  reader: {
    mode: 'longstrip',      // ltr | rtl | vertical | longstrip | longstripgap
    orientation: 'default', // default | free | portrait | landscape | lockedPortrait | lockedLandscape | reversePortrait
    tapZones: 'default',    // default | lshaped | kindle | edge | rightleft | disabled
    invertTap: 'none',      // none | horizontal | vertical | both
    sidePadding: 0,
    gap: 12,
    cropBorders: false,
    splitWide: false,
    rotateWide: true,
    flipRotated: true,
    doubleTapZoom: true,
    fit: 'page',            // page | width (paged modes)
    background: 'gray',     // black | gray | white | auto
    showPageNumber: true,
    fullscreen: true,
    cutout: true,           // extend pages into the camera notch while fullscreen
    keepScreenOn: true,
    longTapActions: true,
    alwaysTransition: true,
    autoNext: true,
    animatePages: true,
    flashOnPage: false,
    volumeKeys: false,
    customBrightness: false,
    brightness: 0,          // -75..100 ; negatives dim with an overlay
    colorFilter: false,
    colorValue: '#ff9900',
    colorAlpha: 30,
    colorBlend: 'multiply',
    grayscale: false,
    inverted: false,
  },
};
const Prefs = {
  data: null,
  load() {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem('ov.prefs') || '{}') || {}; } catch { saved = {}; }
    this.data = deepMerge(structuredClone(DEFAULT_PREFS), saved);
    if (!saved.displayMode && saved.libraryDisplay === 'list') this.data.displayMode = 'list';
    return this.data;
  },
  save() { try { localStorage.setItem('ov.prefs', JSON.stringify(this.data)); } catch { /* storage full */ } },
  get(k) { return this.data[k]; },
  set(k, v) { this.data[k] = v; this.save(); },
};
function deepMerge(base, over) {
  if (!over || typeof over !== 'object') return base;
  for (const k of Object.keys(over)) {
    if (!(k in base)) { base[k] = over[k]; continue; }
    const b = base[k], o = over[k];
    if (b && typeof b === 'object' && !Array.isArray(b) && o && typeof o === 'object' && !Array.isArray(o)) base[k] = deepMerge(b, o);
    else if (typeof o === typeof b || b == null) base[k] = o;
  }
  return base;
}

// ---------------------------------------------------------------- IndexedDB
const DB = {
  db: null,
  open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('otakuvault', 1);
      req.onupgradeneeded = () => {
        const d = req.result;
        const s = d.createObjectStore('series', { keyPath: 'key' });
        s.createIndex('inLibrary', 'inLibrary');
        const c = d.createObjectStore('chapters', { keyPath: 'key' });
        c.createIndex('series', 'series');
        d.createObjectStore('progress', { keyPath: 'chapterKey' });
        const h = d.createObjectStore('history', { keyPath: 'seriesKey' });
        h.createIndex('at', 'at');
        const u = d.createObjectStore('updates', { keyPath: 'key' });
        u.createIndex('at', 'at');
        d.createObjectStore('downloads', { keyPath: 'chapterKey' });
        d.createObjectStore('pages', { keyPath: ['chapterKey', 'i'] });
        d.createObjectStore('meta', { keyPath: 'k' });
      };
      req.onsuccess = () => { this.db = req.result; resolve(this.db); };
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error('Storage is busy. Close other copies of the app.'));
    });
  },
  tx(stores, mode = 'readonly') { return this.db.transaction(stores, mode); },
  req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  done(t) { return new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Transaction aborted')); }); },
  get(store, key) { return this.req(this.tx(store).objectStore(store).get(key)); },
  all(store) { return this.req(this.tx(store).objectStore(store).getAll()); },
  byIndex(store, index, value) { return this.req(this.tx(store).objectStore(store).index(index).getAll(value)); },
  async put(store, val) { const t = this.tx(store, 'readwrite'); t.objectStore(store).put(val); return this.done(t); },
  async putMany(store, vals) { if (!vals.length) return; const t = this.tx(store, 'readwrite'); const os = t.objectStore(store); vals.forEach(v => os.put(v)); return this.done(t); },
  async del(store, key) { const t = this.tx(store, 'readwrite'); t.objectStore(store).delete(key); return this.done(t); },
  async delRange(store, range) { const t = this.tx(store, 'readwrite'); t.objectStore(store).delete(range); return this.done(t); },
  async clear(store) { const t = this.tx(store, 'readwrite'); t.objectStore(store).clear(); return this.done(t); },
  async meta(k, fallback) { const r = await this.get('meta', k); return r ? r.v : fallback; },
  async setMeta(k, v) { return this.put('meta', { k, v }); },
};

// ---------------------------------------------------------------- errors
class SourceError extends Error {
  constructor(kind, message, extra = {}) { super(message); this.kind = kind; Object.assign(this, extra); }
}
const ERROR_COPY = {
  unsupported: 'This link can be saved, but clean reading is not available yet.',
  login: 'This source needs you to sign in.',
  locked: 'Read this chapter on the source website.',
  verification: 'This website wants you to complete a quick check first. Tap Verify, finish it in the window that opens, and it will retry.',
  layout: 'The source changed, so this chapter could not be loaded.',
  partial: 'Some pages may be missing.',
  rate: 'The source asked us to wait.',
  offline: WEB ? 'Can’t reach the home server. It may be turned off, or you may be offline.' : 'You appear to be offline.',
  notfound: 'The source says this page does not exist anymore.',
  refused: 'That address was refused for safety.',
  server: 'The source is having trouble right now.',
  empty: 'The source returned no pages for this chapter.',
  missing: 'Some downloaded pages are missing.',
  unknown: 'Something went wrong.',
};
function errorText(e) {
  if (!e) return ERROR_COPY.unknown;
  if (e instanceof SourceError) return ERROR_COPY[e.kind] ? ERROR_COPY[e.kind] + (e.detail ? ' ' + e.detail : '') : e.message;
  if (e.name === 'AbortError') return 'Cancelled.';
  return e.message || ERROR_COPY.unknown;
}
/** Removes tokens, cookies and signed query strings before anything is shown or shared. */
function redact(s) {
  return String(s || '')
    .replace(/([?&](token|sig|signature|expires|key|auth|access_token|hash|policy|x-amz-[a-z-]+)=)[^&\s"]+/gi, '$1[redacted]')
    .replace(/(Bearer\s+)[A-Za-z0-9._-]+/g, '$1[redacted]')
    .replace(/(cookie["':\s]+)[^\n"]+/gi, '$1[redacted]');
}

// ---------------------------------------------------------------- network
const Net = {
  hostGap: {},      // host -> min ms between requests
  hostNext: {},     // host -> earliest next time
  pending: new Map(),
  online: true,

  limit(host, ms) { this.hostGap[host.replace(/^www\./, '')] = ms; },

  async slot(host) {
    const h = host.replace(/^www\./, '');
    const gap = this.hostGap[h];
    if (!gap) return;
    const now = Date.now();
    const at = Math.max(now, this.hostNext[h] || 0);
    this.hostNext[h] = at + gap;
    if (at > now) await sleep(at - now);

  classify(status, body, headerErr) {
    if (status === 400 && headerErr) return new SourceError('refused', headerErr);
    if (status === 502 || status === 0) return new SourceError('offline', headerErr ? 'Details: ' + headerErr : '');
    if (status === 429) return new SourceError('rate', '');
    if (status === 401) return new SourceError('login', '');
    if (status === 403 || status === 503) {
      if (/cf-chl|challenge-platform|just a moment|attention required|captcha|verify you are human/i.test(body || '')) return new SourceError('verification', '');

    }
    if (status === 404 || status === 410) return new SourceError('notfound', '');
    if (status >= 500) return new SourceError('server', '(HTTP ' + status + ')');

  },

  /** GET through the native proxy. as: text | json | doc | blob */
  async get(url, { headers = null, as = 'text', timeout = 30000, signal = null, retry = 1 } = {}) {
    const u = new URL(url);
    await this.slot(u.hostname);
    const q = new URLSearchParams({ u: u.href });
    if (headers) q.set('h', JSON.stringify(headers));
    const target = PROXIED ? '/proxy?' + q.toString() : u.href;
    const ctl = new AbortController();
    const onAbort = () => ctl.abort();
    if (signal) { if (signal.aborted) ctl.abort(); else signal.addEventListener('abort', onAbort, { once: true }); }
    const timer = setTimeout(() => ctl.abort(), timeout);

      r = await fetch(target, { signal: ctl.signal, cache: 'no-store', credentials: FETCH_CREDS });

      const err = this.classify(r.status, body, r.headers.get('X-OV-Error'));
      const ra = parseInt(r.headers.get('Retry-After') || '', 10);

      err.url = u.href;
      throw err;
    }

    let body;

      const t = await r.text();
      try { body = JSON.parse(t); } catch { throw new SourceError('layout', '(Expected data but got something else.)'); }
    } else if (as === 'blob') body = await r.blob();
    else if (as === 'doc') {
      const t = await r.text();
      body = new DOMParser().parseFromString(t, 'text/html');

  async json(url, opts = {}) { return (await this.get(url, { ...opts, as: 'json' })).body; },

  /** POST through the bridge (async callback). Only used where a source requires it. */
  post(url, body, headers = {}) {
    if (WEB) return this.webPost(url, body, headers);
    if (!NATIVE) return Promise.reject(new SourceError('unsupported', '(POST requires the Android app.)'));
    return new Promise((resolve, reject) => {
      const id = uid();
      const timer = setTimeout(() => { this.pending.delete(id); reject(new SourceError('offline', '(The request timed out.)')); }, 30000);
      this.pending.set(id, r => {

        else if (r.status >= 400) reject(this.classify(r.status, r.body, r.error));
        else resolve(r);
      });
      window.OVNative.request(id, 'POST', url, JSON.stringify(headers), body);
    });
  },

  async webPost(url, body, headers) {
    let r;
    try {
      const res = await fetch('/post', { method: 'POST', credentials: 'same-origin', cache: 'no-store', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ method: 'POST', url, headers, body }) });
      if (res.status === 401 || res.status === 403) throw new SourceError('login', '(This device is not invited.)');
      r = await res.json();
    } catch (e) { if (e instanceof SourceError) throw e; throw new SourceError('offline', ''); }
    if (!r.status) throw new SourceError('offline', r.error ? '(' + r.error + ')' : '');
    if (r.status >= 400) throw this.classify(r.status, r.body, r.error);
    return r;
  },

  /** Image address: routed through the native image endpoint with a Referer. */
  img(url, referer) {
    if (!url) return '';
    if (/^(blob:|data:|\/)/.test(url)) return url;
    if (!PROXIED) return url;
    const q = new URLSearchParams({ u: url });
    if (referer) q.set('r', referer);
    return '/img?' + q.toString();
  },

  async imageBlob(url, referer, signal) {
    const r = await fetch(this.img(url, referer), { signal, credentials: FETCH_CREDS });
    if (!r.ok) {
      const e = r.status === 415 ? new SourceError('layout', '(The source returned a web page instead of an image.)') : this.classify(r.status, '', r.headers.get('X-OV-Error'));
      e.status = r.status;
      throw e;
    }
    const b = await r.blob();
    if (!b.size) throw new SourceError('layout', '(Empty image.)');
    if (b.type && !b.type.startsWith('image/') && b.type !== 'application/octet-stream') throw new SourceError('layout', '(Not an image.)');
    return b;
  },
};
window.ovNet = r => { const cb = Net.pending.get(r.id); if (cb) { Net.pending.delete(r.id); cb(r); } };

// ---------------------------------------------------------------- native helpers
const Native = {
  call(name, ...args) {
    if (!NATIVE || typeof window.OVNative[name] !== 'function') return undefined;
    try { return window.OVNative[name](...args); } catch (e) { console.warn('native', name, e); return undefined; }
  },
  /** Opens the site in the in-app verification window; resolves true when the person taps Done. */
  verify(url) {
    return new Promise(resolve => {
      if (!NATIVE) { this.openExternal(url); resolve(false); return; }
      window.ovVerified = ok => { window.ovVerified = null; resolve(!!ok); };
      this.call('verify', url);
    });
  },
  openExternal(url) {
    if (NATIVE) this.call('openExternal', url);
    else window.open(url, '_blank', 'noopener');
  },
  share(text) {
    if (NATIVE) this.call('share', text);
    else if (navigator.share) navigator.share({ text }).catch(() => {});
    else navigator.clipboard && navigator.clipboard.writeText(text);
  },
  saveFile(name, mime, bytes) {
    return new Promise(resolve => {
      if (NATIVE) {
        window.ovFileSaved = ok => { window.ovFileSaved = null; resolve(!!ok); };
        this.call('saveFile', name, mime, b64FromBytes(bytes));
      } else {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([bytes], { type: mime }));
        a.download = name; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        resolve(true);
      }
    });
  },
  /** Resolves to a Blob plus name, or null if cancelled. */
  openFile(accept) {
    return new Promise(resolve => {
      if (NATIVE) {
        window.ovFileOpened = async info => {
          window.ovFileOpened = null;
          if (!info) return resolve(null);
          try {
            const r = await fetch('/file?id=' + encodeURIComponent(info.id));
            resolve({ blob: await r.blob(), name: info.name, size: info.size });
          } catch { resolve(null); }
        };
        this.call('openFile', accept || '*/*');
      } else {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.onchange = () => { const f = inp.files[0]; resolve(f ? { blob: f, name: f.name, size: f.size } : null); };
        inp.click();
      }
    });
  },
};

/** Verification flow shared by every screen: open the site in-app, then retry what failed. */
async function verifyAndRetry(err, src, retry) {
  const url = (err && err.url && /^https:/.test(err.url)) ? (() => { try { const u = new URL(err.url); return /api\./.test(u.hostname) && src && src.site ? src.site : err.url; } catch { return src && src.site; } })() : (src && src.site);
  if (!url) return;
  const ok = await Native.verify(url);
  if (ok) { UI.toast('Thanks — retrying'); retry(); }
}

// ---------------------------------------------------------------- DOM helpers
const txt = n => (n ? n.textContent.replace(/\s+/g, ' ').trim() : '');

  if (!n) return '';

}
function imgSrc(img, base) {
  if (!img) return '';
  const pick = img.getAttribute('data-src') || img.getAttribute('data-lazy-src') || img.getAttribute('data-cfsrc') || img.getAttribute('data-original') ||
    (img.getAttribute('srcset') || img.getAttribute('data-srcset') || '').split(',').map(s => s.trim().split(/\s+/)[0]).filter(Boolean).pop() ||
    img.getAttribute('src') || '';

}

function byLabel(root, itemSel, labelSel, label) {
  return Array.from(root.querySelectorAll(itemSel)).find(li => {
    const l = li.querySelector(labelSel);
    return l && l.textContent.toLowerCase().includes(label.toLowerCase());
  }) || null;
}
function parseStatus(s) {
  s = String(s || '').toLowerCase();
  if (/ongoing|publishing|releasing/.test(s)) return 'ongoing';
  if (/complete|finished|ended/.test(s)) return 'completed';
  if (/hiatus/.test(s)) return 'hiatus';
  if (/cancel|dropped|axed|discontinued/.test(s)) return 'cancelled';
  return 'unknown';
}
const MONTHS = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
function parseLooseDate(s) {
  if (!s) return 0;
  s = String(s).trim();
  const now = Date.now();
  if (/today|just now|hour|min|sec/i.test(s)) {
    const m = s.match(/(\d+)\s*(sec|min|hour)/i);
    if (m) return now - (+m[1]) * ({ sec: 1e3, min: 6e4, hour: 36e5 }[m[2].toLowerCase()]);
    return now;
  }
  if (/yesterday/i.test(s)) return now - 864e5;
  let m = s.match(/(\d+)\s*(day|week|month|year)s?\s*ago/i);
  if (m) return now - (+m[1]) * ({ day: 864e5, week: 6048e5, month: 2592e6, year: 31536e6 }[m[2].toLowerCase()]);
  m = s.match(/([A-Za-z]{3})[a-z]*[\s-]+(\d{1,2})[\s,-]+(\d{4})/);
  if (m && MONTHS[m[1].toLowerCase()] != null) return new Date(+m[3], MONTHS[m[1].toLowerCase()], +m[2]).getTime();
  const t = Date.parse(s);
  return isNaN(t) ? 0 : t;
}
function chNum(label) {
  const m = String(label || '').match(/(?:ch(?:apter)?\.?|episode|ep\.?|#)\s*(\d+(?:[.,]\d+)?)/i) || String(label || '').match(/(\d+(?:\.\d+)?)/);
  return m ? m[1].replace(',', '.') : '';
}

// ---------------------------------------------------------------- Asura Scans (API + Astro islands; tile-scrambled pages)
Sources.add((() => {
  const B = 'https://asurascans.com';
  const API = 'https://api.asurascans.com/api';
  const RANDOM = /-[a-z0-9]{8}$/;
  function unwrap(v) {
    if (Array.isArray(v)) {
      if (!v.length) return null;
      if (v.length === 1 && Number.isInteger(v[0])) return null;
      if (v.length === 2 && Number.isInteger(v[0])) return unwrap(v[1]);
      return v.map(unwrap);
    }
    if (v && typeof v === 'object') { const o = {}; for (const k of Object.keys(v)) o[k] = unwrap(v[k]); return o; }
    return v;
  }
  function prop(d, ...keys) {
    const sel = keys.map(k => `[props*="${k}"]`).join('');
    const n = d.querySelector(sel);
    req(n, 'Series data');
    return unwrap(JSON.parse(n.getAttribute('props')));
  }
  function propOr(d, ...keys) { try { return prop(d, ...keys); } catch { return null; } }
  const toItem = m => {
    const pub = pathSegs(new URL(B + m.public_url)).pop();
    return { id: pub, title: m.title, cover: m.cover || m.coverUrl, url: B + '/comics/' + pub };
  };
  async function list(page, q, sort) {
    const u = new URL(API + '/series');
    u.searchParams.set('offset', (page - 1) * 20); u.searchParams.set('limit', 20);
    if (q) u.searchParams.set('search', q);
    u.searchParams.set('sort', sort); u.searchParams.set('order', 'desc');
    const j = await Net.json(u.href);
    return { items: (j.data || []).map(toItem), next: !!(j.meta && j.meta.has_more) };
  }
  async function seriesDoc(id) {
    try { return await Net.doc(`${B}/comics/${id}`); } catch (e) {
      if (e.kind === 'notfound' && RANDOM.test(id)) return Net.doc(`${B}/comics/${id.replace(RANDOM, '')}`);
      throw e;
    }
  }
  return {
    id: 'asurascans', name: 'Asura Scans', letter: 'A', color: '#5b21b6', site: B + '/', hosts: ['asurascans.com', 'asuracomic.net', 'api.asurascans.com'], rate: 1000,
    referer: B + '/', note: 'Premium and early-access chapters are labeled locked and open on the website.',
    popular: p => list(p, '', 'popular'),
    latest: p => list(p, '', 'latest'),
    search: (q, p) => list(p, q, 'latest'),
    classify(u) {
      const s = pathSegs(u);
      if ((s[0] === 'comics' || s[0] === 'series') && s[1]) {
        if (s[2] === 'chapter' && s[3]) return { type: 'chapter', chapterId: s[1] + '/' + s[3], seriesId: s[1] };
        return { type: 'series', id: s[1] };
      }
      return { type: 'home' };
    },
    seriesUrl: id => `${B}/comics/${id}`,
    chapterUrl: ch => `${B}/comics/${ch.id.replace('/', '/chapter/')}`,
    async details(id) {
      const d = await seriesDoc(id);
      const m = prop(d, 'title', 'description');
      const urlInfo = propOr(d, 'publicUrl');
      const pub = urlInfo && urlInfo.publicUrl ? pathSegs(new URL(B + urlInfo.publicUrl)).pop() : id;
      const list2 = propOr(d, 'chapters');
      const series = {
        id: pub, title: m.title, cover: m.coverUrl, author: m.author || '', artist: m.artist || '',
        desc: m.description ? new DOMParser().parseFromString(m.description, 'text/html').body.textContent.trim() : '',
        status: parseStatus(m.status), tags: [m.type, ...((m.genres || []).map(g => g.name))].filter(Boolean),
        alt: String(m.alternativeTitles || '').split(/[•,]/).map(x => x.trim()).filter(Boolean),
        url: `${B}/comics/${pub}`, readingHint: 'longstrip',
      };
      const chapters = ((list2 && list2.chapters) || []).map(c => {
        const n = String(c.number).replace(/\.0$/, '');
        const locked = !!(c.is_premium || c.is_locked || (c.early_access_until && Date.parse(c.early_access_until) > Date.now()));
        return { id: pub + '/' + n, label: 'Chapter ' + n, title: c.title || '', num: n, date: Date.parse(c.created_at) || 0, url: `${B}/comics/${pub}/chapter/${n}`, locked };
      });
      return { series, chapters, complete: !!list2, ordered: true, newId: pub !== id ? pub : null };
    },
    async pages(ch) {
      if (ch.locked) throw new SourceError('locked', '');
      const d = await Net.doc(this.chapterUrl(ch));
      const p = propOr(d, 'pages');
      const pages = (p && p.pages) || [];
      if (!pages.length) throw new SourceError('locked', '(This chapter may require an Asura account.)');
      return pages.map(x => ({ url: x.url, tiles: x.tiles && x.tiles.length ? { order: x.tiles, cols: x.tile_cols || 4, rows: x.tile_rows || 5 } : null }));
    },
  };
})());

// ---------------------------------------------------------------- MangaBox theme (Manganato / Mangakakalot)
function mangaboxSource(cfg) {
  const B = cfg.base;
  const norm = q => q.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
  const slugOf = href => { try { const sg = pathSegs(new URL(href)); return sg[0] === 'manga' ? sg[1] : sg[sg.length - 1]; } catch { return ''; } };
  const itemsOf = d => $$('div.truyen-list > div.list-truyen-item-wrap, div.comic-list > .list-comic-item-wrap, .panel_story_list .story_item, div.list-truyen-item-wrap, div.list-comic-item-wrap', d).map(it => {
    const a = it.querySelector('h3 a') || it.querySelector('a[href*="/manga/"]');
    if (!a) return null;
    const href = absUrl(a.getAttribute('href'), B);
    const id = slugOf(href);
    return id ? { id, title: txt(a) || a.getAttribute('title') || id, cover: imgSrc(it.querySelector('img'), B), url: B + '/manga/' + id } : null;
  }).filter(Boolean).filter((x, i, arr) => arr.findIndex(y => y.id === x.id) === i);
  const hasNext = (d, n) => n >= 10 && !!d.querySelector('.group_page, .group-page, .panel_page_number, a.page_select, a.page-select');
  const list = async url => { const d = await Net.doc(url); const items = itemsOf(d); return { items, next: hasNext(d, items.length) }; };
  const row = (root, label) => $$('li, tr', root).find(x => (x.querySelector('td') ? txt(x.querySelector('td')) : ownText(x) || txt(x)).toLowerCase().includes(label));
  return {
    id: cfg.id, name: cfg.name, letter: cfg.letter, color: cfg.color, site: B + '/', hosts: cfg.hosts, rate: 500, referer: B + '/',
    note: 'MangaBox network site.',
    popular: p => list(`${B}/manga-list/hot-manga?page=${p}`),
    latest: p => list(`${B}/manga-list/latest-manga?page=${p}`),
    search: (q, p) => list(`${B}/search/story/${encodeURIComponent(norm(q))}?page=${p}`),
    classify(u) {
      const sg = pathSegs(u);
      if (sg[0] === 'manga' && sg[1]) {
        if (sg[2]) return { type: 'chapter', chapterId: sg[1] + '/' + sg[2], seriesId: sg[1] };
        return { type: 'series', id: sg[1] };
      }
      return { type: 'home' };
    },
    seriesUrl: id => `${B}/manga/${id}`,
    chapterUrl: ch => `${B}/manga/${ch.id}`,
    async details(id) {
      const url = `${B}/manga/${id}`;
      const d = await Net.doc(url);
      const info = req(d.querySelector('div.manga-info-top, div.panel-story-info'), 'Series information');
      const au = row(info, 'author'), st = row(info, 'status'), ge = row(info, 'genre');
      const desc = d.querySelector('div#noidungm, div#panel-story-info-description, div#contentBox');
      const alt = d.querySelector('.story-alternative, h2.story-alternative');
      const series = {
        id, url, title: txt(info.querySelector('h1, h2')),
        author: au ? $$('a', au).map(txt).join(', ') : '', status: parseStatus(st ? txt(st) : ''),
        tags: ge ? $$('a', ge).map(txt) : [], desc: desc ? (ownText(desc) || txt(desc)).replace(/^.*?summary:\s*/i, '') : '',
        alt: alt ? txt(alt).replace(/^alternative\s*:?/i, '').split(/[;,]/).map(x => x.trim()).filter(Boolean) : [],
        cover: imgSrc(d.querySelector('div.manga-info-pic img, span.info-image img'), B),
      };
      let chapters = [];
      try {
        const j = await Net.json(`${B}/api/manga/${encodeURIComponent(id)}/chapters?limit=-1`, { headers: { 'X-Requested-With': 'XMLHttpRequest', Referer: url, Accept: 'application/json' } });
        if (j && j.success && j.data) chapters = (j.data.chapters || []).filter(c => c.chapter_slug).map(c => ({
          id: id + '/' + c.chapter_slug, label: c.chapter_name || 'Chapter', num: c.chapter_num != null ? String(c.chapter_num).replace(/\.0$/, '') : chNum(c.chapter_name), date: Date.parse(c.updated_at) || 0, url: `${B}/manga/${id}/${c.chapter_slug}`,
        }));
      } catch { /* fall back to the page's own chapter list */ }
      if (!chapters.length) {
        chapters = $$('div.chapter-list .row a, ul.row-content-chapter li a, .chapter-list a', d).map(a => {
          const href = absUrl(a.getAttribute('href'), B);
          const sg = pathSegs(new URL(href));
          return sg[0] === 'manga' && sg[2] ? { id: sg[1] + '/' + sg[2], label: txt(a), num: chNum(txt(a)), url: href } : null;
        }).filter(Boolean);
      }
      return { series, chapters, complete: true, ordered: true };
    },
    async pages(ch) {
      const d = await Net.doc(this.chapterUrl(ch));
      const script = $$('script', d).map(x => x.textContent).filter(t => /cdns\s*=|chapterImages\s*=/.test(t)).join('\n');
      const arr = re => { const m = script.match(re); return m ? m[1].split(',').map(x => x.trim().replace(/^"|"$/g, '').replace(/\\\//g, '/').replace(/\/$/, '')).filter(Boolean) : []; };
      const cdns = [...arr(/cdns\s*=\s*\[([^\]]+)]/), ...arr(/backupImage\s*=\s*\[([^\]]+)]/)];
      const imgs = arr(/chapterImages\s*=\s*\[([^\]]+)]/);
      if (imgs.length && cdns.length) {
        const origin = new URL(cdns[0]).origin;
        return imgs.map(pth => ({ url: origin + ('/' + pth).replace(/\/{2,}/g, '/') }));
      }
      return $$('div.container-chapter-reader > img', d).map(i => ({ url: imgSrc(i, B) })).filter(p => p.url);
    },
  };
}

// ---------------------------------------------------------------- MangaThemesia theme (WordPress "MangaReader" layout)
function themesiaSource(cfg) {
  const B = cfg.base.replace(/\/+$/, '');
  const DIR = cfg.dir || 'manga';
  const items = d => $$('.utao .uta .imgu, .listupd .bs .bsx, .listo .bs .bsx', d).map(el2 => {
    if (el2.querySelector('.novelabel')) return null;
    const a = el2.querySelector('a');
    if (!a) return null;
    const href = absUrl(a.getAttribute('href'), B);
    let sg; try { sg = pathSegs(new URL(href)); } catch { return null; }
    if (sg[0] !== DIR || !sg[1]) return null;
    return { id: sg[1], title: a.getAttribute('title') || txt(el2.querySelector('.tt')) || txt(a), cover: imgSrc(el2.querySelector('img'), B), url: href };
  }).filter(Boolean).filter((x, i, arr) => arr.findIndex(y => y.id === x.id) === i);
  async function list(params, p) {
    const u = new URL(`${B}/${DIR}/`);
    Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
    u.searchParams.set('page', p);
    const d = await Net.doc(u.href);
    return { items: items(d), next: !!d.querySelector('div.pagination .next, div.hpage .r') };
  }
  const info = (root, label) => {
    const re = new RegExp(label, 'i');
    for (const el2 of $$('.infotable tr, .tsinfo .imptdt, .fmed, .imptdt', root)) {
      const head = txt(el2.querySelector('td, b, h1, h2, h3')) || ownText(el2) || txt(el2);
      if (re.test(head)) return txt(el2.querySelector('td:last-child, i, a, span')) || txt(el2).replace(re, '').replace(/^\s*:?\s*/, '');
    }
    return '';
  };
  return {
    id: cfg.id, name: cfg.name, letter: cfg.letter || cfg.name[0].toUpperCase(), color: cfg.color || '#334155', site: B + '/',
    hosts: cfg.hosts || [new URL(B).hostname], rate: 700, referer: B + '/', theme: 'mangathemesia',
    note: cfg.note || 'WordPress MangaReader (Themesia) theme. Locked or coin chapters are labeled and open on the website.',
    popular: p => list({ order: 'popular' }, p),
    latest: p => list({ order: 'update' }, p),
    search: (q, p) => list({ title: q }, p),
    classify(u) {
      const sg = pathSegs(u);
      if (sg[0] === DIR && sg[1]) return { type: 'series', id: sg[1] };
      if (sg.length === 1 && /chapter|ch-\d|-\d+$/i.test(sg[0])) return { type: 'chapter', chapterId: sg[0] };
      return { type: 'home' };
    },
    async chapterParent(chapterId) {
      const d = await Net.doc(`${B}/${chapterId}/`);
      const a = $$(`a[href*="/${DIR}/"]`, d).find(x => { try { const sg = pathSegs(new URL(absUrl(x.getAttribute('href'), B))); return sg[0] === DIR && sg.length === 2; } catch { return false; } });
      return a ? pathSegs(new URL(absUrl(a.getAttribute('href'), B)))[1] : null;
    },
    seriesUrl: id => `${B}/${DIR}/${id}/`,
    chapterUrl: ch => `${B}/${ch.id}/`,
    async details(id) {
      const url = `${B}/${DIR}/${id}/`;
      const d = await Net.doc(url);
      const root = d.querySelector('div.bigcontent, div.animefull, div.main-info, div.postbody') || d;
      const t = root.querySelector('.entry-title') || d.querySelector('.entry-title');
      req(t, 'Series title');
      const series = {
        id, url, title: txt(t),
        desc: txt(root.querySelector('.desc, .entry-content[itemprop=description]')),
        tags: $$('div.gnr a, .mgen a, .seriestugenre a', root).map(txt),
        status: parseStatus(info(root, 'status')), author: info(root, 'author'), artist: info(root, 'artist'),
        alt: txt(root.querySelector('.alternative, .alter, .seriestualt')).split(/[,;]/).map(x => x.trim()).filter(Boolean),
        cover: imgSrc(root.querySelector('.infomanga > div[itemprop=image] img, .thumb img'), B),
      };
      const chapters = $$('div.bxcl li, div.cl li, #chapterlist li', d).map(li => {
        const a = li.querySelector('a');
        if (!a) return null;
        const href = absUrl(a.getAttribute('href'), B);
        let sg; try { sg = pathSegs(new URL(href)); } catch { return null; }
        if (!sg.length) return null;
        const name = txt(li.querySelector('.lch a, .chapternum')) || txt(a);
        const locked = !!li.querySelector('svg, .fa-lock, [data-bs-target="#lockedChapterModal"], .price, .coin') || /locked|premium/i.test(li.className);
        return { id: sg.join('/'), label: name, num: (li.getAttribute('data-num') || chNum(name)), date: parseLooseDate(txt(li.querySelector('.chapterdate'))), url: href, locked };
      }).filter(Boolean);
      return { series, chapters, complete: true, ordered: true };
    },
    async pages(ch) {
      if (ch.locked) throw new SourceError('locked', '');
      const r = await Net.get(this.chapterUrl(ch), { as: 'text' });
      const d = new DOMParser().parseFromString(r.body, 'text/html');
      let urls = $$('div#readerarea img', d).map(i => imgSrc(i, B)).filter(u => u && !/^data:/.test(u));
      if (!urls.length) {
        let script = r.body;
        const enc = d.querySelector('script[src^="data:text/javascript;base64,dHNfcmVhZGVyLnJ1bih7"]');
        if (enc) { try { script = atob(enc.getAttribute('src').split('base64,')[1]); } catch { /* use page text */ } }
        const m = script.match(/["']?(?:images|imageUrls)["']?\s*[:=]\s*(\[.*?\])/s);
        if (m) { try { urls = JSON.parse(m[1]).map(x => absUrl(String(x), B)).filter(Boolean); } catch { /* malformed list */ } }
      }
      return urls.map(url => ({ url }));
    },
  };
}
