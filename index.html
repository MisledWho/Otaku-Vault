// ---------------------------------------------------------------- source health (separate from capability)
const Health = {
  data: {},
  async load() { this.data = await DB.meta('health', {}); },
  async mark(id, ok, kind) {
    const h = this.data[id] || {};
    h.lastCheck = Date.now();
    if (ok) { h.lastOk = Date.now(); h.state = 'working'; h.kind = ''; }
    else h.state = { verification: 'verification', login: 'login', layout: 'layout', offline: h.state || 'nottested', rate: 'unavailable', server: 'unavailable', notfound: h.state || 'unavailable' }[kind] || 'unavailable';
    if (!ok) h.kind = kind || '';
    this.data[id] = h;
    await DB.setMeta('health', this.data);
  },
  label(src) {
    if (src.cap === 'website') return { text: 'Website only', cls: 'warn' };
    if (src.cap === 'local') return { text: 'On this device', cls: 'ok' };
    const h = this.data[src.id];
    if (!h || !h.state) return { text: 'Not tested yet', cls: '' };
    const map = { working: ['Working', 'ok'], verification: ['Needs verification', 'bad'], login: ['Needs login', 'bad'], layout: ['Changed layout', 'bad'], unavailable: ['Temporarily unavailable', 'warn'], nottested: ['Not tested yet', ''] };
    const [t, c] = map[h.state] || ['Not tested yet', ''];
    return { text: t + (h.lastOk ? ' · last worked ' + agoLabel(h.lastOk) : ''), cls: c };
  },
};

/** Wraps an adapter call so health is recorded and errors are typed. */
async function srcCall(src, fn, ...args) {
  try {
    const r = await src[fn](...args);
    if (fn !== 'classify') Health.mark(src.id, true);
    return r;
  } catch (e) {
    if (e.name === 'AbortError') throw e;
    const err = e instanceof SourceError ? e : new SourceError('layout', '(' + (e.message || 'Unexpected data') + ')');
    if (err.kind !== 'offline' && err.kind !== 'locked') Health.mark(src.id, false, err.kind);
    throw err;
  }
}

// ---------------------------------------------------------------- experimental generic extraction
const Extract = {
  AD_HINT: /(^|[\s_-])(ad|ads|advert|banner|sponsor|promo|social|share|logo|avatar|icon|emoji|gravatar|comment|footer|header|nav|menu|sidebar|widget|related|recommend|disqus|popup|modal)([\s_-]|$)/i,
  READER_HINT: /(reader|reading|chapter|page-break|viewer|manga|comic|images|webtoon|vung-doc|container-chapter|chapter-content|entry-content)/i,
  /** Returns ordered candidate images with a confidence score; never sorts by filename. */
  analyze(doc, base) {
    const imgs = $$('img', doc);
    const out = [];
    const seen = new Map();
    imgs.forEach((img, order) => {
      const src = imgSrc(img, base);
      if (!src || /^data:/.test(src) || /\.svg(\?|$)/i.test(src)) return;
      let score = 0, n = img, depth = 0, adHit = false, readerHit = false, containerKey = '';
      while (n && n !== doc.body && depth < 8) {
        const tag = n.tagName ? n.tagName.toLowerCase() : '';
        const cls = (n.className && typeof n.className === 'string' ? n.className : '') + ' ' + (n.id || '');
        if (['header', 'footer', 'nav', 'aside'].includes(tag)) adHit = true;
        if (this.AD_HINT.test(cls)) adHit = true;
        if (this.READER_HINT.test(cls)) { readerHit = true; if (!containerKey) containerKey = tag + (n.id ? '#' + n.id : '') + (cls.trim() ? '.' + cls.trim().split(/\s+/)[0] : ''); }
        n = n.parentElement; depth++;
      }
      if (readerHit) score += 3;
      if (adHit) score -= 4;
      const w = +img.getAttribute('width') || 0, h = +img.getAttribute('height') || 0;
      if (w && h && w < 120 && h < 120) score -= 2;
      if (img.hasAttribute('data-src') || img.hasAttribute('data-lazy-src')) score += 1;
      if (/\/(wp-content\/uploads\/WP-manga|chapter|chapters|uploads\/manga|data\/)/i.test(src)) score += 1;
      if (/(logo|avatar|icon|banner|ads?|sprite|emoji)/i.test(src)) score -= 3;
      const prev = seen.get(src);
      if (prev && prev.order === order - 1) return; // identical adjacent duplicate reference
      const cand = { src, order, score, containerKey };
      seen.set(src, cand);
      out.push(cand);
    });
    // Prefer the container holding most positive candidates.
    const counts = {};
    out.filter(c => c.score > 0 && c.containerKey).forEach(c => { counts[c.containerKey] = (counts[c.containerKey] || 0) + 1; });
    const best = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    out.forEach(c => { c.selected = best ? c.containerKey === best[0] && c.score > 0 : c.score > 1; });
    const sel = out.filter(c => c.selected).length;
    const confidence = !out.length ? 'none' : sel >= 5 && best ? 'medium' : sel >= 2 ? 'low' : 'none';
    return { candidates: out, container: best ? best[0] : '', confidence };
  },
};

/* ==========================================================================
   Otaku Vault — store: library, chapters, progress, history, updates, downloads
   ========================================================================== */

const DEFAULT_CATEGORIES = ['Reading', 'Plan to Read', 'Completed', 'On Hold', 'Dropped'];

/** Compares chapter numbers given as decimal strings without floating point identity. */
function cmpDecimal(a, b) {
  const pa = String(a || '').match(/^(\d+)(?:\.(\d+))?$/), pb = String(b || '').match(/^(\d+)(?:\.(\d+))?$/);
  if (!pa && !pb) return 0;
  if (!pa) return 1;
  if (!pb) return -1;
  const ia = BigInt(pa[1]), ib = BigInt(pb[1]);
  if (ia !== ib) return ia < ib ? -1 : 1;
  const fa = (pa[2] || '').padEnd(8, '0'), fb = (pb[2] || '').padEnd(8, '0');
  return fa < fb ? -1 : fa > fb ? 1 : 0;
}

const Store = {
  series: new Map(),
  categories: [...DEFAULT_CATEGORIES],
  listeners: new Set(),
  memProgress: new Map(),   // incognito session progress (never persisted)
  updating: null,           // { done, total, current }

  key: (src, id) => src + ':' + id,
  emit(what) { this.listeners.forEach(fn => { try { fn(what); } catch (e) { console.error(e); } }); },
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },

  async init() {
    const all = await DB.all('series');
    all.forEach(s => this.series.set(s.key, s));
    this.categories = await DB.meta('categories', [...DEFAULT_CATEGORIES]);
  },
  library() { return [...this.series.values()].filter(s => s.inLibrary); },
  get(key) { return this.series.get(key) || null; },

  async saveSeries(s) { this.series.set(s.key, s); await DB.put('series', s); },
  async saveCategories(list) { this.categories = list; await DB.setMeta('categories', list); this.emit('library'); },

  /** Creates or refreshes a series record from adapter output. Does not add it to the library. */
  upsertSeriesMeta(srcId, meta) {
    const key = this.key(srcId, meta.id);
    const old = this.series.get(key);
    const s = old ? { ...old } : { key, source: srcId, id: meta.id, inLibrary: 0, categories: [], addedAt: 0, unread: 0, dlCount: 0, chapterCount: 0, baseline: false, prefs: {} };
    for (const f of ['title', 'cover', 'author', 'artist', 'desc', 'status', 'tags', 'alt', 'url', 'readingHint', 'rating']) {
      if (meta[f] != null && meta[f] !== '' && !(Array.isArray(meta[f]) && !meta[f].length)) s[f] = meta[f];
    }
    if (!s.title) s.title = meta.title || 'Untitled';
    return s;
  },

  async chapters(seriesKey) {
    const list = await DB.byIndex('chapters', 'series', seriesKey);
    return list.sort((a, b) => a.sortIdx - b.sortIdx);
  },

  /** Assigns a stable reading-order index (oldest first). */
  orderChapters(fetched, ordered) {
    if (ordered) {
      const n = fetched.length;
      return fetched.map((c, i) => ({ ...c, sortIdx: n - 1 - i }));
    }
    const arr = fetched.map((c, i) => ({ ...c, _i: i }));
    arr.sort((a, b) => {
      const va = cmpDecimal(a.vol || '0', b.vol || '0');
      const na = cmpDecimal(a.num, b.num);
      if (a.num && b.num && na !== 0) return na;
      if (a.num && b.num && va !== 0) return va;
      if (!a.num || !b.num) return b._i - a._i;
      return (a.group || '').localeCompare(b.group || '') || (a.date - b.date);
    });
    return arr.map((c, i) => { delete c._i; return { ...c, sortIdx: i }; });
  },

  /**
   * Fetches details from the source and merges chapters. Never deletes chapters or read state;
   * chapters that disappear from a complete listing are marked gone.
   */
  async refreshSeries(s, { signal } = {}) {
    const src = Sources.get(s.source);
    if (!src || src.website || src.pending || src.cap === 'local') return { added: 0 };
    s.lastFetch = Date.now();
    let res;
    try { res = await srcCall(src, 'details', s.id); } catch (e) { s.lastError = errorText(e); await this.saveSeries(s); throw e; }
    if (signal && signal.aborted) return { added: 0 };
    if (res.newId && res.newId !== s.id) {
      // Source changed its URL slug; keep the stored identity, update the link.
      res.series.id = s.id;
    }
    const merged = this.upsertSeriesMeta(s.source, { ...res.series, id: s.id });
    Object.assign(s, merged, { inLibrary: s.inLibrary, categories: s.categories, prefs: s.prefs, addedAt: s.addedAt, baseline: s.baseline });
    s.lastFetchOk = Date.now(); s.lastError = '';
    const added = await this.mergeChapters(s, res.chapters, res.complete, res.ordered);
    await this.saveSeries(s);
    return { added, complete: res.complete };
  },

  async mergeChapters(s, fetched, complete, ordered) {
    const existing = new Map((await DB.byIndex('chapters', 'series', s.key)).map(c => [c.id, c]));
    const ordered2 = this.orderChapters(fetched.filter(c => c.id), ordered);
    const now = Date.now();
    const out = [], fresh = [];
    const seen = new Set();
    for (const f of ordered2) {
      if (seen.has(f.id)) continue;
      seen.add(f.id);
      const old = existing.get(f.id);
      const rec = old ? { ...old } : { key: s.key + '|' + f.id, series: s.key, id: f.id, read: false, bookmark: false, discovered: now, lastPage: 0 };
      for (const k of ['label', 'title', 'num', 'vol', 'lang', 'group', 'date', 'url', 'locked', 'external', 'extUrl', 'sortIdx']) if (f[k] !== undefined) rec[k] = f[k];
      rec.gone = false;
      if (!old) fresh.push(rec);
      out.push(rec);
    }
    if (complete) {
      for (const [id, old] of existing) if (!seen.has(id) && !old.gone) out.push({ ...old, gone: true });
    }
    await DB.putMany('chapters', out);
    let added = 0;
    if (s.baseline && fresh.length) {
      const events = fresh.filter(c => !c.locked).map(c => ({ key: c.key, seriesKey: s.key, label: c.label, title: c.title || '', at: now, date: c.date || 0, seen: false }));
      await DB.putMany('updates', events);
      added = events.length;
    }
    if (s.inLibrary) s.baseline = true;
    const newest = Math.max(0, ...ordered2.map(c => c.date || 0));
    if (newest) s.lastUpdateAt = newest;
    await this.recount(s, false);
    return added;
  },

  async recount(s, save = true) {
    const ch = await DB.byIndex('chapters', 'series', s.key);
    const dls = await this.downloadedSet(s.key);
    const visible = ch.filter(c => !c.gone || c.read);
    s.chapterCount = visible.length;
    s.unread = visible.filter(c => !c.read && !c.locked && !c.gone).length;
    s.lockedCount = visible.filter(c => c.locked).length;
    s.allLocked = visible.length > 0 && s.lockedCount === visible.filter(c => !c.gone).length;
    s.dlCount = visible.filter(c => dls.has(c.key)).length;
    if (save) { await this.saveSeries(s); this.emit('library'); }
  },

  async downloadedSet(seriesKey) {
    const all = await DB.all('downloads');
    return new Set(all.filter(d => d.state === 'complete' && (!seriesKey || d.chapterKey.startsWith(seriesKey + '|'))).map(d => d.chapterKey));
  },

  async addToLibrary(s, categories) {
    s.inLibrary = 1;
    s.addedAt = s.addedAt || Date.now();
    if (categories) s.categories = categories;
    // Chapters already known become the baseline; if none are known yet, the first refresh is the baseline.
    s.baseline = (s.chapterCount || 0) > 0;
    await this.saveSeries(s);
    await this.recount(s);
    this.emit('library');
  },

  async removeFromLibrary(keys, { deleteDownloads = false } = {}) {
    for (const k of keys) {
      const s = this.series.get(k);
      if (!s) continue;
      s.inLibrary = 0;
      await this.saveSeries(s);
      if (deleteDownloads) await Downloads.deleteSeries(k);
    }
    this.emit('library');
  },

  async setRead(chapters, read) {
    const touched = new Set();
    const recs = chapters.map(c => { touched.add(c.series); return { ...c, read: !!read }; });
    await DB.putMany('chapters', recs);
    if (!read) for (const c of recs) { await DB.del('progress', c.key); this.memProgress.delete(c.key); }
    for (const k of touched) { const s = this.series.get(k); if (s) await this.recount(s); }
    return recs;
  },

  async setBookmark(ch, on) { const rec = { ...ch, bookmark: !!on }; await DB.put('chapters', rec); return rec; },

  async progress(chapterKey) {
    if (this.memProgress.has(chapterKey)) return this.memProgress.get(chapterKey);
    return (await DB.get('progress', chapterKey)) || null;
  },

  async saveProgress(p) {
    p.at = Date.now();
    if (Prefs.data.incognito) { this.memProgress.set(p.chapterKey, p); return; }
    await DB.put('progress', p);
  },

  async touchHistory(s, ch) {
    if (Prefs.data.incognito) return;
    const now = Date.now();
    await DB.put('history', { seriesKey: s.key, chapterKey: ch.key, label: ch.label, title: ch.title || '', at: now });
    s.lastReadAt = now;
    await this.saveSeries(s);
  },

  async markChapterDone(s, ch) {
    if (Prefs.data.incognito) return ch;
    const rec = { ...ch, read: true };
    await DB.put('chapters', rec);
    await this.recount(s);
    return rec;
  },

  /** Updates the library with bounded concurrency; one failing source never stops others. */
  async updateLibrary({ keys = null, manual = false } = {}) {
    if (this.updating) return;
    if (Prefs.data.wifiOnly && !manual && navigator.connection && navigator.connection.type && navigator.connection.type !== 'wifi' && navigator.connection.type !== 'ethernet') return;
    const list = (keys ? keys.map(k => this.series.get(k)).filter(Boolean) : this.library())
      .filter(s => { const src = Sources.get(s.source); return src && !src.website && !src.pending && src.cap !== 'local'; });
    const state = { done: 0, total: list.length, added: 0, failed: 0, current: '' };
    this.updating = state;
    await DB.setMeta('lastUpdateAttempt', Date.now());
    this.emit('updating');
    const queue = [...list];
    const bySource = {};
    const worker = async () => {
      while (queue.length) {
        // pick a series whose source is not already busy so slow sources do not block others
        let idx = queue.findIndex(s => !bySource[s.source]);
        if (idx < 0) idx = 0;
        const s = queue.splice(idx, 1)[0];
        bySource[s.source] = (bySource[s.source] || 0) + 1;
        state.current = s.title;
        this.emit('updating');
        try { const r = await this.refreshSeries(s); state.added += r.added; } catch { state.failed++; }
        bySource[s.source]--;
        state.done++;
        this.emit('updating');
      }
    };
    await Promise.all([worker(), worker(), worker()]);
    this.updating = null;
    if (state.failed < state.total || !state.total) await DB.setMeta('lastUpdateOk', Date.now());
    this.emit('updating');
    this.emit('library');
    this.emit('updates');
    return state;
  },
};

// ---------------------------------------------------------------- downloads
const Downloads = {
  queue: [],          // chapter keys in order
  running: null,
  paused: false,
  status: new Map(),  // chapterKey -> record

  async init() {
    const all = await DB.all('downloads');
    all.forEach(d => {
      if (d.state === 'running') d.state = 'queued';
      this.status.set(d.chapterKey, d);
      if (d.state === 'queued' || d.state === 'waiting') this.queue.push(d.chapterKey);
    });
    this.paused = await DB.meta('downloadsPaused', false);
    if (!this.paused) this.pump();
  },
  get(k) { return this.status.get(k) || null; },
  async set(rec) { this.status.set(rec.chapterKey, rec); await DB.put('downloads', rec); Store.emit('downloads'); },

  async enqueue(seriesKey, chapters) {
    const src = Sources.get(Store.get(seriesKey).source);
    if (!src || src.website || src.pending || src.cap === 'local') return 0;
    let n = 0;
    for (const c of chapters) {
      if (c.locked || c.external) continue;
      const cur = this.get(c.key);
      if (cur && (cur.state === 'complete' || cur.state === 'queued' || cur.state === 'running')) continue;
      await this.set({ chapterKey: c.key, seriesKey, label: c.label, state: 'queued', done: 0, total: 0, bytes: 0, error: '', at: Date.now() });
      this.queue.push(c.key); n++;
    }
    this.pump();
    return n;
  },

  async pause(on) { this.paused = on; await DB.setMeta('downloadsPaused', on); if (!on) this.pump(); Store.emit('downloads'); },

  async cancel(k) {
    this.queue = this.queue.filter(x => x !== k);
    if (this.running && this.running.key === k) this.running.ctl.abort();
    await this.remove(k);
  },

  async remove(k) {
    await DB.delRange('pages', IDBKeyRange.bound([k, 0], [k, Infinity]));
    await DB.del('downloads', k);
    this.status.delete(k);
    const s = Store.get(k.split('|')[0]);
    if (s) await Store.recount(s);
    Store.emit('downloads');
  },

  async deleteSeries(seriesKey) {
    for (const k of [...this.status.keys()]) if (k.startsWith(seriesKey + '|')) await this.cancel(k);
  },

  async pump() {
    if (this.running || this.paused) return;
    const k = this.queue.shift();
    if (!k) return;
    const rec = this.get(k);
    if (!rec) return this.pump();
    if (Prefs.data.wifiOnly && navigator.connection && navigator.connection.type && !['wifi', 'ethernet', 'unknown'].includes(navigator.connection.type)) {
      rec.state = 'waiting'; await this.set(rec); this.queue.unshift(k); setTimeout(() => this.pump(), 30000); return;
    }
    const ctl = new AbortController();
    this.running = { key: k, ctl };
    try {
      await this.run(rec, ctl.signal);
    } catch (e) {
      if (ctl.signal.aborted) { /* cancelled */ } else { rec.state = 'failed'; rec.error = errorText(e); await this.set(rec); }
    }
    this.running = null;
    this.pump();
  },

  async run(rec, signal) {
    const s = Store.get(rec.seriesKey);
    const ch = await DB.get('chapters', rec.chapterKey);
    if (!s || !ch) throw new Error('This chapter is no longer in the library.');
    const src = Sources.get(s.source);
    rec.state = 'running'; rec.error = ''; await this.set(rec);
    const manifest = await srcCall(src, 'pages', ch, s);
    if (!manifest.length) throw new SourceError('empty', '');
    rec.total = manifest.length; await this.set(rec);
    const have = new Set((await DB.req(DB.tx('pages').objectStore('pages').getAllKeys(IDBKeyRange.bound([rec.chapterKey, 0], [rec.chapterKey, Infinity])))).map(k => k[1]));
    let next = 0, failed = null;
    const work = async () => {
      while (next < manifest.length && !failed) {
        const i = next++;
        if (have.has(i)) continue;
        const p = manifest[i];
        try {
          const url = p.url || (p.resolve ? await p.resolve() : '');
          const blob = await Net.imageBlob(url, p.referer || src.referer, signal);
          await validateImage(blob);
          await DB.put('pages', { chapterKey: rec.chapterKey, i, blob, tiles: p.tiles || null });
          rec.done++; rec.bytes += blob.size;
          this.set(rec);
        } catch (e) { if (signal.aborted) throw e; failed = e; }
      }
    };
    rec.done = have.size;
    await Promise.all([work(), work(), work()]);
    if (failed) throw failed;
    const count = (await DB.req(DB.tx('pages').objectStore('pages').count(IDBKeyRange.bound([rec.chapterKey, 0], [rec.chapterKey, Infinity]))));
    if (count !== manifest.length) throw new SourceError('partial', '');
    rec.state = 'complete'; rec.total = manifest.length; rec.done = count; rec.at = Date.now();
    await this.set(rec);
    await Store.recount(s);
  },

  async pagesFor(chapterKey) {
    const rec = this.get(chapterKey);
    if (!rec || rec.state !== 'complete') return null;
    const pages = await DB.req(DB.tx('pages').objectStore('pages').getAll(IDBKeyRange.bound([chapterKey, 0], [chapterKey, Infinity])));
    pages.sort((a, b) => a.i - b.i);
    return pages;
  },
};

async function validateImage(blob) {
  if (!blob || !blob.size) throw new SourceError('layout', '(Empty image.)');
  try {
    const bmp = await createImageBitmap(blob);
    const ok = bmp.width > 0 && bmp.height > 0 && bmp.width * bmp.height < 120e6;
    bmp.close && bmp.close();
    if (!ok) throw new Error('dims');
  } catch { throw new SourceError('layout', '(A downloaded page could not be decoded.)'); }
}

/** Reorders a tile-scrambled page (Asura) into a normal image blob. */
async function descramble(blob, tiles) {
  const bmp = await createImageBitmap(blob);
  const tw = Math.floor(bmp.width / tiles.cols), th = Math.floor(bmp.height / tiles.rows);
  const c = document.createElement('canvas');
  c.width = tw * tiles.cols; c.height = th * tiles.rows;
  const g = c.getContext('2d');
  tiles.order.forEach((j, w) => {
    const sc = w % tiles.cols, sr = Math.floor(w / tiles.cols);
    const dc = j % tiles.cols, dr = Math.floor(j / tiles.cols);
    g.drawImage(bmp, sc * tw, sr * th, tw, th, dc * tw, dr * th, tw, th);
  });
  bmp.close && bmp.close();
  return new Promise(res => c.toBlob(b => res(b), 'image/webp', 0.95));
}

// ---------------------------------------------------------------- local archives (CBZ/ZIP)
const Zip = {
  /** Lists entries from the central directory. Rejects unsafe paths and oversized content. */
  async entries(blob) {
    const size = blob.size;
    const tailLen = Math.min(size, 66000);
    const tail = new DataView(await blob.slice(size - tailLen).arrayBuffer());
    let eocd = -1;
    for (let i = tailLen - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error('This is not a ZIP or CBZ archive.');
    const count = tail.getUint16(eocd + 10, true);
    const cdSize = tail.getUint32(eocd + 12, true);
    const cdOff = tail.getUint32(eocd + 16, true);
    if (count > 5000) throw new Error('The archive has too many files.');
    const cd = new DataView(await blob.slice(cdOff, cdOff + cdSize).arrayBuffer());
    const out = [];
    let p = 0, total = 0;
    for (let n = 0; n < count; n++) {
      if (cd.getUint32(p, true) !== 0x02014b50) throw new Error('The archive is damaged.');
      const method = cd.getUint16(p + 10, true);
      const csize = cd.getUint32(p + 20, true);
      const usize = cd.getUint32(p + 24, true);
      const nlen = cd.getUint16(p + 28, true), xlen = cd.getUint16(p + 30, true), clen = cd.getUint16(p + 32, true);
      const local = cd.getUint32(p + 42, true);
      const name = new TextDecoder().decode(new Uint8Array(cd.buffer, cd.byteOffset + p + 46, nlen));
      p += 46 + nlen + xlen + clen;
      if (name.endsWith('/') || name.includes('..') || name.startsWith('/') || /(^|\/)__MACOSX\//.test(name)) continue;
      if (!/\.(jpe?g|png|webp|gif|avif)$/i.test(name)) continue;
      total += usize;
      if (usize > 60e6 || total > 1.5e9 || (csize && usize / csize > 200)) throw new Error('The archive is too large or looks unsafe.');
      out.push({ name, method, csize, usize, local });
    }
    out.sort((a, b) => natCmp(a.name, b.name));
    return out;
  },
  async read(blob, e) {
    const h = new DataView(await blob.slice(e.local, e.local + 30).arrayBuffer());
    if (h.getUint32(0, true) !== 0x04034b50) throw new Error('The archive is damaged.');
    const start = e.local + 30 + h.getUint16(26, true) + h.getUint16(28, true);
    const data = blob.slice(start, start + e.csize);
    const type = /\.png$/i.test(e.name) ? 'image/png' : /\.webp$/i.test(e.name) ? 'image/webp' : /\.gif$/i.test(e.name) ? 'image/gif' : /\.avif$/i.test(e.name) ? 'image/avif' : 'image/jpeg';
    if (e.method === 0) return new Blob([data], { type });
    if (e.method !== 8) throw new Error('Unsupported compression in the archive.');
    const stream = data.stream().pipeThrough(new DecompressionStream('deflate-raw'));
    const out = await new Response(stream).blob();
    if (out.size > 60e6) throw new Error('A page in the archive is too large.');
    return new Blob([out], { type });
  },
};

async function importArchive(file) {
  const entries = await Zip.entries(file.blob);
  if (!entries.length) throw new Error('No images were found in this archive.');
  const base = file.name.replace(/\.(cbz|zip)$/i, '').replace(/[_]+/g, ' ').trim() || 'Imported archive';
  const seriesId = 'local-' + uid();
  const key = Store.key('local', seriesId);
  const chKey = key + '|1';
  let i = 0, bytes = 0, cover = '';
  for (const e of entries) {
    const blob = await Zip.read(file.blob, e);
    await validateImage(blob);
    await DB.put('pages', { chapterKey: chKey, i, blob, tiles: null });
    if (i === 0) cover = 'local';
    bytes += blob.size; i++;
  }
  const s = { key, source: 'local', id: seriesId, title: base, cover, inLibrary: 0, categories: [], addedAt: 0, status: 'unknown', tags: [], desc: 'Imported from ' + file.name, prefs: {}, baseline: true, unread: 0, dlCount: 0, chapterCount: 0 };
  await Store.saveSeries(s);
  await DB.put('chapters', { key: chKey, series: key, id: '1', label: base, num: '', sortIdx: 0, read: false, bookmark: false, discovered: Date.now(), date: Date.now() });
  await Downloads.set({ chapterKey: chKey, seriesKey: key, label: base, state: 'complete', done: i, total: i, bytes, error: '', at: Date.now() });
  await Store.addToLibrary(s, []);
  return s;
}

/** Cover for local archives: first stored page. */
const localCovers = new Map();
async function localCover(s) {
  if (localCovers.has(s.key)) return localCovers.get(s.key);
  const p = await DB.get('pages', [s.key + '|1', 0]);
  const url = p ? URL.createObjectURL(p.blob) : '';
  localCovers.set(s.key, url);
  return url;
}
function coverSrc(s) {
  if (!s) return '';
  if (s.source === 'local') return '';
  const src = Sources.get(s.source);
  return s.cover ? Net.img(s.cover, src && src.referer) : '';
}
/** Second-choice cover address (MangaDex: full-size original when the thumbnail is missing). */
function coverAlt(s) {
  if (!s || !s.cover || s.source === 'local') return '';
  const src = Sources.get(s.source);
  const full = s.cover.replace(/(\/covers\/[^/]+\/[^/?]+?)\.(256|512)\.jpg$/, '$1');
  return full !== s.cover ? Net.img(full, src && src.referer) : '';
}

// ---------------------------------------------------------------- backups
const Backup = {
  async build() {
    const lib = Store.library();
    const keys = new Set(lib.map(s => s.key));
    const chapters = (await DB.all('chapters')).filter(c => keys.has(c.series) && (c.read || c.bookmark || c.manifest))
      .map(c => ({ series: c.series, id: c.id, label: c.label, read: !!c.read, bookmark: !!c.bookmark,
        ...(c.manifest ? { manifest: c.manifest.slice(0, 600).map(p => ({ url: p.url })), url: c.url, referer: c.referer, experimental: true } : {}) }));
    const progress = (await DB.all('progress')).filter(p => keys.has(p.chapterKey.split('|')[0])).map(p => ({ chapterKey: p.chapterKey, page: p.page, frac: p.frac, pages: p.pages, done: !!p.done, at: p.at }));
    const history = (await DB.all('history')).filter(h => keys.has(h.seriesKey));
    const prefs = structuredClone(Prefs.data);
    return {
      app: 'otakuvault', version: 1, created: new Date().toISOString(), appVersion: APP_VERSION,
      note: 'Metadata backup. Chapter images and downloads are not included. No cookies, passwords or tokens are stored.',
      series: lib.filter(s => s.source !== 'local').map(s => ({ key: s.key, source: s.source, id: s.id, title: s.title, cover: s.cover, url: s.url, categories: s.categories, addedAt: s.addedAt, lastReadAt: s.lastReadAt || 0, prefs: s.prefs || {}, status: s.status, author: s.author || '', website: !!s.website, experimental: !!s.experimental })),
      localSkipped: lib.filter(s => s.source === 'local').map(s => s.title),
      chapters, progress, history, categories: Store.categories, prefs, customSources: await DB.meta('customSources', []),
    };
  },
  validate(j) {
    const errs = [];
    if (!j || typeof j !== 'object') return { ok: false, errs: ['This file is not an Otaku Vault backup.'] };
    if (j.app !== 'otakuvault') errs.push('This file is not an Otaku Vault backup.');
    if (typeof j.version !== 'number') errs.push('The backup has no version.');
    else if (j.version > 1) errs.push('This backup was made by a newer version of the app.');
    if (!Array.isArray(j.series)) errs.push('The backup has no series list.');
    if (errs.length) return { ok: false, errs };
    const series = j.series.filter(s => s && typeof s.source === 'string' && typeof s.id === 'string' && /^[\w.:-]{1,64}$/.test(s.source) && s.id.length < 400 && typeof s.title === 'string').slice(0, 20000);
    const skipped = j.series.length - series.length;
    return { ok: true, errs: [], prefs: j.prefs && typeof j.prefs === 'object' ? j.prefs : null, created: typeof j.created === 'string' ? j.created : '', localSkipped: Array.isArray(j.localSkipped) ? j.localSkipped.length : 0, series, skipped, chapters: Array.isArray(j.chapters) ? j.chapters.slice(0, 500000) : [], progress: Array.isArray(j.progress) ? j.progress : [], history: Array.isArray(j.history) ? j.history : [], categories: Array.isArray(j.categories) ? j.categories.filter(c => typeof c === 'string').slice(0, 100) : null, customSources: Array.isArray(j.customSources) ? j.customSources : [] };
  },
  async restore(v, mode) {
    await DB.setMeta('preRestoreBackup', await this.build());
    if (mode === 'replace') {
      for (const s of Store.library()) { s.inLibrary = 0; await Store.saveSeries(s); }
    }
    const str = x => (typeof x === 'string' ? x.slice(0, 2000) : '');
    for (const b of v.series) {
      const key = Store.key(b.source, b.id);
      const s = Store.get(key) || { key, source: b.source, id: b.id, inLibrary: 0, categories: [], prefs: {}, unread: 0, dlCount: 0, chapterCount: 0, baseline: false };
      s.title = str(b.title) || s.title || 'Untitled';
      s.cover = /^https:\/\//.test(b.cover || '') ? b.cover : s.cover || '';
      s.url = /^https:\/\//.test(b.url || '') ? b.url : s.url || '';
      s.status = str(b.status) || s.status || 'unknown';
      s.author = str(b.author) || s.author || '';
      s.categories = Array.isArray(b.categories) ? b.categories.filter(c => typeof c === 'string').slice(0, 20) : s.categories;
      s.prefs = b.prefs && typeof b.prefs === 'object' ? sanitizeReaderPrefs(b.prefs) : s.prefs;
      s.inLibrary = 1; s.addedAt = b.addedAt || s.addedAt || Date.now(); s.restoredPending = true;
      if (b.lastReadAt) s.lastReadAt = Math.max(+b.lastReadAt || 0, s.lastReadAt || 0);
      if (b.website) s.website = true;
      if (b.experimental) s.experimental = true;
      await Store.saveSeries(s);
    }
    const chRecs = [];
    for (const c of v.chapters) {
      if (!c || typeof c.series !== 'string' || typeof c.id !== 'string') continue;
      if (!Store.get(c.series)) continue;
      const key = c.series + '|' + c.id;
      const old = await DB.get('chapters', key);
      const rec = { ...(old || { key, series: c.series, id: c.id, label: str(c.label) || c.id, sortIdx: 0, discovered: Date.now() }), read: !!c.read || !!(old && old.read), bookmark: !!c.bookmark || !!(old && old.bookmark) };
      if (Array.isArray(c.manifest) && !(old && old.manifest)) {
        rec.manifest = c.manifest.filter(p => p && /^https:\/\//.test(p.url || '')).slice(0, 600).map(p => ({ url: p.url }));
        rec.experimental = true; rec.url = /^https:\/\//.test(c.url || '') ? c.url : ''; rec.referer = /^https:\/\//.test(c.referer || '') ? c.referer : '';
      }
      chRecs.push(rec);
    }
    await DB.putMany('chapters', chRecs);
    for (const p of v.progress) if (p && typeof p.chapterKey === 'string' && Store.get(p.chapterKey.split('|')[0])) await DB.put('progress', { chapterKey: p.chapterKey, page: +p.page || 0, frac: +p.frac || 0, pages: +p.pages || 0, done: !!p.done, at: +p.at || Date.now() });
    for (const h of v.history) if (h && typeof h.seriesKey === 'string' && Store.get(h.seriesKey)) await DB.put('history', { seriesKey: h.seriesKey, chapterKey: str(h.chapterKey), label: str(h.label), title: str(h.title), at: +h.at || Date.now() });
    if (v.prefs && typeof v.prefs === 'object') {
      const keep = { incognito: Prefs.data.incognito, downloadedOnly: Prefs.data.downloadedOnly };
      const reader = v.prefs.reader && typeof v.prefs.reader === 'object' ? sanitizeReaderPrefs(v.prefs.reader) : {};
      const safe = {};
      for (const k of Object.keys(DEFAULT_PREFS)) if (k !== 'reader' && k in v.prefs && typeof v.prefs[k] === typeof DEFAULT_PREFS[k]) safe[k] = v.prefs[k];
      Prefs.data = deepMerge(Prefs.data, safe);
      Object.assign(Prefs.data.reader, reader);
      Object.assign(Prefs.data, keep);
      Prefs.save();
    }
    if (v.categories) await Store.saveCategories([...new Set([...(mode === 'merge' ? Store.categories : []), ...v.categories])]);
    const customs = v.customSources.filter(c => c && /^custom-[\w-]+$/.test(c.id) && /^https:\/\//.test(c.base || ''));
    if (customs.length) {
      const cur = await DB.meta('customSources', []);
      const merged = [...cur]; customs.forEach(c => { if (!merged.find(x => x.id === c.id)) merged.push({ id: c.id, name: str(c.name), base: c.base, sub: str(c.sub) || 'manga', pageParam: !!c.pageParam, nsfw: !!c.nsfw }); });
      await DB.setMeta('customSources', merged);
      await loadCustomSources();
    }
    for (const s of Store.library()) await Store.recount(s, true);
    Store.emit('library');
  },
};

function sanitizeReaderPrefs(p) {
  const out = {};
  const d = DEFAULT_PREFS.reader;
  for (const k of Object.keys(p)) if (k in d && typeof p[k] === typeof d[k]) out[k] = p[k];
  return out;
}

// ---------------------------------------------------------------- automatic backup
/**
 * Keeps one chosen backup file (ideally in Google Drive) up to date. Also keeps the last
 * three backups inside the app as a safety net against a damaged database.
 */
const AutoBackup = {
  dirty: false, writing: false, timer: null,
  target() { if (!NATIVE) return null; try { return JSON.parse(Native.call('autoBackupTarget') || 'null'); } catch { return null; } },
  async status() { return { target: this.target(), last: await DB.meta('autoBackupLast', 0), error: await DB.meta('autoBackupError', '') }; },
  init() {
    Store.on(w => { if (w === 'library' || w === 'history' || w === 'downloads') this.markDirty(); });
  },
  markDirty() {
    this.dirty = true;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.run('change'), 5 * 60000);
  },
  pick() {
    return new Promise(resolve => {
      window.ovAutoPicked = (info, persisted) => { window.ovAutoPicked = null; resolve(info ? { ...info, persisted } : null); };
      Native.call('pickAutoBackup', 'otakuvault-auto-backup.json');
    });
  },
  write(bytes) {
    return new Promise(resolve => {
      window.ovAutoWritten = (ok, err) => { window.ovAutoWritten = null; resolve({ ok, err }); };
      Native.call('writeAutoBackup', b64FromBytes(bytes));
    });
  },
  /** reason: manual | change | pause | launch */
  async run(reason) {
    if (this.writing || !Store.library().length) return { ok: false, err: 'nothing to back up' };
    const last = await DB.meta('autoBackupLast', 0);
    if (reason !== 'manual' && !this.dirty && Date.now() - last < 6 * 3600e3) return { ok: true, skipped: true };
    this.writing = true;
    try {
      const b = await Backup.build();
      const bytes = new TextEncoder().encode(JSON.stringify(b));
      const local = (await DB.meta('localBackups', [])).filter(x => x && x.created);
      local.unshift({ created: b.created, data: b });
      await DB.setMeta('localBackups', local.slice(0, 3));
      if (!this.target()) return { ok: false, err: 'not set up' };
      const r = await this.write(bytes);
      if (r.ok) { this.dirty = false; await DB.setMeta('autoBackupLast', Date.now()); await DB.setMeta('autoBackupError', ''); }
      else await DB.setMeta('autoBackupError', r.err || 'Unknown error');
      return r;
    } finally { this.writing = false; }
  },
};

// ---------------------------------------------------------------- paid / official-only detection for browse results
const LockInfo = {
  mem: new Map(), loaded: false,
  async load() { if (this.loaded) return; const c = await DB.meta('lockCache', {}); Object.entries(c).forEach(([k, v]) => { if (Date.now() - v.at < 3 * 864e5) this.mem.set(k, v.state); }); this.loaded = true; },
  async save() { const o = {}; for (const [k, v] of this.mem) o[k] = { state: v, at: Date.now() }; await DB.setMeta('lockCache', o); },
  /** Known state for a series: 'locked' | 'some' | 'free' | 'none' | '' (unknown). */
  get(srcId, id) {
    const s = Store.get(Store.key(srcId, id));
    if (s && s.chapterCount) return s.allLocked ? 'locked' : s.lockedCount ? 'some' : 'free';
    return this.mem.get(srcId + ':' + id) || '';
  },
  /** Probes unknown items (MangaDex only) a few at a time and calls back as answers arrive. */
  async probe(src, items, onEach, isAlive) {
    if (!src.probeLock) return;
    await this.load();
    const todo = items.filter(it => !this.get(src.id, it.id));
    let dirty = false;
    const worker = async () => {
      while (todo.length && (!isAlive || isAlive())) {
        const it = todo.shift();
        try { const st = await src.probeLock(it.id); this.mem.set(src.id + ':' + it.id, st); dirty = true; onEach(it.id, st); } catch { /* unknown stays unknown */ }
      }
    };
    await Promise.all([worker(), worker()]);
    if (dirty) this.save();
  },
};
function lockBadge(state) {
  if (state === 'locked') return html`<span class="badge paid" title="Only on the official paid site">$ Official</span>`;
  if (state === 'none') return html`<span class="badge" title="No chapters in your languages">No EN</span>`;
  if (state === 'some') return html`<span class="badge paidsome" title="Some chapters are locked">🔒 Some</span>`;
  return '';
}

const icon = (name, extra = '') => raw(`<svg class="i ${extra}" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[name] || ''}"/></svg>`);

const UI = {
  tab: 'library',
  roots: {},
  stack: [],
  overlays: [],
  layout: '',

  init() {
    this.applyLayout();
    window.addEventListener('resize', debounce(() => this.applyLayout(), 120));
    this.renderNav();
  },

  applyLayout() {
    const wide = window.innerWidth >= 600;
    const lay = wide ? 'wide' : 'compact';
    if (lay !== this.layout) {
      document.body.classList.remove('wide', 'compact');
      document.body.classList.add(lay);
      this.layout = lay;
    }
    const g = Prefs.data.gridSize;
    const w = window.innerWidth - (wide ? 88 : 0) - 24;
    const auto = wide ? Math.max(120, Math.floor((w - 40) / 5)) : Math.max(100, Math.floor((w - 20) / 3));
    const cardw = g ? Math.max(90, Math.floor(w / g) - 10) : Math.min(auto, 230);
    document.documentElement.style.setProperty('--cardw', cardw + 'px');
  },

  NAV: [['library', 'Library', 'library'], ['updates', 'Updates', 'updates'], ['history', 'History', 'history'], ['browse', 'Browse', 'browse'], ['more', 'More', 'moreh']],

  renderNav() {
    const nav = $('#nav');
    nav.setAttribute('aria-label', 'Main');
    nav.innerHTML = this.NAV.map(([id, label, ic]) => html`<button class="navbtn" data-tab="${id}" aria-label="${label}"><span class="pillwrap">${icon(ic)}</span><span>${label}</span></button>`).join('');
    nav.onclick = e => { const b = e.target.closest('[data-tab]'); if (b) this.go(b.dataset.tab); };
    this.updateBadges();
  },

  async updateBadges() {
    const n = (await DB.all('updates')).filter(u => !u.seen).length;
    const b = $('#nav [data-tab="updates"]');
    if (!b) return;
    let dot = b.querySelector('.dot');
    if (n) { if (!dot) { dot = el('<span class="dot"></span>'); b.appendChild(dot); } dot.textContent = n > 99 ? '99+' : n; }
    else if (dot) dot.remove();
  },

  go(tab) {
    while (this.stack.length) this.pop(true);
    this.tab = tab;
    $$('#nav .navbtn').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
    for (const [id, v] of Object.entries(this.roots)) v.el.hidden = id !== tab;
    const v = this.roots[tab];
    if (v) v.show();
  },

  registerRoot(id, view) {
    view.el.hidden = true;
    $('#main').appendChild(view.el);
    this.roots[id] = view;
  },

  /** Pushes a full screen. view = { el, onPop?, onShow? } */
  push(view) {
    const top = this.stack[this.stack.length - 1];
    if (top) top.el.hidden = true; else if (this.roots[this.tab]) this.roots[this.tab].el.hidden = true;
    $('#main').appendChild(view.el);
    this.stack.push(view);
    const f = view.el.querySelector('[data-autofocus]');
    if (f) setTimeout(() => f.focus(), 50);
  },

  pop(silent) {
    const v = this.stack.pop();
    if (!v) return;
    v.onPop && v.onPop();
    v.el.remove();
    const top = this.stack[this.stack.length - 1];
    if (top) { top.el.hidden = false; top.onShow && top.onShow(); }
    else if (this.roots[this.tab]) { this.roots[this.tab].el.hidden = false; if (!silent) this.roots[this.tab].show(); }
  },

  back() {
    if (this.overlays.length) { this.overlays[this.overlays.length - 1].close(); return true; }
    if (Reader.open) { Reader.back(); return true; }
    const top = this.stack[this.stack.length - 1];
    if (top && top.onBack && top.onBack()) return true;
    if (this.stack.length) { this.pop(); return true; }
    if (this.roots[this.tab] && this.roots[this.tab].onBack && this.roots[this.tab].onBack()) return true;
    if (this.tab !== 'library') { this.go('library'); return true; }
    return false;
  },

  overlay(node, { onClose, sheet = false } = {}) {
    const scrim = el(`<div class="scrim${sheet ? ' sheet-scrim' : ''}"></div>`);
    scrim.appendChild(node);
    document.body.appendChild(scrim);
    const o = {
      node, scrim,
      close: () => {
        const i = this.overlays.indexOf(o);
        if (i >= 0) this.overlays.splice(i, 1);
        scrim.remove();
        onClose && onClose();
      },
    };
    scrim.addEventListener('click', e => { if (e.target === scrim) o.close(); });
    this.overlays.push(o);
    const f = node.querySelector('[data-autofocus]');
    if (f) setTimeout(() => f.focus(), 60);
    return o;
  },

  /** Simple dialog. buttons: [{label, value, primary, danger}] → resolves to value (or null on dismiss). */
  dialog({ title, body = '', buttons = [{ label: 'OK', value: true, primary: true }], node = null }) {
    return new Promise(resolve => {
      let result = null;
      const d = el(html`<div class="dialog" role="dialog" aria-modal="true" aria-label="${title || 'Dialog'}">
        ${title ? html`<div class="dh">${title}</div>` : ''}
        <div class="db">${raw(String(body))}</div>
        <div class="df">${buttons.map((b, i) => html`<button class="${b.primary ? 'btn' : 'textbtn'}" data-i="${i}" ${b.primary ? raw('data-autofocus') : ''}>${b.label}</button>`)}</div>
      </div>`);
      if (node) d.querySelector('.db').appendChild(node);
      const o = this.overlay(d, { onClose: () => resolve(result) });
      d.querySelector('.df').onclick = e => {
        const b = e.target.closest('[data-i]');
        if (!b) return;
        const spec = buttons[+b.dataset.i];
        result = typeof spec.value === 'function' ? spec.value(d) : spec.value;
        if (result === undefined) return; // validation failed, keep open
        o.close();
      };
    });
  },
  confirm(title, body, okLabel = 'OK', danger = false) {
    return this.dialog({ title, body: esc(body), buttons: [{ label: 'Cancel', value: false }, { label: okLabel, value: true, primary: true, danger }] });
  },
  prompt(title, label, value = '', okLabel = 'Save') {
    const node = el(html`<label style="display:block"><span class="sr">${label}</span><input class="field" value="${value}" placeholder="${label}" data-autofocus></label>`);
    return this.dialog({ title, node, buttons: [{ label: 'Cancel', value: null }, { label: okLabel, primary: true, value: d => d.querySelector('input').value.trim() }] });
  },

  sheet(node, opts = {}) {
    const s = el('<div class="sheet" role="dialog" aria-modal="true"></div>');
    if (opts.label) s.setAttribute('aria-label', opts.label);
    s.appendChild(node);
    if (opts.cls) s.classList.add(opts.cls);
    return this.overlay(s, { sheet: true, onClose: opts.onClose });
  },

  /** Popup menu anchored to an element. items: [{label, action, hidden}] */
  menu(anchor, items) {
    const m = el('<div class="menu" role="menu"></div>');
    items.filter(i => !i.hidden).forEach(i => {
      const b = el(html`<button role="menuitem">${i.label}</button>`);
      b.onclick = () => { o.close(); i.action(); };
      m.appendChild(b);
    });
    const scrim = el('<div style="position:fixed;inset:0;z-index:69"></div>');
    document.body.append(scrim, m);
    const r = anchor.getBoundingClientRect();
    const mw = 240;
    m.style.top = Math.min(r.bottom + 4, window.innerHeight - m.offsetHeight - 8) + 'px';
    m.style.left = Math.max(8, Math.min(r.right - mw, window.innerWidth - mw - 8)) + 'px';
    const o = { close: () => { scrim.remove(); m.remove(); const i = this.overlays.indexOf(o); if (i >= 0) this.overlays.splice(i, 1); } };
    scrim.onclick = () => o.close();
    this.overlays.push(o);
    const first = m.querySelector('button'); if (first) first.focus();
    return o;
  },

  toast(msg, { action, onAction, ms = 3500 } = {}) {
    const t = el(html`<div class="toast" role="status"><span>${msg}</span>${action ? html`<button>${action}</button>` : ''}</div>`);
    $('#toasts').appendChild(t);
    let done = false;
    const close = () => { if (!done) { done = true; t.remove(); } };
    if (action) t.querySelector('button').onclick = () => { close(); onAction && onAction(); };
    setTimeout(close, ms);
    return close;
  },

  /** Long-press detection that cooperates with scrolling. */
  longPress(root, selector, onLong, onTap) {
    let timer = null, start = null, fired = false, target = null;
    const innerControl = (e, t) => { const c = e.target.closest('button,a,input,select,textarea'); return c && c !== t && t.contains(c); };
    root.addEventListener('pointerdown', e => {
      target = e.target.closest(selector);
      if (!target || innerControl(e, target)) return;
      fired = false; start = { x: e.clientX, y: e.clientY };
      timer = setTimeout(() => { fired = true; navigator.vibrate && navigator.vibrate(20); onLong(target, e); }, 480);
    });
    const cancel = () => { clearTimeout(timer); timer = null; };
    root.addEventListener('pointermove', e => { if (start && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 10) cancel(); });
    root.addEventListener('pointerup', cancel);
    root.addEventListener('pointercancel', cancel);
    root.addEventListener('contextmenu', e => { if (e.target.closest(selector)) e.preventDefault(); });
    root.addEventListener('click', e => {
      const t = e.target.closest(selector);
      if (!t || innerControl(e, t)) return;
      if (fired) { e.preventDefault(); e.stopPropagation(); fired = false; return; }
      onTap && onTap(t, e);
    }, true);
  },
};

/** Lazy cover image markup with a fallback letter. */
function coverImg(s, cls = '') {
  if (s.source === 'local') return html`<img class="${cls}" data-local="${s.key}" alt="" loading="lazy">`;
  const src = coverSrc(s);
  return src ? html`<img class="${cls}" src="${src}" alt="" loading="lazy" decoding="async" data-alt="${coverAlt(s)}" data-fallback="${(s.title || '?')[0]}">` : html`<div class="noimg ${cls}">${(s.title || '?')[0]}</div>`;
}
// Broken cover images fall back to a letter tile.
document.addEventListener('error', e => {
  const img = e.target;
  if (img && img.tagName === 'IMG' && img.dataset.fallback != null) {
    // Covers often fail on a busy moment: retry twice (the second time with the alternate address) before giving up.
    const tries = +(img.dataset.tries || 0);
    if (tries < 2 && img.getAttribute('src')) {
      img.dataset.tries = tries + 1;
      const base = img.dataset.base || img.getAttribute('src');
      img.dataset.base = base;
      const next = tries === 1 && img.dataset.alt ? img.dataset.alt : base;
      setTimeout(() => { if (img.isConnected) img.src = next + (next.includes('?') ? '&' : '?') + 't=' + Date.now(); }, 900 * (tries + 1));
      return;
    }
    const d = document.createElement('div');
    d.className = 'noimg ' + img.className;
    d.textContent = img.dataset.fallback;
    img.replaceWith(d);
  }
}, true);
async function hydrateLocalCovers(root) {
  for (const img of $$('img[data-local]', root)) {
    const s = Store.get(img.dataset.local);
    if (s) { const u = await localCover(s); if (u) img.src = u; }
  }
}

function sourceIcon(src, size = 52) {
  return html`<div class="srcicon" style="background:${src.color || '#333'};width:${size}px;height:${size}px;font-size:${Math.round(size * 0.42)}px" aria-hidden="true">${src.letter || src.name[0]}</div>`;
}
function capBadge(src) {
  const t = { integrated: 'Clean reader', website: 'Website only', experimental: 'Experimental', local: 'Local' }[src.cap] || src.cap;
  return html`<span class="cap ${src.cap}">${t}</span>`;

}

      const inp = $('input', bar);

    bar.innerHTML = String(topbar({
      title: 'Library', lead: true,

    }));
  },
  items() {
    const p = Prefs.data, f = p.libraryFilter;
    let list = Store.library();
    if (p.downloadedOnly) list = list.filter(s => s.dlCount > 0 || s.source === 'local');
    if (f.unread) list = list.filter(s => s.unread > 0);
    if (f.downloaded) list = list.filter(s => s.dlCount > 0 || s.source === 'local');
    if (f.source) list = list.filter(s => s.source === f.source);
    if (f.status) list = list.filter(s => (s.status || 'unknown') === f.status);
    if (this.query) {
      const q = this.query.toLowerCase();
      list = list.filter(s => (s.title || '').toLowerCase().includes(q) || (s.alt || []).some(a => a.toLowerCase().includes(q)) || (s.author || '').toLowerCase().includes(q) || (s.tags || []).some(t => t.toLowerCase() === q));
    }
    const cat = p.libraryCategory;
    const all = list;
    if (cat === '__none') list = list.filter(s => !s.categories || !s.categories.length);
    else if (cat !== 'all') list = list.filter(s => (s.categories || []).includes(cat));
    const by = {
      title: (a, b) => natCmp(a.title, b.title),
      lastRead: (a, b) => (b.lastReadAt || 0) - (a.lastReadAt || 0),
      added: (a, b) => (b.addedAt || 0) - (a.addedAt || 0),
      updated: (a, b) => (b.lastUpdateAt || 0) - (a.lastUpdateAt || 0),
      unread: (a, b) => (b.unread || 0) - (a.unread || 0),
      chapters: (a, b) => (b.chapterCount || 0) - (a.chapterCount || 0),
    }[p.librarySort] || ((a, b) => natCmp(a.title, b.title));
    list.sort(by);
    if (p.librarySortDesc) list.reverse();
    return { list, all };
  },
  render() {
    this.bar();

    autoBackupNotice().then(n => { const box = $('.nudge', this.el); if (box) box.innerHTML = String(n); });
    libProgress($('.upline', this.el));
    const { all } = this.items();
    const cats = $('.cats', this.el);
    const lib = Store.library();
    const hasNone = lib.some(s => !s.categories || !s.categories.length);
    const count = c => all.filter(s => (s.categories || []).includes(c)).length;
    const cur = Prefs.data.libraryCategory;
    const chips = [['all', 'All', all.length], ...(hasNone ? [['__none', 'Uncategorized', all.filter(s => !s.categories || !s.categories.length).length]] : []), ...Store.categories.map(c => [c, c, count(c)])];
    if (!chips.find(c => c[0] === cur)) Prefs.set('libraryCategory', 'all');
    const sortNames = { title: 'Title', lastRead: 'Recently read', added: 'Date added', updated: 'Latest chapter', unread: 'Unread', chapters: 'Chapters' };
    cats.innerHTML = String(html`<button class="chip sel" data-act="sortmenu" aria-label="Sort library">${icon(Prefs.data.librarySortDesc ? 'up' : 'down')} ${sortNames[Prefs.data.librarySort] || 'Title'}</button>${chips.map(([id, label, n]) => html`<button class="chip" role="tab" aria-pressed="${id === Prefs.data.libraryCategory}" data-cat="${id}">${label} <small>${n}</small></button>`)}`);
    cats.hidden = !lib.length;
    $('.fab', this.el).hidden = !!this.sel.size;
    this.renderContent();
  },
  renderContent() {
    const box = $('.content', this.el);
    const { list } = this.items();
    const lib = Store.library();
    if (!lib.length) {
      box.innerHTML = String(html`<div class="empty"><div class="big">${icon('library')}</div><b>Add your first series</b>
        <span>Paste a link to a series or chapter, or browse a source.</span>
        <div class="btnrow"><button class="btn" data-act="add">${icon('link')} Paste link</button><button class="btn tonal" data-act="gobrowse">Browse sources</button></div>
        <span style="margin-top:18px">New phone, or coming from Tachiyomi / Mihon? Bring your library and progress over.</span><button class="btn ghost" data-act="restore">${icon('upload')} Restore from backup</button></div>`);
      return;
    }
    if (!list.length) { box.innerHTML = String(html`<div class="empty"><b>Nothing here</b><span>No series match the current category, search or filters.</span></div>`); return; }
    const p = Prefs.data;
    const badges = s => html`${p.showUnreadBadge && s.unread ? html`<span class="badge unread">${s.unread}</span>` : ''}${p.showDownloadBadge && s.dlCount ? html`<span class="badge dl">${s.dlCount}</span>` : ''}${Sources.get(s.source) && Sources.get(s.source).website ? html`<span class="badge web">WEB</span>` : ''}${s.allLocked ? lockBadge('locked') : ''}${needsSource(s) ? html`<span class="badge web">MOVE</span>` : ''}${p.showSourceBadge ? html`<span class="badge">${(Sources.get(s.source) || { name: '?' }).name}</span>` : ''}`;
    box.innerHTML = String(tileContainer(list.map(s => seriesTile(s, {
      cls: this.sel.has(s.key) ? 'sel' : '', attrs: `data-key="${esc(s.key)}"`, badges: badges(s),
      label: s.title + (s.unread ? ', ' + s.unread + ' unread' : ''),

    }))));

  async onClick(e) {
    const t = e.target.closest('[data-act],[data-cat]');
    if (!t) return;
    if (t.dataset.cat) { Prefs.set('libraryCategory', t.dataset.cat); this.render(); return; }
    const act = t.dataset.act;
    const selected = () => [...this.sel].map(k => Store.get(k)).filter(Boolean);
    switch (act) {
      case 'add': AddLink.open(); break;
      case 'gobrowse': UI.go('browse'); break;

      case 'mover': openMover(false); break;

        UI.menu(t, [...opts.map(([v, l]) => ({ label: (Prefs.data.librarySort === v ? '✓ ' : '') + l, action: () => { Prefs.data.librarySort = v; Prefs.data.librarySortDesc = false; Prefs.save(); this.render(); } })),
          { label: Prefs.data.librarySortDesc ? 'Reverse order: on' : 'Reverse order', action: () => { Prefs.set('librarySortDesc', !Prefs.data.librarySortDesc); this.render(); } }]);
        break;
      }
      case 'autosetup': case 'autofix': await setupAutoBackup(); this.render(); break;
      case 'nudgeoff': await DB.setMeta('backupNudgeDismissed', Date.now()); this.render(); break;
      case 'search': this.searching = true; this.render(); break;
      case 'closesearch': this.searching = false; this.query = ''; this.render(); break;
      case 'filter': libraryFilterSheet(); break;
      case 'menu': UI.menu(t, [
        { label: 'Update library', action: () => runLibraryUpdate(true) },
        { label: 'Update this category', hidden: Prefs.data.libraryCategory === 'all', action: () => runLibraryUpdate(true, this.items().list.map(s => s.key)) },
        { label: `Auto-migrate series with no source${needsSourceList().length ? ' (' + needsSourceList().length + ')' : ''}`, action: () => autoMigrateNoSource() },
        { label: 'Add link', action: () => AddLink.open() },
        { label: 'Import CBZ / ZIP archive', action: importArchiveFlow },
        { label: 'Select all', action: () => { this.items().list.forEach(s => this.sel.add(s.key)); this.render(); } },
      ]); break;
      case 'clearsel': this.sel.clear(); this.render(); break;
      case 'selall': this.items().list.forEach(s => this.sel.add(s.key)); this.render(); break;
      case 'selcat': { const ss = selected(); const cats = await pickCategories(ss.length === 1 ? ss[0].categories : []); if (cats) { for (const s of ss) { s.categories = cats; await Store.saveSeries(s); } this.sel.clear(); Store.emit('library'); } break; }
      case 'selread': {
        const ss = selected();
        const before = [];
        for (const s of ss) { const ch = (await Store.chapters(s.key)).filter(c => !c.read); before.push(...ch); await Store.setRead(ch, true); }
        this.sel.clear(); this.render();
        UI.toast(`Marked ${plural(before.length, 'chapter')} as read`, { action: 'Undo', onAction: () => Store.setRead(before, false) });
        break;
      }
      case 'seldl': { let n = 0; for (const s of selected()) n += await Downloads.enqueue(s.key, (await Store.chapters(s.key)).filter(c => !c.read)); this.sel.clear(); this.render(); UI.toast(n ? `Queued ${plural(n, 'chapter')}` : 'Nothing to download (website and local entries cannot be downloaded)'); break; }
      case 'selrm': {
        const ss = selected();
        const hasDl = ss.some(s => s.dlCount);
        const node = el(html`<div><p>Remove ${plural(ss.length, 'series')} from your library? Reading progress is kept if you add them again.</p>${hasDl ? html`<button class="check" role="checkbox" aria-checked="false" data-dl><span class="box"></span>Also delete downloaded chapters</button>` : ''}</div>`);
        const cb = $('[data-dl]', node);
        if (cb) cb.onclick = () => cb.setAttribute('aria-checked', cb.getAttribute('aria-checked') !== 'true');
        const ok = await UI.dialog({ title: 'Remove from library', node, buttons: [{ label: 'Cancel', value: false }, { label: 'Remove', value: true, primary: true }] });
        if (!ok) break;
        const delDl = cb && cb.getAttribute('aria-checked') === 'true';
        const keys = ss.map(s => s.key);
        await Store.removeFromLibrary(keys, { deleteDownloads: delDl });
        this.sel.clear(); this.render();
        if (!delDl) UI.toast(`Removed ${plural(keys.length, 'series')}`, { action: 'Undo', onAction: async () => { for (const k of keys) { const s = Store.get(k); if (s) await Store.addToLibrary(s); } } });
        else UI.toast(`Removed ${plural(keys.length, 'series')} and deleted downloads`);
        break;
      }
    }
  },
};

      else if (grp === 'f') p.libraryFilter[k] = !p.libraryFilter[k];
      else p[k] = !p[k];
    } else if (t.dataset.src != null) p.libraryFilter.source = t.dataset.src;
    else if (t.dataset.status != null) p.libraryFilter.status = t.dataset.status;
    else if (t.dataset.sort) { if (p.librarySort === t.dataset.sort) p.librarySortDesc = !p.librarySortDesc; else { p.librarySort = t.dataset.sort; p.librarySortDesc = false; } }
    else if (t.dataset.display) p.displayMode = t.dataset.display;
    Prefs.save(); draw(); LibraryView.render();
  });
  node.addEventListener('input', e => { if (e.target.dataset.grid != null) { p.gridSize = +e.target.value; Prefs.save(); UI.applyLayout(); draw(); LibraryView.render(); } });
  draw();
  UI.sheet(node, { label: 'Library filters' });
}

async function pickCategories(current = []) {
  let chosen = new Set(current || []);
  const node = el('<div></div>');
  const draw = () => {
    node.innerHTML = String(html`${Store.categories.length ? '' : html`<p>No categories yet.</p>`}${Store.categories.map(c => html`<button class="check" role="checkbox" aria-checked="${chosen.has(c)}" data-c="${c}"><span class="box"></span>${c}</button>`)}<button class="textbtn" data-new>+ New category</button>`);
  };
  node.onclick = async e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.c) { if (chosen.has(t.dataset.c)) chosen.delete(t.dataset.c); else chosen.add(t.dataset.c); draw(); }
    if (t.dataset.new != null) { const n = await UI.prompt('New category', 'Category name', '', 'Create'); if (n && !Store.categories.includes(n)) { await Store.saveCategories([...Store.categories, n.slice(0, 40)]); chosen.add(n.slice(0, 40)); } draw(); }
  };
  draw();
  const ok = await UI.dialog({ title: 'Set categories', node, buttons: [{ label: 'Cancel', value: false }, { label: 'OK', value: true, primary: true }] });
  return ok ? [...chosen] : null;
}

async function runLibraryUpdate(manual, keys) {
  if (Store.updating) { UI.toast('The library is already updating'); return; }
  if (!Store.library().length) { UI.toast('Your library is empty'); return; }
  UI.toast('Updating library…');
  const r = await Store.updateLibrary({ manual, keys });
  if (!r) return;
  UI.updateBadges();
  UI.toast(r.added ? `${plural(r.added, 'new chapter')} found` + (r.failed ? ` · ${r.failed} failed` : '') : r.failed ? `Update finished · ${plural(r.failed, 'series')} could not be checked` : 'No new chapters');
}

async function importArchiveFlow() {
  const f = await Native.openFile('application/*');
  if (!f) return;
  const close = UI.toast('Importing ' + f.name + '…', { ms: 60000 });
  try { const s = await importArchive(f); close(); UI.toast('Imported ' + s.title); LibraryView.render(); }
  catch (e) { close(); UI.dialog({ title: 'Import failed', body: esc(e.message) }); }
}

const UpdatesView = {
  el: null, sel: new Set(),
  build() {
    this.el = screen('updates');
    this.el.addEventListener('click', e => this.onClick(e));
    Store.on(w => { if ((w === 'updates' || w === 'updating' || w === 'downloads' || w === 'library') && !this.el.hidden) this.render(); });
    return this;
  },
  async show() {

  },
  async render() {
    const ups = (await DB.all('updates')).sort((a, b) => b.at - a.at || (b.date || 0) - (a.date || 0)).slice(0, 600);
    const lastOk = await DB.meta('lastUpdateOk', 0), lastTry = await DB.meta('lastUpdateAttempt', 0);
    const chs = new Map();
    for (const u of ups) { const c = await DB.get('chapters', u.key); if (c) chs.set(u.key, c); }
    let body = '';
    let lastDay = '';
    const rows = [];
    for (const u of ups) {
      const s = Store.get(u.seriesKey), c = chs.get(u.key);
      if (!s || !c) continue;
      const d = dayKey(u.at);
      if (d !== lastDay) { rows.push(html`<div class="group">${dayLabel(u.at)}</div>`); lastDay = d; }
      const dl = Downloads.get(c.key);
      rows.push(html`<div class="row ${c.read ? 'read' : ''}" data-ch="${c.key}" role="button" tabindex="0">${coverImg(s, 'cov')}
        <div class="body"><div class="t">${s.title}</div><div class="s">${!c.read ? html`<span class="udot" aria-label="Unread"></span>` : ''}${c.label}${c.title ? ' - ' + c.title : ''}${u.date ? html` <span style="color:var(--text3)">· released ${dateShort(u.date)}</span>` : ''}</div></div>
        ${dlButton(c, dl)}</div>`);
    }
    body = rows.length ? rows.join('') : String(html`<div class="empty"><div class="big">${icon('updates')}</div><b>No recent updates</b><span>New chapters for series in your library appear here after a library update. The first check of a series sets its baseline, so nothing shows until a later release.</span></div>`);
    const keepU = ($('.scroll', this.el) || {}).scrollTop || 0;
    this.el.innerHTML = String(html`${topbar({ title: 'Updates', lead: true, actions: html`<button class="iconbtn" data-act="refresh" aria-label="Update library">${Store.updating ? raw('<div class="spinner sm"></div>') : icon('refresh')}</button><button class="iconbtn" data-act="menu" aria-label="More">${icon('more')}</button>` })}
      ${incognitoBanner()}
      <div class="scroll"><div style="padding:0 16px;color:var(--text2);font-style:italic;font-size:14px">${Store.updating ? `Updating ${Store.updating.done}/${Store.updating.total}…` : 'Library last updated: ' + agoLabel(lastOk)}${lastTry && lastTry > lastOk + 60000 ? html`<br><span style="color:var(--warn)">Last attempt ${agoLabel(lastTry)} did not finish cleanly.</span>` : ''}</div>${raw(body)}</div>`);
    if (keepU) $('.scroll', this.el).scrollTop = keepU;
    hydrateLocalCovers(this.el);
  },
  async onClick(e) {
    const t = e.target.closest('[data-act],[data-ch],[data-dl]');
    if (!t) return;
    if (t.dataset.dl) { e.stopPropagation(); return dlAction(t, t.dataset.dl); }
    if (t.dataset.act === 'refresh') return runLibraryUpdate(true);
    if (t.dataset.act === 'menu') return UI.menu(t, [{ label: 'Clear update list', action: async () => { if (await UI.confirm('Clear updates', 'This clears the list only. Chapters and read states stay.', 'Clear')) { await DB.clear('updates'); this.render(); UI.updateBadges(); } } }]);
    if (t.dataset.ch) {
      const c = await DB.get('chapters', t.dataset.ch);
      const s = c && Store.get(c.series);
      if (s && c) Reader.openChapter(s, c);
    }
  },
};

function dlButton(c, dl) {
  if (c.locked || c.external) return html`<span class="iconbtn" title="Locked" aria-label="Locked">${icon('open')}</span>`;
  const st = dl ? dl.state : '';
  if (st === 'complete') return html`<button class="iconbtn" data-dl="${c.key}" aria-label="Downloaded" style="color:var(--accent)">${icon('downloaded')}</button>`;
  if (st === 'running') return html`<button class="iconbtn" data-dl="${c.key}" aria-label="Downloading ${dl.done} of ${dl.total}"><div class="spinner sm"></div></button>`;
  if (st === 'queued' || st === 'waiting') return html`<button class="iconbtn" data-dl="${c.key}" aria-label="Queued" style="color:var(--text3)">${icon('queue')}</button>`;
  if (st === 'failed') return html`<button class="iconbtn" data-dl="${c.key}" aria-label="Download failed" style="color:var(--danger)">${icon('error')}</button>`;
  return html`<button class="iconbtn" data-dl="${c.key}" aria-label="Download">${icon('download')}</button>`;
}
async function dlAction(btn, key) {
  const d = Downloads.get(key);
  if (d && d.state === 'complete') {
    UI.menu(btn, [{ label: 'Delete download', action: async () => { await Downloads.remove(key); UI.toast('Download deleted'); } }]);
  } else if (d && (d.state === 'queued' || d.state === 'running' || d.state === 'waiting')) {
    UI.menu(btn, [{ label: 'Cancel download', action: () => Downloads.cancel(key) }]);
  } else if (d && d.state === 'failed') {
    UI.menu(btn, [{ label: 'Retry download', action: async () => { const c = await DB.get('chapters', key); await Downloads.remove(key); Downloads.enqueue(c.series, [c]); } }, { label: 'Show error', action: () => UI.dialog({ title: 'Download failed', body: esc(d.error || 'Unknown error') }) }, { label: 'Remove', action: () => Downloads.remove(key) }]);
  } else {
    const c = await DB.get('chapters', key);
    const n = await Downloads.enqueue(c.series, [c]);
    if (!n) UI.toast('This chapter cannot be downloaded');
  }
}

const HistoryView = {

    const rows = []; let last = '';

      const c = h && await DB.get('chapters', h.chapterKey);
