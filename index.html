/* ==========================================================================
   Otaku Vault — native-style reader
   Long strip (continuous, optional gaps) and paged (LTR / RTL / vertical).
   Progress = chapter + page index + fraction through that page.
   ========================================================================== */

const MODES = [['ltr', 'Paged (left to right)'], ['rtl', 'Paged (right to left)'], ['vertical', 'Paged (vertical)'], ['longstrip', 'Long strip'], ['longstripgap', 'Long strip with gaps']];
const ORIENTS = [['default', 'Default'], ['free', 'Free'], ['portrait', 'Portrait'], ['landscape', 'Landscape'], ['lockedPortrait', 'Locked portrait'], ['lockedLandscape', 'Locked landscape'], ['reversePortrait', 'Reverse portrait']];
const TAPZONES = [['default', 'Default'], ['lshaped', 'L shaped'], ['kindle', 'Kindle-ish'], ['edge', 'Edge'], ['rightleft', 'Right and Left'], ['disabled', 'Disabled']];

const Reader = {
  open: false, el: null, s: null, src: null, list: [], ch: null, pages: [], vpages: [], gen: 0,
  cur: 0, frac: 0, chrome: false, restoring: false, zoom: 1, failed: new Set(), doneTimer: null,
  loading: new Set(), loadQueue: [], active: 0, objUrls: new Map(), dims: {}, settingsOpen: null,

  prefs() { return { ...Prefs.data.reader, ...((this.s && this.s.prefs) || {}) }; },
  get paged() { const m = this.prefs().mode; return m === 'ltr' || m === 'rtl' || m === 'vertical'; },

  build() {
    this.el = $('#reader');
    this.el.innerHTML = String(html`<div class="viewport"></div><div class="filter dim"></div><div class="filter color"></div><div class="flash"></div><div class="tapzones" hidden></div>
      <div class="pnum"></div>
      <div class="chrome rtop hide"><button class="iconbtn" data-act="close" aria-label="Back">${icon('back')}</button><div class="tt"><div class="a"></div><div class="b"></div></div>
        <button class="iconbtn" data-act="bookmark" aria-label="Bookmark chapter">${icon('bookmarkOff')}</button><button class="iconbtn" data-act="menu" aria-label="More">${icon('more')}</button></div>
      <div class="chrome rbot hide"><div class="seekrow"><button class="roundbtn" data-act="prevch" aria-label="Previous chapter">${icon('prev')}</button>
        <div class="seek"><span class="sa">1</span><input type="range" min="1" max="1" value="1" aria-label="Page"><span class="sb">1</span></div>
        <button class="roundbtn" data-act="nextch" aria-label="Next chapter">${icon('next')}</button></div>
        <div class="rtools"><button class="iconbtn" data-act="mode" aria-label="Reading mode">${icon('phone')}</button><button class="iconbtn" data-act="rotation" aria-label="Rotation">${icon('rotate')}</button>
        <button class="iconbtn" data-act="crop" aria-label="Crop borders">${icon('cropOff')}</button><button class="iconbtn" data-act="settings" aria-label="Reader settings">${icon('settings')}</button></div></div>`);
    this.el.addEventListener('click', e => {
      const t = e.target.closest('[data-act]');
      if (t && t.closest('.chrome')) { e.stopPropagation(); this.action(t.dataset.act, t); }
    });
    const seek = $('.seek input', this.el);
    seek.addEventListener('input', () => { $('.sa', this.el).textContent = seek.value; });
    seek.addEventListener('change', () => this.jump(+seek.value - 1));
    document.addEventListener('visibilitychange', () => { if (document.hidden && this.open) this.saveNow(); });
    window.addEventListener('resize', debounce(() => { if (this.open) this.onResize(); }, 150));
    window.ovKey = dir => { if (!this.open) return; this.step(dir === 'down' ? 1 : -1); };
  },

  // ---------------------------------------------------------------- open / close
  async openChapter(s, ch, opts = {}) {
    if (!this.el) this.build();
    const src = Sources.get(s.source);
    this.s = s; this.src = src; this.ch = ch;
    this.list = (await Store.chapters(s.key)).filter(c => !c.gone || c.key === ch.key || c.read);
    const gen = ++this.gen;
    this.clearImages();
    this.disarmAutoNext(); this.userScrolled = false;
    this.failed = new Set(); this.pages = []; this.vpages = []; this.dims = {}; this.zoom = 1;
    clearTimeout(this.doneTimer);
    if (!this.open) {
      this.open = true;
      this.el.hidden = false;
      document.body.classList.add('reading');
      DB.setMeta('readerOpen', { seriesKey: s.key, chapterKey: ch.key });
    }
    this.applyPrefs();
    this.setChrome(false);
    this.status('loading', 'Loading ' + ch.label + '…');
    this.updateTop();
    Store.touchHistory(s, ch).then(() => Store.emit('history'));
    // saved position
    const saved = opts.fromStart ? null : await Store.progress(ch.key);
    if (saved && saved.dims) this.dims = saved.dims;
    let start = saved && !saved.done ? { page: saved.page || 0, frac: saved.frac || 0 } : { page: 0, frac: 0 };
    if (opts.atEnd) start = { page: 1e9, frac: 0 };
    // manifest: downloads first (works offline), then experimental manifest, then the source
    let manifest = null, offline = false;
    try {
      const dl = await Downloads.pagesFor(ch.key);
      if (dl && dl.length) { manifest = dl.map(p => ({ blob: p.blob, tiles: p.tiles })); offline = true; }
      else if (ch.manifest) manifest = ch.manifest.map(p => ({ url: p.url, referer: ch.referer }));
      else if (src && !src.website && src.cap !== 'local') manifest = await srcCall(src, 'pages', ch, s);
      else if (src && src.cap === 'local') throw new SourceError('missing', '(The archive pages are no longer stored.)');
      else throw new SourceError('unsupported', '');
      if (!manifest || !manifest.length) throw new SourceError('empty', '');
    } catch (e) {
      if (gen !== this.gen) return;
      this.status('error', errorText(e), e);
      return;
    }
    if (gen !== this.gen) return;
    this.offline = offline;
    this.pages = manifest.map((p, i) => ({ i, ...p, state: 'idle', w: (this.dims[i] || [])[0] || 0, h: (this.dims[i] || [])[1] || 0 }));
    this.vpages = this.pages.map(p => ({ src: p.i, half: null }));
    start.page = clamp(start.page, 0, this.pages.length - 1);
    if (opts.atEnd) start.frac = 0.99;
    this.cur = start.page; this.frac = start.frac;
    this.status('');
    this.render(start);
    this.saveProgress();
    if (!this.paged && this.s.readingHint !== 'longstrip' && false) { /* no hint */ }
    if (this.paged && this.s.readingHint === 'longstrip' && !(this.s.prefs && this.s.prefs.mode) && !this.s.hintShown) {
      this.s.hintShown = true; Store.saveSeries(this.s);
      UI.toast('This series is a vertical webtoon. Switch to long strip?', { action: 'Switch', ms: 6000, onAction: () => this.setPref('mode', 'longstrip', true) });
    }
  },

  close() {
    this.disarmAutoNext();
    if (!this.open) return;
    this.saveNow();
    this.open = false;
    this.gen++;
    clearTimeout(this.doneTimer);
    this.clearImages();
    this.el.hidden = true;
    this.el.querySelector('.viewport').innerHTML = '';
    document.body.classList.remove('reading');
    Native.call('setFullscreen', false);
    Native.call('setCutout', false);
    Native.call('keepScreenOn', false);
    Native.call('setBrightness', -1);
    Native.call('setOrientation', 'default');
    Native.call('setVolumeKeys', false);
    DB.setMeta('readerOpen', null);
    if (typeof AutoBackup !== 'undefined') AutoBackup.markDirty();
    if (this.settingsOpen) this.settingsOpen.close();
    Store.emit('library'); Store.emit('history');
    const top = UI.stack[UI.stack.length - 1];
    if (top && top.onShow) top.onShow(); else if (!top && UI.roots[UI.tab]) UI.roots[UI.tab].show();
  },

  back() {
    if (this.zoom > 1.01) { this.setZoom(1); return; }
    if (this.chrome) { this.setChrome(false); return; }
    this.close();
  },

  status(kind, msg = '', err = null) {
    const vp = $('.viewport', this.el);
    let st = $('.rstatus', this.el);
    if (!kind) { if (st) st.remove(); return; }
    vp.innerHTML = '';
    st = el('<div class="rstatus"></div>');
    if (kind === 'loading') st.innerHTML = String(html`<div class="spinner"></div><div>${msg}</div>`);
    else {
      const ch = this.ch, s = this.s;
      st.innerHTML = String(html`<div style="font-size:40px;color:var(--text3)">${icon('error')}</div><div style="max-width:440px;line-height:1.45">${msg}</div>
        <div class="btnrow" style="justify-content:center">${err && err.kind === 'verification' ? html`<button class="btn" data-r="verify">Verify</button>` : ''}<button class="btn ${err && err.kind === 'verification' ? 'tonal' : ''}" data-r="retry">Retry</button>${(ch && (ch.extUrl || ch.url)) || (s && s.url) ? html`<button class="btn tonal" data-r="web">Open website</button>` : ''}<button class="btn ghost" data-r="diag">Diagnostics</button><button class="btn ghost" data-r="close">Close</button></div>`);
      st.addEventListener('click', e => {
        const b = e.target.closest('[data-r]'); if (!b) return;
        e.stopPropagation();
        if (b.dataset.r === 'retry') this.openChapter(this.s, this.ch);
        if (b.dataset.r === 'verify') verifyAndRetry(err, this.src, () => this.openChapter(this.s, this.ch));
        if (b.dataset.r === 'web') Browser.open((ch && (ch.extUrl || ch.url)) || s.url);
        if (b.dataset.r === 'diag') copyDiagnostics(this.src, this.s, err);
        if (b.dataset.r === 'close') this.close();
      });
      this.setChrome(true);
    }
    vp.appendChild(st);
  },

  updateTop() {
    $('.tt .a', this.el).textContent = this.s.title;
    $('.tt .b', this.el).textContent = this.ch.label + (this.ch.title ? ' - ' + this.ch.title : '') + (this.offline ? ' · downloaded' : '');
    $('[data-act="bookmark"]', this.el).innerHTML = String(icon(this.ch.bookmark ? 'bookmark' : 'bookmarkOff'));
    const i = this.list.findIndex(c => c.key === this.ch.key);
    $('[data-act="prevch"]', this.el).disabled = i <= 0;
    $('[data-act="nextch"]', this.el).disabled = !this.nextChapter();
    $('[data-act="crop"]', this.el).innerHTML = String(icon(this.prefs().cropBorders ? 'crop' : 'cropOff'));
  },

  // ---------------------------------------------------------------- prefs
  applyPrefs() {
    const p = this.prefs();
    const bg = p.background === 'auto' ? (this.autoBg || 'black') : p.background;
    this.el.classList.remove('bg-black', 'bg-gray', 'bg-white');
    this.el.classList.add('bg-' + bg);
    this.el.style.setProperty('--pad', (p.sidePadding || 0) + '%');
    this.el.style.setProperty('--gap', (p.mode === 'longstripgap' ? p.gap : 0) + 'px');
    const f = [];
    if (p.grayscale) f.push('grayscale(1)');
    if (p.inverted) f.push('invert(1)');
    $('.viewport', this.el).style.filter = f.join(' ');
    const dim = $('.filter.dim', this.el), col = $('.filter.color', this.el);
    if (p.customBrightness) {
      Native.call('setBrightness', p.brightness > 0 ? p.brightness / 100 : 0.01);
      dim.style.background = p.brightness < 0 ? `rgba(0,0,0,${Math.abs(p.brightness) / 100})` : 'transparent';
      if (!NATIVE && p.brightness > 0) dim.style.background = 'transparent';
    } else { Native.call('setBrightness', -1); dim.style.background = 'transparent'; }
    if (p.colorFilter) { col.style.background = p.colorValue; col.style.opacity = p.colorAlpha / 100; col.style.mixBlendMode = p.colorBlend; }
    else { col.style.background = 'transparent'; col.style.opacity = 0; }
    Native.call('keepScreenOn', !!p.keepScreenOn);
    Native.call('setOrientation', p.orientation);
    Native.call('setVolumeKeys', !!p.volumeKeys);
    Native.call('setCutout', !!p.cutout);
    Native.call('setFullscreen', !!p.fullscreen && !this.chrome);
    this.el.classList.toggle('edge', !!p.fullscreen && !!p.cutout);
    $('.pnum', this.el).hidden = !p.showPageNumber;
    $('.seek', this.el).style.setProperty('--seekdir', p.mode === 'rtl' ? 'rtl' : 'ltr');
  },

  /** Writes a preference to the series (scoped) or globally. */
  setPref(k, v, series) {
    if (series && this.s) {
      this.s.prefs = this.s.prefs || {};
      if (v === undefined) delete this.s.prefs[k]; else this.s.prefs[k] = v;
      Store.saveSeries(this.s);
    } else { Prefs.data.reader[k] = v; Prefs.save(); }
    if (!this.open) return;
    const relayout = ['mode', 'sidePadding', 'gap', 'cropBorders', 'splitWide', 'rotateWide', 'flipRotated', 'fit'].includes(k);
    this.applyPrefs();
    this.updateTop();
    if (relayout && this.pages.length) { const a = { page: this.cur, frac: this.frac }; if (k === 'splitWide' || k === 'mode') this.vpages = this.pages.map(p => ({ src: p.i, half: null })); this.render(a); }
    if (k === 'tapZones' || k === 'invertTap') this.showTapZones();
  },

  // ---------------------------------------------------------------- render
  render(anchor) {
    const vp = $('.viewport', this.el);
    vp.innerHTML = '';
    this.setZoom(1, true);
    if (this.io) this.io.disconnect();
    if (this.paged) this.renderPaged(anchor); else this.renderStrip(anchor);
    this.updateSeek();
  },

  renderStrip(anchor) {
    const vp = $('.viewport', this.el);
    const prevCh = this.prevChapter();
    const strip = el(`<div class="strip"><div class="stripin ${this.prefs().mode === 'longstripgap' ? 'gap' : ''}"></div></div>`);
    const inner = strip.firstElementChild;
    if (prevCh) inner.appendChild(el(html`<div class="trans" style="min-height:30vh" data-prev><div class="lbl">Previous</div><div class="ch">${prevCh.label}</div><button class="btn tonal" data-go="prev">Go to previous chapter</button></div>`));
    this.pages.forEach(p => inner.appendChild(this.pageEl(p)));
    inner.appendChild(this.transitionEl());
    vp.appendChild(strip);
    this.strip = strip;
    // load pages near the viewport
    this.io = new IntersectionObserver(entries => {
      entries.forEach(en => { if (en.isIntersecting) this.request(+en.target.dataset.i); });
    }, { root: strip, rootMargin: '150% 0px 150% 0px' });
    $$('.pg', inner).forEach(n => this.io.observe(n));
    this.endIo = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.isIntersecting && en.intersectionRatio > 0) this.reachedEnd(); else clearTimeout(this.doneTimer);
        if (en.isIntersecting && en.intersectionRatio >= 0.5) this.armAutoNext(); else this.disarmAutoNext();
      });
    }, { root: strip, threshold: [0, 0.3, 0.5, 0.8] });
    this.endIo.observe($('.trans[data-end]', inner));
    strip.addEventListener('scroll', () => this.onScroll(), { passive: true });
    this.bindStripGestures(strip);
    this.restoring = true;
    requestAnimationFrame(() => this.scrollToAnchor(anchor));
  },

  pageEl(p) {
    const n = el(html`<div class="pg" data-i="${p.i}"><div class="ph"><div class="num">${p.i + 1}</div></div></div>`);
    if (p.w && p.h) n.style.aspectRatio = p.w + ' / ' + p.h; else n.style.aspectRatio = '1 / 1.45';
    return n;
  },

  transitionEl() {
    const next = this.nextChapter();
    const lockedNext = next && (next.locked || next.external);
    const n = el(html`<div class="trans" data-end><div class="lbl">Finished</div><div class="ch">${this.ch.label}${this.ch.title ? ' - ' + this.ch.title : ''}</div>
      <div class="warn" data-missing hidden>${ERROR_COPY.partial} This chapter will not be marked read automatically.</div>
      ${next ? html`<div class="lbl" style="margin-top:12px">Next</div><div class="ch">${next.label}${next.title ? ' - ' + next.title : ''}</div>
        ${lockedNext ? html`<div class="warn">This chapter is locked or on an official site.</div><button class="btn tonal" data-go="web">Open on website</button>` : html`<div class="autonext" data-autonext hidden>Continuing to the next chapter…<div class="abar"><div></div></div></div><button class="btn" data-go="next">Read next chapter</button>`}`
      : html`<div class="lbl" style="margin-top:12px">${this.list.length ? 'No next chapter yet' : ''}</div>`}
      <div class="btnrow" style="justify-content:center"><button class="btn ghost" data-go="markread">${this.ch.read ? 'Read ✓' : 'Mark as read'}</button><button class="btn ghost" data-go="exit">Back to series</button></div></div>`);
    n.addEventListener('click', e => {
      const b = e.target.closest('[data-go]'); if (!b) return;
      e.stopPropagation();
      if (b.dataset.go === 'next') this.gotoChapter(this.nextChapter());
      if (b.dataset.go === 'web') { const nx = this.nextChapter(); Browser.open(nx.extUrl || nx.url); }
      if (b.dataset.go === 'markread') this.markRead();
      if (b.dataset.go === 'exit') this.close();
    });
    return n;
  },

  scrollToAnchor(a) {
    if (!this.strip || !a) return;
    const pg = $(`.pg[data-i="${a.page}"]`, this.strip);
    if (!pg) return;
    this.strip.scrollTop = pg.offsetTop + (a.frac || 0) * pg.offsetHeight;
    this.cur = a.page; this.frac = a.frac || 0;
    this.updateSeek();
  },

  onScroll() {
    if (this.scrollRaf) return;
    this.scrollRaf = requestAnimationFrame(() => {
      this.scrollRaf = null;
      const st = this.strip;
      if (!st) return;
      const y = st.scrollTop + 1;
      const pgs = st.querySelectorAll('.pg');
      let lo = 0, hi = pgs.length - 1, found = 0;
      while (lo <= hi) { const mid = (lo + hi) >> 1; if (pgs[mid].offsetTop <= y) { found = mid; lo = mid + 1; } else hi = mid - 1; }
      const pg = pgs[found];
      if (!pg) return;
      const cur = +pg.dataset.i;
      const frac = clamp((y - pg.offsetTop) / Math.max(1, pg.offsetHeight), 0, 1);
      if (cur !== this.cur && this.prefs().flashOnPage) this.flash();
      this.cur = cur; this.frac = frac;
      if (!this.restoring) { this.userScrolled = true; this.saveProgress(); }
      this.updateSeek();
      this.evict();
    });
  },

  onResize() {
    const a = { page: this.cur, frac: this.frac };
    UI.applyLayout();
    if (this.paged) this.renderPaged(a); else requestAnimationFrame(() => this.scrollToAnchor(a));
  },

  bindStripGestures(strip) {
    let pinch = null, tapAt = 0, tapTimer = null, down = null;
    const stopRestore = () => { this.restoring = false; };
    strip.addEventListener('wheel', stopRestore, { passive: true });
    strip.addEventListener('touchstart', e => {
      stopRestore();
      if (e.touches.length === 2) {
        const [a, b] = e.touches;
        pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), z: this.zoom, cx: (a.clientX + b.clientX) / 2, cy: (a.clientY + b.clientY) / 2 };
      }
    }, { passive: true });
    strip.addEventListener('touchmove', e => {
      if (pinch && e.touches.length === 2) {
        e.preventDefault();
        const [a, b] = e.touches;
        const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        this.setZoom(clamp(pinch.z * d / pinch.d, 1, 3), false, pinch.cx, pinch.cy);
      }
    }, { passive: false });
    strip.addEventListener('touchend', e => { if (e.touches.length < 2) pinch = null; }, { passive: true });
    // Long press opens page actions only for a still finger: any scroll, drag or second finger cancels it.
    const cancelLong = () => { clearTimeout(this.longTimer); down = null; };
    strip.addEventListener('pointerdown', e => {
      if (!e.isPrimary) { cancelLong(); return; }
      const top = strip.scrollTop, left = strip.scrollLeft;
      down = { x: e.clientX, y: e.clientY, t: Date.now() };
      this.longTimer = setTimeout(() => {
        if (!down || pinch || Math.abs(strip.scrollTop - top) > 2 || Math.abs(strip.scrollLeft - left) > 2 || !this.prefs().longTapActions) return;
        const pg = e.target.closest('.pg'); if (pg) this.pageActions(+pg.dataset.i, e);
        down = null;
      }, 650);
    });
    strip.addEventListener('pointermove', e => { if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) cancelLong(); });
    strip.addEventListener('pointercancel', cancelLong);
    strip.addEventListener('scroll', () => { if (down) cancelLong(); }, { passive: true });
    strip.addEventListener('touchmove', () => { if (down) cancelLong(); }, { passive: true });
    strip.addEventListener('pointerup', e => {
      clearTimeout(this.longTimer);
      if (!down || e.target.closest('button')) { down = null; return; }
      const d = down; down = null;
      if (Date.now() - d.t > 500) return;
      const now = Date.now();
      if (this.prefs().doubleTapZoom && now - tapAt < 280) {
        clearTimeout(tapTimer); tapAt = 0;
        this.setZoom(this.zoom > 1.05 ? 1 : 2, false, e.clientX, e.clientY);
        return;
      }
      tapAt = now;
      const fire = () => this.tap(e.clientX, e.clientY);
      if (this.prefs().doubleTapZoom) tapTimer = setTimeout(fire, 260); else fire();
    });

  // ---------------------------------------------------------------- paged

  prevChapter() {

  // ---------------------------------------------------------------- image loading

  },

  detectBg(bmp) {
    try {
      const c = document.createElement('canvas'); c.width = 16; c.height = 16;
      const g = c.getContext('2d'); g.drawImage(bmp, 0, 0, 16, 16);
      const d = g.getImageData(0, 0, 16, 16).data;
      let sum = 0, n = 0;
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { if (x > 1 && x < 14 && y > 1 && y < 14) continue; const k = (y * 16 + x) * 4; sum += (d[k] + d[k + 1] + d[k + 2]) / 3; n++; }
      this.autoBg = sum / n > 160 ? 'white' : 'black';
      this.applyPrefs();
    } catch { /* ignore */ }
  },

  /** Non-destructive border crop for paged mode: returns an object URL for the cropped region. */
  async cropped(i, img) {
    const p = this.pages[i];
    if (p.cropObj) return p.cropObj;
    const w = img.naturalWidth, h = img.naturalHeight;
    const sw = Math.min(400, w), sh = Math.round(h * sw / w);
    const c = document.createElement('canvas'); c.width = sw; c.height = sh;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(img, 0, 0, sw, sh);
    const d = g.getImageData(0, 0, sw, sh).data;
    const at = (x, y) => { const k = (y * sw + x) * 4; return [d[k], d[k + 1], d[k + 2]]; };
    const ref = at(0, 0);
    const same = px => Math.abs(px[0] - ref[0]) + Math.abs(px[1] - ref[1]) + Math.abs(px[2] - ref[2]) < 48;
    const rowSame = y => { for (let x = 0; x < sw; x += 2) if (!same(at(x, y))) return false; return true; };
    const colSame = x => { for (let y = 0; y < sh; y += 2) if (!same(at(x, y))) return false; return true; };
    let top = 0, bot = sh - 1, left = 0, right = sw - 1;
    while (top < bot && rowSame(top)) top++;
    while (bot > top && rowSame(bot)) bot--;
    while (left < right && colSame(left)) left++;
    while (right > left && colSame(right)) right--;
    if (top < 3 && left < 3 && bot > sh - 4 && right > sw - 4) return null;
    if ((right - left) < sw * 0.4 || (bot - top) < sh * 0.4) return null;
    const s = w / sw;
    const out = document.createElement('canvas');
    out.width = Math.round((right - left + 1) * s); out.height = Math.round((bot - top + 1) * s);
    out.getContext('2d').drawImage(img, left * s, top * s, out.width, out.height, 0, 0, out.width, out.height);
    const blob = await new Promise(r => out.toBlob(r, 'image/webp', 0.95));
    p.cropObj = URL.createObjectURL(blob);
    this.objUrls.set('c' + i, p.cropObj);
    return p.cropObj;
  },

  // ---------------------------------------------------------------- progress and completion
  saveProgress: debounce(function () { Reader.saveNow(); }, 600),
  saveNow() {
    if (!this.ch || !this.pages.length) return;
    const p = { chapterKey: this.ch.key, page: this.cur, frac: Math.round(this.frac * 1000) / 1000, pages: this.pages.length, dims: this.dims, done: !!this.ch.read };
    Store.saveProgress(p);
    if (!Prefs.data.incognito) DB.setMeta('readerOpen', this.open ? { seriesKey: this.s.key, chapterKey: this.ch.key } : null);
  },

  /** Completion requires the end to be viewed with a short dwell, and no missing pages. */
  /** Long strip: once the end card is mostly on screen after you scrolled to it, continue to the next chapter by itself. */
  canAutoNext() {
    const nc = this.nextChapter();
    return !!(this.prefs().autoNext && nc && !nc.locked && !nc.external && !this.failed.size && this.pages.length);
  },
  armAutoNext() {
    if (this.autoTimer || this.paged || !this.userScrolled || this.restoring || !this.canAutoNext()) return;
    const chKey = this.ch.key, card = this.strip && $('.trans[data-end]', this.strip);
    const hint = card && $('[data-autonext]', card);
    if (hint) { hint.hidden = false; hint.classList.remove('go'); void hint.offsetWidth; hint.classList.add('go'); }
    this.autoTimer = setTimeout(() => {
      this.autoTimer = null;
      if (!this.open || this.ch.key !== chKey || this.paged || !this.canAutoNext()) return;
      this.reachedEnd(true);
      this.gotoChapter(this.nextChapter());
    }, 1500);
  },
  disarmAutoNext() {
    clearTimeout(this.autoTimer); this.autoTimer = null;
    const h = this.strip && $('.trans[data-end] [data-autonext]', this.strip);
    if (h) { h.hidden = true; h.classList.remove('go'); }
  },

  reachedEnd(immediate) {
    clearTimeout(this.doneTimer);
    if (this.ch.read || this.failed.size || !this.pages.length) { this.markMissing(); return; }
    const last = this.pages[this.pages.length - 1];
    const check = () => {
      if (!this.open || this.failed.size) return;
      if (!this.paged && last.state !== 'ok') return;
      this.markRead(true);
    };
    if (immediate) check(); else this.doneTimer = setTimeout(check, 1200);
  },

  async markRead(auto) {
    if (Prefs.data.incognito) { if (!auto) UI.toast('Incognito mode is on; read state is not saved'); return; }
    this.ch = await Store.markChapterDone(this.s, this.ch);
    await Store.saveProgress({ chapterKey: this.ch.key, page: this.cur, frac: this.frac, pages: this.pages.length, dims: this.dims, done: true });
    const b = $('[data-go="markread"]', this.el); if (b) b.textContent = 'Read ✓';
    if (!auto) UI.toast('Marked as read');
  },

  // ---------------------------------------------------------------- chrome actions
  async action(act, btn) {
    const p = this.prefs();
    switch (act) {
      case 'close': this.close(); break;
      case 'bookmark': this.ch = await Store.setBookmark(this.ch, !this.ch.bookmark); this.updateTop(); UI.toast(this.ch.bookmark ? 'Chapter bookmarked' : 'Bookmark removed'); break;
      case 'prevch': this.gotoChapter(this.prevChapter()); break;
      case 'nextch': this.gotoChapter(this.nextChapter()); break;
      case 'mode': UI.menu(btn, MODES.map(([v, l]) => ({ label: (p.mode === v ? '✓ ' : '') + l, action: () => this.setPref('mode', v, true) }))); break;
      case 'rotation': UI.menu(btn, ORIENTS.map(([v, l]) => ({ label: (p.orientation === v ? '✓ ' : '') + l, action: () => this.setPref('orientation', v, true) }))); break;
      case 'crop': this.setPref('cropBorders', !p.cropBorders, true); UI.toast(this.prefs().cropBorders ? 'Crop borders on (paged modes)' : 'Crop borders off'); break;
      case 'settings': readerSettingsSheet(this.s); break;
      case 'menu': UI.menu(btn, [
        { label: `Retry failed pages (${this.failed.size})`, hidden: !this.failed.size, action: () => this.retryAll() },
        { label: this.ch.read ? 'Mark as unread' : 'Mark as read', action: async () => { if (this.ch.read) { [this.ch] = await Store.setRead([this.ch], false); UI.toast('Marked unread'); } else this.markRead(); } },
        { label: 'Download chapter', hidden: this.offline || !this.src || this.src.website || this.src.cap === 'local', action: async () => { const n = await Downloads.enqueue(this.s.key, [this.ch]); UI.toast(n ? 'Download queued' : 'Already downloaded or queued'); } },
        { label: 'Open on website', hidden: !(this.ch.url || this.s.url), action: () => Browser.open(this.ch.url || this.s.url) },
        { label: 'Share chapter link', hidden: !this.ch.url, action: () => Native.share(this.s.title + ' — ' + this.ch.label + '\n' + this.ch.url) },
        { label: 'Diagnostics', action: () => copyDiagnostics(this.src, this.s, this.failed.size ? this.pages[[...this.failed][0]].err : null) },
      ]); break;
    }
  },

  pageActions(i, e) {
    const p = this.pages[i];
    const anchor = { getBoundingClientRect: () => ({ bottom: e.clientY, right: e.clientX + 120 }) };
    UI.menu(anchor, [
      { label: 'Save page ' + (i + 1), hidden: !p || p.state !== 'ok', action: async () => { const r = await fetch(p.obj); const b = new Uint8Array(await (await r.blob()).arrayBuffer()); const ok = await Native.saveFile(`${this.s.title.slice(0, 40)} ${this.ch.label} p${i + 1}.${(p.obj && 'jpg')}`, 'image/jpeg', b); UI.toast(ok ? 'Page saved' : 'Not saved'); } },
      { label: 'Share page link', hidden: !p || !p.url, action: () => Native.share(p.url) },
      { label: 'Retry this page', hidden: !p, action: () => this.retry(i) },
    ]);
  },
};

// ---------------------------------------------------------------- reader settings sheet (three tabs, like the reference)
function readerSettingsSheet(s) {
  let tab = 'mode';
  // Open on "All series" unless this series already has its own settings, so one change applies everywhere.
  let scope = s && s.prefs && Object.keys(s.prefs).some(k => k in DEFAULT_PREFS.reader) ? 'series' : 'global';
  const node = el('<div class="rsheet"><div class="tabs" role="tablist"></div><div class="scopebar"></div><div class="sb"></div></div>');
  const eff = () => scope === 'series' && s ? { ...Prefs.data.reader, ...(s.prefs || {}) } : Prefs.data.reader;
  const set = (k, v) => {
    if (scope === 'series' && s) {
      if (Reader.open && Reader.s === s) Reader.setPref(k, v, true);
      else { s.prefs = s.prefs || {}; s.prefs[k] = v; Store.saveSeries(s); }
    } else {
      if (Reader.open) Reader.setPref(k, v, false); else { Prefs.data.reader[k] = v; Prefs.save(); }
    }
    draw();
  };
  const pills = (k, opts) => html`<div class="chips">${opts.map(([v, l]) => html`<button class="chip ${eff()[k] === v ? 'sel' : ''}" data-k="${k}" data-v="${v}">${l}</button>`)}</div>`;
  const chk = (k, l) => html`<button class="check" role="checkbox" aria-checked="${!!eff()[k]}" data-chk="${k}"><span class="box"></span>${l}</button>`;
  const draw = () => {
    const p = eff();
    $('.tabs', node).innerHTML = String(html`${[['mode', 'Reading mode'], ['general', 'General'], ['filter', 'Custom filter']].map(([id, l]) => html`<button class="tab" role="tab" aria-selected="${tab === id}" data-tab="${id}">${l}</button>`)}`);
    const overrides = s && s.prefs ? Object.keys(s.prefs).filter(k => k in DEFAULT_PREFS.reader).length : 0;
    $('.scopebar', node).innerHTML = s ? String(html`Applies to: <button class="chip ${scope === 'series' ? 'sel' : ''}" data-scope="series">This series</button><button class="chip ${scope === 'global' ? 'sel' : ''}" data-scope="global">All series</button>${overrides && scope === 'series' ? html`<button class="textbtn" data-reset>Reset series (${overrides})</button>` : ''}`) : 'Defaults for every series without its own settings';
    const isPaged = ['ltr', 'rtl', 'vertical'].includes(p.mode);
    let body;
    if (tab === 'mode') {
      body = html`<p style="color:var(--text3);font-size:13px;margin:4px 0 0">${scope === 'series' ? 'Only this series. It keeps these even if you change the settings for all series.' : 'Every series that does not have its own settings.'}</p><h4>Reading mode</h4>${pills('mode', MODES.map(([v, l]) => [v, l.replace('Paged ', 'Paged ')]))}
        <h4>Rotation</h4>${pills('orientation', ORIENTS)}
        <h4>${isPaged ? 'Paged' : 'Long strip'}</h4><h4>Tap zones</h4>${pills('tapZones', TAPZONES)}
        <h4>Invert tap zones</h4>${pills('invertTap', [['none', 'None'], ['horizontal', 'Horizontal'], ['vertical', 'Vertical'], ['both', 'Both']])}
        <div class="set" style="padding:8px 0"><span class="body"><span class="t">Side padding</span><div class="s">${p.sidePadding}%</div></span><input class="slider" style="max-width:60%" type="range" min="0" max="25" value="${p.sidePadding}" data-range="sidePadding" aria-label="Side padding"></div>
        ${p.mode === 'longstripgap' ? html`<div class="set" style="padding:8px 0"><span class="body"><span class="t">Gap between pages</span><div class="s">${p.gap}px</div></span><input class="slider" style="max-width:60%" type="range" min="2" max="60" value="${p.gap}" data-range="gap" aria-label="Gap between pages"></div>` : ''}
        ${isPaged ? html`<h4>Scale</h4>${pills('fit', [['page', 'Fit page'], ['fill', 'Fill screen'], ['width', 'Fit width'], ['height', 'Fit height'], ['stretch', 'Stretch']])}<p style="color:var(--text3);font-size:13px;margin:6px 0 0">${({ page: 'Shows the whole page; empty space around it uses the background color.', fill: 'Fills the whole screen with no bars; a little of the page edges is trimmed.', width: 'Page fills the width; scroll if it is taller than the screen.', height: 'Page fills the height; the sides may be trimmed.', stretch: 'Stretches the page to the exact screen shape; art may look slightly squished.' })[p.fit] || ''}</p>${''}}${chk('cropBorders', 'Crop borders')}${chk('splitWide', 'Split wide pages')}${chk('rotateWide', 'Rotate wide pages to fit')}${chk('flipRotated', 'Flip orientation of rotated wide pages')}` : html`<p style="color:var(--text3);font-size:13px">Crop, split and rotate apply to paged modes. Long strip keeps the artwork exactly as published, including built-in white space.</p>`}
        ${chk('autoNext', 'Go to the next chapter automatically')}<p style="color:var(--text3);font-size:13px;margin:-4px 0 6px 34px">Keeps reading into the next chapter when you reach the end. Locked chapters, and chapters with pages that did not load, still stop at the end card.</p>${chk('doubleTapZoom', 'Double tap to zoom')}${chk('volumeKeys', 'Volume keys turn pages')}`;
    } else if (tab === 'general') {
      body = html`<h4>Background color</h4>${pills('background', [['black', 'Black'], ['gray', 'Gray'], ['white', 'White'], ['auto', 'Auto']])}
        ${chk('showPageNumber', 'Show page number')}${chk('fullscreen', 'Fullscreen')}${eff().fullscreen ? chk('cutout', 'Extend into the camera cutout (notch)') : ''}${chk('keepScreenOn', 'Keep screen on')}${chk('longTapActions', 'Show actions on long tap')}
        ${chk('animatePages', 'Animate page transitions')}${chk('flashOnPage', 'Flash on page change')}`;
    } else {
      body = html`${chk('customBrightness', 'Custom brightness')}
        ${p.customBrightness ? html`<div class="set" style="padding:4px 0"><span class="body"><span class="t">Brightness</span><div class="s">${p.brightness}${p.brightness < 0 ? ' (dimmed below system minimum)' : ''}</div></span><input class="slider" style="max-width:60%" type="range" min="-75" max="100" value="${p.brightness}" data-range="brightness" aria-label="Brightness"></div>` : ''}
        ${chk('colorFilter', 'Custom color filter')}
        ${p.colorFilter ? html`<div class="set" style="padding:4px 0;gap:12px"><input type="color" value="${p.colorValue}" data-color aria-label="Filter color" style="width:48px;height:40px;border:0;background:none">
          <span class="body"><span class="t">Intensity ${p.colorAlpha}%</span><input class="slider" type="range" min="5" max="90" value="${p.colorAlpha}" data-range="colorAlpha" aria-label="Filter intensity"></span></div>
          ${pills('colorBlend', [['normal', 'Default'], ['multiply', 'Multiply'], ['screen', 'Screen'], ['overlay', 'Overlay'], ['lighten', 'Lighten'], ['darken', 'Darken']])}` : ''}
        ${chk('grayscale', 'Grayscale')}${chk('inverted', 'Inverted')}
        <p style="color:var(--text3);font-size:13px">Brightness changes only this app's window and returns to normal when you leave the reader.</p>
        <button class="btn ghost" data-resetfilters>Reset filters</button>`;
    }
    $('.sb', node).innerHTML = String(body);
  };
  node.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.tab) { tab = t.dataset.tab; draw(); return; }
    if (t.dataset.scope) { scope = t.dataset.scope; draw(); return; }
    if (t.dataset.reset != null) { s.prefs = {}; Store.saveSeries(s); if (Reader.open && Reader.s === s) { Reader.applyPrefs(); Reader.render({ page: Reader.cur, frac: Reader.frac }); } draw(); UI.toast('This series now follows the defaults'); return; }
    if (t.dataset.resetfilters != null) { ['customBrightness', 'colorFilter', 'grayscale', 'inverted'].forEach(k => set(k, false)); set('brightness', 0); return; }
    if (t.dataset.chk) { set(t.dataset.chk, !eff()[t.dataset.chk]); return; }
    if (t.dataset.k) {
      if (t.dataset.k === 'tapZones' || t.dataset.k === 'invertTap') { set(t.dataset.k, t.dataset.v); if (Reader.open) Reader.showTapZones(); return; }
      set(t.dataset.k, t.dataset.v);
    }
  });
  node.addEventListener('input', e => {
    const k = e.target.dataset.range;
    if (k) {
      const v = +e.target.value;
      if (scope === 'series' && s) { s.prefs = s.prefs || {}; s.prefs[k] = v; } else Prefs.data.reader[k] = v;
      const lab = e.target.closest('.set') && e.target.closest('.set').querySelector('.s');
      if (lab) lab.textContent = v + (k === 'sidePadding' ? '%' : k === 'gap' ? 'px' : '');
      if (Reader.open) Reader.applyPrefs();
    }
    if (e.target.dataset.color != null) { if (scope === 'series' && s) { s.prefs = s.prefs || {}; s.prefs.colorValue = e.target.value; } else Prefs.data.reader.colorValue = e.target.value; if (Reader.open) Reader.applyPrefs(); }
  });
  node.addEventListener('change', e => {
    const k = e.target.dataset.range;
    if (k || e.target.dataset.color != null) {
      if (scope === 'series' && s) Store.saveSeries(s); else Prefs.save();
      if (k && Reader.open && (k === 'sidePadding' || k === 'gap')) Reader.render({ page: Reader.cur, frac: Reader.frac });
      draw();
    }
  });
  draw();
  const o = UI.sheet(node, { label: 'Reader settings', onClose: () => { Reader.settingsOpen = null; } });
  Reader.settingsOpen = o;
}

/* ==========================================================================
   Otaku Vault — Tachiyomi / Mihon backup import (.tachibk / .proto.gz)
   and the automatic "move to a working source" tool.
   ========================================================================== */

const Tachi = {
  // ---------------------------------------------------------------- protobuf reading
  async bytes(blob) {
    let b = new Uint8Array(await blob.arrayBuffer());
    if (b[0] === 0x1f && b[1] === 0x8b) {
      const out = await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
      if (out.byteLength > 300e6) throw new Error('The backup is too large.');
      b = new Uint8Array(out);
    }
    return b;
  },
  isTachi(name, firstBytes) {
    return /\.(tachibk|proto\.gz)$/i.test(name || '') || (firstBytes && firstBytes[0] === 0x1f && firstBytes[1] === 0x8b);
  },
  /** Decodes one message into { field: [values] }; length-delimited values stay as byte ranges. */
  msg(b, start = 0, end = b.length) {
    const out = {};
    let i = start;
    const varint = () => {
      let r = 0, mul = 1, c;
      do { c = b[i++]; r += (c & 0x7f) * mul; mul *= 128; } while (c >= 0x80 && i < end);
      return r;
    };
    while (i < end) {
      const key = varint();
      const f = Math.floor(key / 8), wt = key & 7;
      let v;
      if (wt === 0) v = varint();
      else if (wt === 1) { v = { s: i, e: i + 8 }; i += 8; }
      else if (wt === 2) { const n = varint(); v = { s: i, e: i + n }; i += n; }
      else if (wt === 5) { v = { s: i, e: i + 4, f32: true }; i += 4; }
      else throw new Error('This file is not a Tachiyomi backup (unknown data at byte ' + i + ').');
      (out[f] = out[f] || []).push(v);
    }
    return out;
  },
  str(b, v) { return v ? new TextDecoder().decode(b.subarray(v.s, v.e)) : ''; },
  f32(b, v) { return v ? new DataView(b.buffer, b.byteOffset + v.s, 4).getFloat32(0, true) : NaN; },
  one(m, f) { return m[f] ? m[f][0] : undefined; },

  // ---------------------------------------------------------------- reading the backup
  read(b) {
    const top = this.msg(b);
    if (!top[1] || !top[1].length) throw new Error('No series were found in this backup.');
    const sources = {};
    for (const v of top[101] || top[100] || []) {
      const m = this.msg(b, v.s, v.e);
      const id = this.one(m, 2);
      if (id != null) sources[id] = this.str(b, this.one(m, 1)) || '';
    }
    const cats = (top[2] || []).map(v => { const m = this.msg(b, v.s, v.e); return { name: this.str(b, this.one(m, 1)), order: this.one(m, 2) || 0 }; });
    const series = top[1].map(v => {
      const m = this.msg(b, v.s, v.e);
      const sid = this.one(m, 1);
      const chapters = (m[16] || []).map(cv => {
        const c = this.msg(b, cv.s, cv.e);
        const num = this.f32(b, this.one(c, 9));
        return {
          url: this.str(b, this.one(c, 1)), name: this.str(b, this.one(c, 2)), group: this.str(b, this.one(c, 3)),
          read: !!this.one(c, 4), bookmark: !!this.one(c, 5), lastPage: this.one(c, 6) || 0,
          date: this.one(c, 8) || 0, modified: (this.one(c, 11) || 0) * 1000, num: isFinite(num) && num >= 0 ? String(Math.round(num * 1000) / 1000) : '', order: this.one(c, 10),
        };
      });
      const history = (m[104] || []).map(hv => { const h = this.msg(b, hv.s, hv.e); return { url: this.str(b, this.one(h, 1)), at: this.one(h, 2) || 0 }; });
      return {
        sourceId: sid, sourceName: sources[sid] || '', url: this.str(b, this.one(m, 2)), title: this.str(b, this.one(m, 3)) || 'Untitled',
        artist: this.str(b, this.one(m, 4)), author: this.str(b, this.one(m, 5)), desc: this.str(b, this.one(m, 6)),
        tags: (m[7] || []).map(t => this.str(b, t)), status: this.one(m, 8) || 0, cover: this.str(b, this.one(m, 9)),
        added: this.one(m, 13) || 0, categories: (m[17] || []), favorite: m[100] ? !!this.one(m, 100) : true, chapters, history,
      };
    }).filter(x => x.favorite);
    const prefs = {};
    for (const v of top[104] || []) {
      try {
        const m = this.msg(b, v.s, v.e);
        const key = this.str(b, this.one(m, 1));
        const any = this.one(m, 2) ? this.msg(b, this.one(m, 2).s, this.one(m, 2).e) : {};
        const inner = this.one(any, 2) ? this.msg(b, this.one(any, 2).s, this.one(any, 2).e) : {};
        const val = this.one(inner, 1);
        prefs[key] = typeof val === 'number' ? val : this.str(b, val);
      } catch { /* skip unreadable preference */ }
    }
    return { series, cats, prefs };
  },

  statusOf(n) { return ['unknown', 'ongoing', 'completed', 'licensed', 'completed', 'cancelled', 'hiatus'][n] || 'unknown'; },
  sourceKey(name) { return 'tachi:' + (name || 'unknown').replace(/[^\w.-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 50) || 'tachi:unknown'; },

  /** Writes the imported library. Series whose site Otaku Vault supports with the same addresses go straight in; the rest wait to be moved. */
  async import(parsed, onProgress) {
    const catNames = new Map(parsed.cats.map(c => [c.order, c.name]));
    if (parsed.cats.length) await Store.saveCategories([...new Set([...Store.categories, ...parsed.cats.map(c => c.name).filter(Boolean)])]);
    let n = 0, direct = 0, pending = 0, readCount = 0;
    const now = Date.now();
    for (const t of parsed.series) {
      const mp = this.directMap(t);
      const srcId = mp ? mp.source : this.sourceKey(t.sourceName);
      const id = mp ? mp.id : (t.url || t.title).slice(0, 380);
      const key = Store.key(srcId, id);
      const old = Store.get(key);
      const s = old || { key, source: srcId, id, inLibrary: 0, categories: [], prefs: {}, unread: 0, dlCount: 0, chapterCount: 0, baseline: false };
      Object.assign(s, {
        title: t.title, author: t.author || s.author || '', artist: t.artist || '', desc: t.desc || s.desc || '', tags: t.tags.length ? t.tags : (s.tags || []),
        status: this.statusOf(t.status), cover: /^https:\/\//.test(t.cover) ? t.cover : (s.cover || ''), url: /^https:\/\//.test(t.url) ? t.url : (s.url || ''),
        tachiSource: t.sourceName || 'Unknown source', addedAt: t.added || s.addedAt || now, inLibrary: 1, baseline: false,
      });
      s.categories = [...new Set([...(s.categories || []), ...t.categories.map(o => catNames.get(o)).filter(Boolean)])];
      if (!mp) { s.moveStatus = s.moveStatus === 'moved' ? 'moved' : 'pending'; pending++; } else direct++;
      // chapters in source order (Tachiyomi: 0 = newest)
      const list = t.chapters.map((c, i) => ({ ...c, i })).sort((a, b) => (a.order ?? a.i) - (b.order ?? b.i));
      const recs = [];
      const byUrl = new Map();
      list.forEach((c, i) => {
        const cid = mp ? mp.chapterId(c.url) : c.url;
        if (!cid) return;
        const rec = { key: key + '|' + cid, series: key, id: cid, label: c.name || ('Chapter ' + c.num), num: c.num, group: c.group || '', date: c.date, sortIdx: list.length - 1 - i, read: c.read, bookmark: c.bookmark, discovered: now, lastPage: c.lastPage };
        recs.push(rec); byUrl.set(c.url, rec);
        if (c.read) readCount++;
      });
      const existing = new Map((await DB.byIndex('chapters', 'series', key)).map(c => [c.id, c]));
      await DB.putMany('chapters', recs.map(r => existing.has(r.id) ? { ...existing.get(r.id), read: existing.get(r.id).read || r.read, bookmark: existing.get(r.id).bookmark || r.bookmark } : r));
      const prog = recs.filter(r => !r.read && r.lastPage > 0).map(r => ({ chapterKey: r.key, page: r.lastPage, frac: 0, pages: 0, done: false, at: now }));
      if (prog.length) await DB.putMany('progress', prog);
      const last = t.history.filter(h => byUrl.has(h.url)).sort((a, b) => b.at - a.at)[0];
      if (last) { const r = byUrl.get(last.url); await DB.put('history', { seriesKey: key, chapterKey: r.key, label: r.label, title: '', at: last.at }); s.lastReadAt = last.at; }
      else {
        // no history entry: use when the most recent read chapter was last marked
        const lastRead = list.filter(c => c.read && c.modified).sort((x, y) => y.modified - x.modified)[0];
        if (lastRead && lastRead.modified < now + 864e5) s.lastReadAt = Math.max(s.lastReadAt || 0, lastRead.modified);
      }
      await Store.saveSeries(s);
      await Store.recount(s, false);
      await Store.saveSeries(s);
      n++;
      if (onProgress && n % 20 === 0) onProgress(n, parsed.series.length);
    }
    // match the Tachiyomi library order
    const sortMap = { DATE_ADDED: 'added', LAST_READ: 'lastRead', ALPHABETICAL: 'title', LAST_UPDATE: 'updated', LATEST_CHAPTER: 'updated', CHAPTER_FETCH_DATE: 'updated', UNREAD_COUNT: 'unread', TOTAL_CHAPTERS: 'chapters' };
    const sm = String(parsed.prefs && parsed.prefs.library_sorting_mode || '').split(',');
    if (sortMap[sm[0]]) {
      const dir = sm[1] || (parsed.prefs.library_sorting_ascending || '');
      Prefs.data.librarySort = sortMap[sm[0]];
      Prefs.data.librarySortDesc = sm[0] === 'ALPHABETICAL' ? /DESC/.test(dir) : /ASC/.test(dir) && !/DESC/.test(dir);
      Prefs.save();
    }
    Store.emit('library'); Store.emit('history');
    AutoBackup.markDirty();
    return { total: n, direct, pending, readCount };
  },

  /** Same site, same address scheme: no move needed. */
  directMap(t) {
    const name = (t.sourceName || '').toLowerCase();
    if (name === 'mangadex') {
      const m = t.url.match(/\/(?:manga|title)\/([0-9a-f-]{36})/i);
      if (m) return { source: 'mangadex', id: m[1], chapterId: u => (u.match(/\/chapter\/([0-9a-f-]{36})/i) || [])[1] };
    }
    if (name === 'mangapill') {
      const m = t.url.match(/^\/manga\/(\d+\/[^/?#]+)/);
      if (m) return { source: 'mangapill', id: m[1], chapterId: u => (u.match(/^\/chapters\/([^/]+\/[^/?#]+)/) || [])[1] };
    }
    if (name === 'weeb central') {
      const m = t.url.match(/\/series\/([A-Z0-9]+)/);
      if (m) return { source: 'weebcentral', id: m[1], chapterId: u => (u.match(/\/chapters\/([A-Z0-9]+)/) || [])[1] };
    }
    return null;
  },
};

// ======================================================================== automatic move
/**
 * For each imported series: search EVERY enabled source (built-in and custom sites you add),
 * check the plausible matches' chapter lists, and move it to the best one — the match that
 * covers your read chapters and has the most chapters. No manual picking.
 */
const Mover = {
  running: false, stop: false, stats: null,
  pendingList() { return needsSourceList().filter(s => s.moveStatus !== 'moved'); },
  normTitle(t) { return String(t || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[’'`]/g, '').replace(/&/g, 'and').replace(/\b(the|a|an)\b/g, '').replace(/[^a-z0-9]+/g, ''); },
  /** Title similarity 0..1 (bigram overlap), exact = 1. */
  sim(a, b) {
    a = this.normTitle(a); b = this.normTitle(b);
    if (!a || !b) return 0;
    if (a === b) return 1;
    const grams = x => { const m = new Map(); for (let i = 0; i < x.length - 1; i++) { const g = x.slice(i, i + 2); m.set(g, (m.get(g) || 0) + 1); } return m; };
    const ga = grams(a), gb = grams(b);
    let inter = 0;
    for (const [g, n] of ga) inter += Math.min(n, gb.get(g) || 0);
    const dice = (2 * inter) / Math.max(1, (a.length - 1) + (b.length - 1));
    const contain = (a.includes(b) || b.includes(a)) ? Math.min(a.length, b.length) / Math.max(a.length, b.length) : 0;
    return Math.max(dice, contain * 0.95);
  },
  /** Every enabled clean-reader source, likely ones first. Custom sites you add are included automatically. */
  order(s) {
    const n = (s.tachiSource || '').toLowerCase();
    const hint = [];
    if (/asura/.test(n)) hint.push('asurascans');
    if (/kakalot|manganato|nelo|mangabat|natomanga/.test(n)) hint.push('manganato', 'mangakakalot');
    if (/mangalife|mangasee|weeb/.test(n)) hint.push('weebcentral');
    if (/pill/.test(n)) hint.push('mangapill');
    if (/flame/.test(n)) hint.push('flamecomics');
    if (/mangahere|mangafox|mangatown/.test(n)) hint.push('mangatown');
    if (/toonily/.test(n)) hint.push('toonily');
    if (/manhuaplus/.test(n)) hint.push('manhuaplus');
    if (/mangaread/.test(n)) hint.push('mangaread');
    if (/katana/.test(n)) hint.push('mangakatana');
    const all = Sources.visible().filter(src => src.cap === 'integrated' && src.search && !Prefs.data.disabledSources.includes(src.id));
    return [...hint.map(id => all.find(x => x.id === id)).filter(Boolean), ...all.filter(x => !hint.includes(x.id))];
  },
  maxNum(list) { let m = 0; for (const c of list) { const v = parseFloat(c.num); if (isFinite(v) && v > m) m = v; } return m; },

  async findBest(s, down) {
    const oldCh = await Store.chapters(s.key);
    const oldMax = this.maxNum(oldCh);
    const readNums = new Set(oldCh.filter(c => c.read && c.num).map(c => String(parseFloat(c.num))));
    const sources = this.order(s).filter(src => !down.has(src.id));
    // 1) search every source at once (each host keeps its own rate limit)
    const found = [];
    const queue = [...sources];
    const runOne = async src => {
      if (this.stop) return;
      try {
        const r = await srcCall(src, 'search', s.title.slice(0, 80), 1);
        r.items.map(it => ({ src, it, score: this.sim(it.title, s.title) })).filter(x => x.score >= 0.55)
          .sort((x, y) => y.score - x.score).slice(0, 2).forEach(x => found.push(x));
      } catch (e) { if (['verification', 'login', 'offline', 'server', 'rate'].includes(e.kind)) down.add(src.id); }
    };
    // at most 8 searches at a time, so 50 sources don't flood the network
    await Promise.all(Array.from({ length: 8 }, async () => { while (queue.length) await runOne(queue.shift()); }));
    if (this.stop) return { status: 'pending' };
    if (!found.length) return { status: 'notfound' };
    // 2) open the most plausible matches and compare chapter lists
    found.sort((x, y) => y.score - x.score);
    const checked = [];
    await Promise.all(found.slice(0, 8).map(async f => {
      try {
        const res = await srcCall(f.src, 'details', f.it.id);
        const titles = [res.series.title, ...(res.series.alt || [])];
        const score = Math.max(f.score, ...titles.map(t => this.sim(t, s.title)));
        const usable = res.chapters.filter(c => !c.locked && !c.external);
        const nums = new Set(usable.filter(c => c.num).map(c => String(parseFloat(c.num))));
        let covered = 0; readNums.forEach(n => { if (nums.has(n)) covered++; });
        const coverage = readNums.size ? covered / readNums.size : 1;
        const max = this.maxNum(usable);
        const countOk = !oldMax || (max >= oldMax * 0.6 && max <= oldMax * 2 + 30);
        checked.push({ src: f.src, it: f.it, res, score, coverage, count: usable.length, max, accept: score >= 0.9 || (score >= 0.6 && countOk && (coverage >= 0.5 || !readNums.size)) });
      } catch { /* that source failed for this title; others still count */ }
    }));
    const ok = checked.filter(c => c.accept);
    if (!ok.length) return { status: 'notfound', near: checked.sort((x, y) => y.score - x.score).slice(0, 3).map(c => ({ source: c.src.id, id: c.it.id, title: c.res.series.title, cover: c.res.series.cover || c.it.cover, url: c.it.url })) };
    // best: covers what you read, then most chapters, then closest title
    ok.sort((x, y) => (y.coverage >= 0.95) - (x.coverage >= 0.95) || y.count - x.count || y.score - x.score);
    return { status: 'found', best: ok[0], alternatives: ok.length - 1 };
  },

  /** Moves one placeholder onto a real series using an already-fetched chapter list when available. */
  async apply(old, target, fetched) {
    const key = Store.key(target.source, target.id);
    let ns = Store.get(key);
    const created = !ns;
    if (!ns) { ns = { key, source: target.source, id: target.id, title: target.title, cover: target.cover || '', url: target.url || '', inLibrary: 0, categories: [], prefs: {}, unread: 0, dlCount: 0, chapterCount: 0, baseline: false }; Store.series.set(key, ns); }
    try {
      if (fetched) {
        Object.assign(ns, Store.upsertSeriesMeta(target.source, { ...fetched.series, id: target.id }), { inLibrary: ns.inLibrary, categories: ns.categories, prefs: ns.prefs, addedAt: ns.addedAt, baseline: ns.baseline });
        ns.lastFetch = ns.lastFetchOk = Date.now();
        await Store.mergeChapters(ns, fetched.chapters, fetched.complete, fetched.ordered);
        await Store.saveSeries(ns);
      } else await Store.refreshSeries(ns);
    } catch (e) { if (created) Store.series.delete(key); throw e; }
    const oldCh = await Store.chapters(old.key), newCh = await Store.chapters(key);
    const byNum = new Map();
    newCh.forEach(c => { if (c.num && !c.locked) { const k = String(parseFloat(c.num)); if (!byNum.has(k)) byNum.set(k, []); byNum.get(k).push(c); } });
    const find = c => c.num ? (byNum.get(String(parseFloat(c.num))) || []) : [];
    const toRead = [];
    let missing = 0;
    oldCh.filter(c => c.read).forEach(c => { const m = find(c); if (!m.length && c.num) missing++; m.forEach(n => { if (!n.read) toRead.push(n); }); });
    const prog = [];
    for (const c of oldCh.filter(c => !c.read)) {
      const p = await DB.get('progress', c.key);
      const n = find(c)[0];
      if (p && n && !n.read) prog.push({ ...p, chapterKey: n.key });
    }
    if (toRead.length) await Store.setRead([...new Map(toRead.map(c => [c.key, c])).values()], true);
    if (prog.length) await DB.putMany('progress', prog);
    const h = await DB.get('history', old.key);
    if (h) {
      const oc = oldCh.find(c => c.key === h.chapterKey);
      const n = oc && find(oc)[0];
      if (n) await DB.put('history', { seriesKey: key, chapterKey: n.key, label: n.label, title: n.title || '', at: h.at });
      await DB.del('history', old.key);
    }
    ns = Store.get(key) || ns;
    ns.addedAt = Math.min(ns.addedAt || Infinity, old.addedAt || Date.now());
    ns.lastReadAt = Math.max(ns.lastReadAt || 0, old.lastReadAt || 0);
    ns.moveMissing = missing; ns.movedFrom = old.key;
    await Store.addToLibrary(ns, [...new Set([...(ns.categories || []), ...(old.categories || [])])]);
    old.inLibrary = 0; old.moveStatus = 'moved'; old.movedTo = key; old.moveCandidates = null; old.moveMissing = missing;
    await Store.saveSeries(old);
    return { key, read: toRead.length, missing };
  },

  async run(onTick) {
    if (this.running) return;
    this.running = true; this.stop = false;
    await DB.setMeta('moverActive', true);
    const list = this.pendingList().filter(s => s.moveStatus !== 'notfound');
    const st = this.stats = { total: list.length, done: 0, moved: 0, notfound: 0, gaps: 0, failed: 0, current: '', startedAt: Date.now() };
    const down = new Set();
    const queue = [...list];
    const tick = () => { onTick && onTick(); Store.emit('mover'); };
    const worker = async () => {
      while (queue.length && !this.stop) {
        const s = queue.shift();
        st.current = s.title; tick();
        try {
          const r = await this.findBest(s, down);
          if (r.status === 'found') {
            const b = r.best;
            try { const res = await this.apply(s, { source: b.src.id, id: b.it.id, title: b.res.series.title || b.it.title, cover: b.res.series.cover || b.it.cover, url: b.it.url }, b.res); st.moved++; if (res.missing) st.gaps++; }
            catch { s.moveStatus = 'error'; await Store.saveSeries(s); st.failed++; }
          } else if (r.status === 'notfound') { s.moveStatus = 'notfound'; s.moveCandidates = r.near || null; await Store.saveSeries(s); st.notfound++; }
        } catch { st.failed++; }
        if (!this.stop) st.done++;
        tick();
      }
    };
    await Promise.all([worker(), worker()]);
    this.running = false;
    if (!this.stop || !this.pendingList().some(s => s.moveStatus !== 'notfound')) await DB.setMeta('moverActive', false);
    Store.emit('library');
    tick();
    return st;
  },
  /** "12 / 670 · 5 per min · about 2 h 10 min left" */
  progressText() {
    const st = this.stats;
    if (!st) return '';
    const mins = (Date.now() - st.startedAt) / 60000;
    const rate = mins > 0.2 ? st.done / mins : 0;
    const left = rate ? (st.total - st.done) / rate : 0;
    const eta = !rate ? 'estimating time…' : left < 1 ? 'under a minute left' : left < 60 ? `about ${Math.round(left)} min left` : `about ${Math.floor(left / 60)} h ${Math.round(left % 60)} min left`;
    return `${st.done} / ${st.total} · ${rate ? rate.toFixed(1) + ' per min · ' : ''}${eta}`;
  },
};

/** Pending (imported, not yet moved) entries get a stand-in source so they display and can be moved. */
function pendingSource(id) {
  return { id, name: 'Tachiyomi: ' + id.slice(6).replace(/-/g, ' '), hosts: [], cap: 'pending', pending: true, lang: 'multi', letter: 'T', color: '#4a3b1f', site: '' };
}

async function importTachiFlow(file) {
  let parsed;
  const close = UI.toast('Reading the Tachiyomi backup…', { ms: 60000 });
  try { parsed = Tachi.read(await Tachi.bytes(file.blob)); } catch (e) { close(); UI.dialog({ title: 'Import failed', body: esc((e.message || 'This file could not be read.') + ' Nothing was changed.') }); return; }
  close();
  const bySource = {};
  parsed.series.forEach(t => { const k = t.sourceName || 'Unknown source'; bySource[k] = (bySource[k] || 0) + 1; });
  const direct = parsed.series.filter(t => Tachi.directMap(t)).length;
  const read = parsed.series.reduce((n, t) => n + t.chapters.filter(c => c.read).length, 0);
  const top = Object.entries(bySource).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const ok = await UI.dialog({ title: 'Import from Tachiyomi', body: html`<dl class="kv"><dt>Series</dt><dd>${parsed.series.length}</dd><dt>Read chapters</dt><dd>${read}</dd><dt>Ready to read now</dt><dd>${direct}</dd><dt>Need a new source</dt><dd>${parsed.series.length - direct}</dd></dl>
    <p>Most Tachiyomi sources are sites or addresses Otaku Vault cannot load. Those series come in with their full read history and a <b>Move</b> badge. Afterwards, Otaku Vault looks each one up on every working source, picks the best match automatically, and carries your read chapters over by chapter number.</p>
    <p style="font-size:13px">Largest sources: ${top.map(([k, v]) => `${k} (${v})`).join(', ')}</p>`, buttons: [{ label: 'Cancel', value: false }, { label: 'Import', value: true, primary: true }] });
  if (!ok) return;
  await DB.setMeta('preRestoreBackup', await Backup.build());
  const prog = UI.toast('Importing…', { ms: 120000 });
  try {
    const r = await Tachi.import(parsed, (n, t) => { const el2 = $('#toasts .toast span'); if (el2) el2.textContent = `Importing ${n} / ${t}…`; });
    prog();
    LibraryView.render();
    const go = await UI.dialog({ title: 'Imported', body: html`<p>${r.total} series and ${r.readCount} read chapters are in your library.</p>${r.pending ? html`<p>${r.pending} need a new source. Move them automatically now? Each is checked against every source and moved to the best match. Progress shows in More.</p>` : ''}`, buttons: r.pending ? [{ label: 'Later', value: false }, { label: 'Move them now', value: true, primary: true }] : [{ label: 'OK', value: false, primary: true }] });
    if (go) openMover(true);
    else if (r.pending) UI.toast('You can start it any time from More or Browse → Migrate', { ms: 5000 });
  } catch (e) {
    prog();
    UI.dialog({ title: 'Import stopped', body: esc((e.message || 'Unknown error') + '. Use “Restore the safety backup” in Data and storage to undo.') });
  }
}

function openMover(autostart) {
  const v = subScreen('Move to working sources');
  let tab = 'gaps';
  const draw = () => {
    const lib = Store.library();
    const pend = lib.filter(needsSource);
    const movedAll = [...Store.series.values()].filter(s => s.moveStatus === 'moved' && s.movedTo);
    const groups = {
      gaps: movedAll.filter(s => s.moveMissing > 0).map(s => Store.get(s.movedTo)).filter(Boolean),
      notfound: pend.filter(s => s.moveStatus === 'notfound' || s.moveStatus === 'error'),
      waiting: pend.filter(s => s.moveStatus !== 'notfound' && s.moveStatus !== 'error'),
      moved: movedAll.map(s => Store.get(s.movedTo)).filter(Boolean),
    };
    const st = Mover.stats;
    const pct = st && st.total ? Math.round(st.done / st.total * 100) : 0;
    v.body.innerHTML = String(html`<div class="pad" style="padding-top:8px">
      <p style="color:var(--text2);line-height:1.45">Each series is looked up on every enabled source, including sites you add. The best match moves automatically — the one that has the chapters you read and the most chapters — with your read chapters, saved page and history.</p>
      ${Mover.running && st ? html`<div class="notice"><b>Working…</b> ${Mover.progressText()}<div style="height:6px;background:#2a2b31;border-radius:3px;margin:8px 0"><div style="height:6px;width:${pct}%;background:var(--accent);border-radius:3px"></div></div>Moved ${st.moved} · not found ${st.notfound}${st.gaps ? ' · ' + st.gaps + ' with missing chapters' : ''}<br><span style="color:var(--text3)">Now: ${st.current}</span></div>` : ''}
      <dl class="kv"><dt>Moved</dt><dd>${groups.moved.length}</dd><dt>Waiting</dt><dd>${groups.waiting.length}</dd><dt>Not found</dt><dd>${groups.notfound.length}</dd><dt>Missing chapters</dt><dd>${groups.gaps.length}</dd></dl>
      <div class="btnrow" style="margin:10px 0">${Mover.running ? html`<button class="btn tonal" data-stop>${icon('pause')} Stop</button>` : html`${groups.waiting.length ? html`<button class="btn" data-go>${icon('play')} ${st ? 'Continue' : 'Start'}</button>` : ''}${groups.notfound.length ? html`<button class="btn ${groups.waiting.length ? 'ghost' : ''}" data-retry>Search not-found again</button>` : ''}`}</div>
      <p style="color:var(--text3);font-size:13px">Runs while the app is open. If you leave, it picks up again next time you open the app.</p></div>
      <div class="tabs" role="tablist">${[['gaps', 'Missing chapters', groups.gaps.length], ['notfound', 'Not found', groups.notfound.length], ['waiting', 'Waiting', groups.waiting.length], ['moved', 'Moved', groups.moved.length]].map(([id, l, n]) => html`<button class="tab" role="tab" aria-selected="${tab === id}" data-tab="${id}">${l} (${n})</button>`)}</div>
      ${tab === 'gaps' ? html`<div class="notice">These moved, but the new source does not have every chapter you had read. Read state was copied for the chapters it does have.</div>` : ''}
      ${tab === 'notfound' ? html`<div class="notice">No enabled source has these yet. They keep their full history. Tap one to search by hand, or add a source and search again.</div>` : ''}
      <div class="list">${groups[tab].slice(0, 400).map(s => html`<div class="row" data-s="${s.key}" role="button" tabindex="0">${coverImg(s, 'cov')}<div class="body"><div class="t">${s.title}</div><div class="s">${tab === 'moved' || tab === 'gaps' ? (Sources.get(s.source) || { name: s.source }).name + ' · ' + plural(s.chapterCount || 0, 'chapter') + (s.moveMissing ? ' · ' + s.moveMissing + ' read chapters not on this source' : '') : (s.tachiSource || (Sources.get(s.source) ? '' : 'Removed source: ' + s.source)) + ' · ' + (s.chapterCount - (s.unread || 0)) + ' read'}</div></div>${icon(tab === 'moved' || tab === 'gaps' ? 'book' : 'migrate')}</div>`)}</div>`);
  };
  const tick = debounce(draw, 400);
  const unsub = Store.on(w => { if (w === 'mover' && v.el.isConnected) tick(); });
  v.onPop = unsub;
  v.el.addEventListener('click', async e => {
    const t = e.target.closest('[data-go],[data-stop],[data-retry],[data-tab],[data-s]'); if (!t) return;
    if (t.dataset.tab) { tab = t.dataset.tab; draw(); return; }
    if (t.dataset.stop != null) { Mover.stop = true; await DB.setMeta('moverActive', false); UI.toast('Stopping after the current titles…'); return; }
    if (t.dataset.retry != null) needsSourceList().filter(s => (s.moveStatus === 'notfound' || s.moveStatus === 'error')).forEach(s => { s.moveStatus = 'pending'; });
    if (t.dataset.go != null || t.dataset.retry != null) { startMover(); draw(); return; }
    if (t.dataset.s) { const s = Store.get(t.dataset.s); if (s && needsSource(s)) pendingSheet(s, draw); else openDetails(s); }
  });
  draw();
  UI.push(v);
  if (autostart && !Mover.running) { startMover(); draw(); }
}

/** A library series is stuck when its source is a Tachiyomi placeholder or a source that no longer exists (e.g. a removed site). */
function needsSource(s) { return !!s && s.moveStatus !== 'moved' && (String(s.source).startsWith('tachi:') || !Sources.get(s.source)); }
function needsSourceList() { return Store.library().filter(needsSource); }

/** Library ⋮ → Auto-migrate: re-checks everything without a working source (including earlier not-found ones). */
function autoMigrateNoSource() {
  const list = needsSourceList();
  if (!list.length) { UI.toast('Every series in your library has a working source'); return; }
  if (Mover.running) { UI.toast('Already running — progress is at the top of the Library'); return; }
  list.forEach(s => { if (s.moveStatus === 'notfound' || s.moveStatus === 'error') s.moveStatus = 'pending'; });
  UI.toast(`Looking for ${list.length} series on every source…`);
  startMover();
  LibraryView.render();
}

/** Progress strip at the top of the Library: library updates and auto-migrate, each with a bar. */
function libProgress(up) {
  if (!up) return;
  const bar = pct => `<div class="pbar"><div style="width:${Math.max(2, Math.min(100, pct))}%"></div></div>`;
  if (Store.updating) {
    const u = Store.updating, pct = u.total ? u.done / u.total * 100 : 0;
    up.hidden = false; delete up.dataset.act; up.style.cursor = '';
    up.innerHTML = String(html`<div><b>Updating library</b> ${u.done} / ${u.total}</div><div class="ps">${u.current || ''}</div>`) + bar(pct);
  } else if (Mover.running && Mover.stats) {
    const st = Mover.stats, pct = st.total ? st.done / st.total * 100 : 0;
    up.hidden = false; up.dataset.act = 'mover'; up.style.cursor = 'pointer';
    up.innerHTML = String(html`<div style="display:flex;gap:8px;align-items:baseline"><b style="flex:1">Auto-migrating ${Math.round(pct)}%</b><span class="ps">Tap for details</span></div><div class="ps">${Mover.progressText()}</div>`) + bar(pct) + String(html`<div class="ps">Moved ${st.moved} · not found ${st.notfound}${st.gaps ? ' · ' + st.gaps + ' missing chapters' : ''}${st.current ? ' · now: ' + st.current : ''}</div>`);
  } else { up.hidden = true; delete up.dataset.act; up.style.cursor = ''; }
}

function startMover() {
  if (Mover.running) return;
  Mover.run().then(st => { if (st && !Mover.stop) UI.toast(`Move finished: ${st.moved} moved, ${st.notfound} not found${st.gaps ? ', ' + st.gaps + ' with missing chapters' : ''}`, { ms: 7000 }); });
}

/** Sheet for one imported series: pick a suggested match, search manually, or open what is known. */
function pendingSheet(s, redraw) {
  if (!s) return;
  const node = el(html`<div class="sb"><h4>${s.title}</h4><p style="color:var(--text2)">From ${s.tachiSource || (s.source.startsWith('tachi:') ? 'Tachiyomi' : s.source)} · ${plural(s.chapterCount || 0, 'chapter')}, ${s.chapterCount - (s.unread || 0)} read. This source is not available in Otaku Vault, so the series needs a working source before it can be read.</p>
    ${s.moveCandidates && s.moveCandidates.length ? html`<h4>Closest titles found (not certain enough to move automatically)</h4><div class="thumbs" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">${s.moveCandidates.map((c, i) => html`<button class="card" data-c="${i}"><div class="cv">${coverImg({ ...c, source: c.source })}<div class="badges"><span class="badge">${(Sources.get(c.source) || { name: c.source }).name}</span></div><div class="ttl"><div class="clamp2">${c.title}</div></div></div></button>`)}</div>` : ''}
    <div class="btnrow" style="margin-top:14px"><button class="btn tonal" data-manual>${icon('search')} Search sources</button><button class="btn ghost" data-keep>Keep as is</button><button class="textbtn" data-rm>Remove</button></div></div>`);
  const o = UI.sheet(node, { label: s.title });
  node.addEventListener('click', async e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.c) {
      const c = s.moveCandidates[+t.dataset.c];
      o.close();
      const close = UI.toast('Moving to ' + (Sources.get(c.source) || {}).name + '…', { ms: 30000 });
      try { const r = await Mover.apply(s, c); close(); UI.toast(`Moved · ${plural(r.read, 'chapter')} marked read`); redraw && redraw(); }
      catch (err) { close(); UI.dialog({ title: 'Could not move', body: esc(errorText(err)) }); }
    }
    if (t.dataset.manual != null) { o.close(); Migration.start(s); }
    if (t.dataset.keep != null) o.close();
    if (t.dataset.rm != null) { o.close(); await Store.removeFromLibrary([s.key]); UI.toast('Removed', { action: 'Undo', onAction: () => Store.addToLibrary(s) }); redraw && redraw(); }
  });
}

/* ==========================================================================
   Otaku Vault — in-app browser glue. The browser itself is native (MainActivity);
   this file decides what "save" means for a page and remembers where you were.
   ========================================================================== */

const Browser = {
  /** What saving this address would create: a clean-reader series on a supported source, or a website bookmark. */
  target(urlStr) {
    let u;
    try { u = normalizeInputUrl(urlStr); } catch { return null; }
    const src = Sources.forHost(u.hostname);
    if (src && src.cap === 'integrated') {
      let cls = { type: 'home' };
      try { cls = src.classify(u); } catch { /* treat as home */ }
      if (cls.type === 'series') return { kind: 'series', src, id: cls.id, u };
      if (cls.type === 'chapter') return { kind: 'chapter', src, cls, u };
      return { kind: 'home', src, u };
    }
    const id = (u.pathname + u.search).slice(0, 300) || '/';
    return { kind: 'web', key: Store.key('web:' + u.hostname, id), u, id };
  },
  isSaved(urlStr) {
    const t = this.target(urlStr);
    if (!t) return false;
    if (t.kind === 'series') { const s = Store.get(Store.key(t.src.id, t.id)); return !!(s && s.inLibrary); }
    if (t.kind === 'chapter' && t.cls.seriesId) { const s = Store.get(Store.key(t.src.id, t.cls.seriesId)); return !!(s && s.inLibrary); }
    if (t.kind === 'web') {
      const s = Store.get(t.key);
      if (s && s.inLibrary) return true;
      return Store.library().some(x => x.website && x.url === t.u.href);
    }
    return false;
  },
  async save(pageJson, realUrl) {
    let info = {};
    try { info = JSON.parse(pageJson) || {}; } catch { info = {}; }
    const t = this.target(realUrl);
    if (!t) { Native.call('toast', "This page can't be saved."); return; }
    const pageTitle = String(info.title || '').replace(/\s+/g, ' ').trim().slice(0, 200);
    if (t.kind === 'home') { Native.call('toast', `Open a series page on ${t.src.name} to save it.`); return; }
    if (t.kind === 'series' || t.kind === 'chapter') {
      let id = t.kind === 'series' ? t.id : t.cls.seriesId;
      if (!id && t.src.chapterParent) id = await t.src.chapterParent(t.cls.chapterId).catch(() => null);
      if (!id) { Native.call('toast', 'Open the series page to save it.'); return; }
      const key = Store.key(t.src.id, id);
      let s = Store.get(key);
      if (s && s.inLibrary) { Native.call('toast', 'Already in your library.'); Native.call('browserSaved', true); return; }
      if (!s) { s = { key, source: t.src.id, id, title: pageTitle || t.src.name, cover: '', url: t.src.seriesUrl ? t.src.seriesUrl(id) : t.u.href, inLibrary: 0, categories: [], prefs: {}, unread: 0, dlCount: 0, chapterCount: 0, baseline: false }; Store.series.set(key, s); }
      await Store.addToLibrary(s, []);
      Native.call('browserSaved', true);
      Native.call('toast', `Saved to your library. ${t.src.name} opens in the clean reader.`);
      Store.refreshSeries(s).then(() => Store.emit('library')).catch(() => {});
      return;
    }
    let s = Store.get(t.key);
    if (s && s.inLibrary) { Native.call('toast', 'Already in your library.'); Native.call('browserSaved', true); return; }
    s = s || { key: t.key, source: 'web:' + t.u.hostname, id: t.id, inLibrary: 0, categories: [], prefs: {}, unread: 0, dlCount: 0, chapterCount: 0, baseline: true, status: 'unknown', tags: [] };
    s.title = pageTitle || (info.site ? String(info.site).slice(0, 80) : t.u.hostname);
    s.cover = /^https:\/\//.test(info.image || '') ? info.image : (s.cover || '');
    s.url = t.u.href; s.website = true; s.lastReadAt = Date.now();
    Store.series.set(t.key, s);
    await Store.addToLibrary(s, []);
    Native.call('browserSaved', true);
    Native.call('toast', 'Saved to your library. It reopens here, where you left off.');
  },
  /** Remember the last page for website bookmarks so they reopen where you stopped. */
  async closed(lastUrl, key) {
    if (Reader.open) Reader.applyPrefs();
    if (!key || !lastUrl) return;
    const s = Store.get(key);
    if (!s || !s.website) return;
    try {
      const a = new URL(lastUrl), b = new URL(s.url);
      if (a.protocol !== 'https:' || a.hostname !== b.hostname) return;
      s.url = a.href; s.lastReadAt = Date.now();
      await Store.saveSeries(s);
      Store.emit('library');
    } catch { /* keep the saved address */ }
  },
  /** Opens the in-app browser (outside the Android app this falls back to a new tab). */
  open(url, key) {
    if (!url) return;
    if (NATIVE && typeof window.OVNative.openBrowser === 'function') Native.call('openBrowser', url, key || '');
    else Native.openExternal(url);
  },
};
window.ovBrowserBookmark = (pageJson, realUrl) => Browser.save(pageJson, realUrl);
window.ovBrowserIsSaved = url => Browser.isSaved(url);
window.ovBrowserClosed = (url, key) => Browser.closed(url, key);

/* ==========================================================================
   Otaku Vault — startup
   ========================================================================== */

const BOOT_START = Date.now();
function hideSplash() {
  const sp = document.getElementById('splash');
  if (!sp) return;
  setTimeout(() => { sp.classList.add('out'); setTimeout(() => sp.remove(), 450); }, Math.max(0, 1100 - (Date.now() - BOOT_START)));
}
async function boot() {
  Prefs.load();
  try {
    await DB.open();
  } catch (e) {
    hideSplash();
    document.body.innerHTML = String(html`<div class="empty" style="height:100%;justify-content:center"><b>Storage could not be opened</b><span>${e.message || e}</span><button class="btn" onclick="location.reload()">Try again</button></div>`);
    return;
  }
  await Health.load();
  await loadCustomSources();
  await Store.init();
  await Downloads.init();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if (WEB && 'serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

  UI.init();
  UI.registerRoot('library', LibraryView.build());
  UI.registerRoot('updates', UpdatesView.build());
  UI.registerRoot('history', HistoryView.build());
  UI.registerRoot('browse', BrowseView.build());
  UI.registerRoot('more', MoreView.build());
  Reader.build();
  UI.go('library');
  hideSplash();

  window.ovBack = () => UI.back();
  window.ovIncoming = text => { if (Reader.open) Reader.close(); AddLink.open(text); };
  window.ovLifecycle = state => {
    if (state === 'pause' && Reader.open) Reader.saveNow();
    if (state === 'pause' && AutoBackup.dirty) AutoBackup.run('pause');
    if (state === 'resume') maybeAutoUpdate();
  };
  Store.on(w => { if (w === 'updates' || w === 'updating') UI.updateBadges(); });
  AutoBackup.init();
  setTimeout(() => AutoBackup.run('launch'), 8000);
  // Resume moving imported series if the app was closed mid-way.
  if (await DB.meta('moverActive', false) && Mover.pendingList().some(s => s.moveStatus !== 'notfound')) {
    setTimeout(() => { if (!Mover.running) { UI.toast('Continuing to move imported series — progress is in More'); startMover(); } }, 6000);
  }

  // Return to the reader if the app was closed by the system while a chapter was open.
  const open = await DB.meta('readerOpen', null);
  if (open && open.seriesKey) {
    const s = Store.get(open.seriesKey);
    const ch = s && await DB.get('chapters', open.chapterKey);
    if (s && ch) Reader.openChapter(s, ch);
  }
  maybeAutoUpdate();
}

async function maybeAutoUpdate() {
  if (!Prefs.data.updateOnLaunch || Store.updating || !Store.library().length) return;
  const last = await DB.meta('lastUpdateAttempt', 0);
  if (Date.now() - last < Prefs.data.updateIntervalHours * 3600e3) return;
  setTimeout(() => Store.updateLibrary({ manual: false }).then(r => { if (r && r.added) UI.toast(plural(r.added, 'new chapter') + ' in your library'); UI.updateBadges(); }), 2500);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
