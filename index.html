/** Paste an address; the app checks the site and only adds it if it can actually read it. */
async function addCustomSource() {
  const node = el(html`<div><label>Site address<input class="field" placeholder="example.com" data-base data-autofocus autocapitalize="off" spellcheck="false"></label>
    <p style="font-size:13px;color:var(--text2)">Otaku Vault checks the site first and only adds it if it can read it.</p><div class="out"></div></div>`);
  const out = $('.out', node);
  let done = false;
  const say = (cls, msg) => { out.innerHTML = String(html`<div class="notice ${cls}" style="margin:8px 0 0">${raw(msg)}</div>`); };
  const check = async d => {
    if (done) return true;
    let u;
    try { u = normalizeInputUrl($('[data-base]', d).value); } catch (e) { say('err', esc(e.message)); return undefined; }
    const known = Sources.forHost(u.hostname);
    if (known) { say('', esc(`${known.name} is already ${known.website ? 'listed (website only)' : 'a built-in source'}.`)); return undefined; }
    say('', '<div class="spinner sm" style="display:inline-block;vertical-align:middle;margin-right:8px"></div>Checking the site…');
    const r = await detectSite(u);
    if (!r.ok) { say('err', r.msg); return undefined; }
    const list = await DB.meta('customSources', []);
    list.push(r.cfg);
    await DB.setMeta('customSources', list);
    await loadCustomSources();
    Health.mark(r.cfg.id, true);
    BrowseView.render();
    UI.toast(`Added ${r.cfg.name}. Found ${plural(r.count, 'series')} on its front page.`);
    done = true;
    return true;
  };
  await UI.dialog({ title: 'Add a site', node, buttons: [{ label: 'Close', value: null }, { label: 'Check and add', primary: true, value: d => { check(d).then(v => { if (v) UI.back(); }); return undefined; } }] });
}

/** Works out whether a site uses a theme Otaku Vault can read, and which address pattern it uses. */
async function detectSite(u) {
  const plain = m => ({ ok: false, msg: m });
  let doc;
  try { doc = await Net.doc(u.origin + '/', { timeout: 20000 }); }
  catch (e) {
    if (e.kind === 'verification') return plain(`${esc(u.hostname)} sits behind an anti-bot check, and sites like that usually keep blocking apps even after you pass it, so it can't be added reliably.`);
    return plain(`Couldn't reach ${esc(u.hostname)}: ${esc(errorText(e))}`);
  }
  const htmlText = doc.documentElement.outerHTML;
  const madara = /wp-manga|\/themes\/madara|madara-|manga-chapters-holder|c-tabs-item__content|page-item-detail/i.test(htmlText);
  if (!madara) {
    const why = /vrf=|captcha|cf-turnstile/i.test(htmlText) ? ' It also uses captcha and token protection that the app will not get around.' : '';
    return plain(`${esc(u.hostname)} isn't built on a layout Otaku Vault can read automatically, so it can't be added here.${why} Send the address to the developer: sites like this need their own code.`);
  }
  // pick the path segment series live under (/manga/, /webtoon/, /series/ …)
  const counts = {};
  $$('a[href]', doc).forEach(a => {
    try {
      const x = new URL(a.getAttribute('href'), u.origin);
      if (x.hostname !== u.hostname) return;
      const sg = pathSegs(x);
      if (sg.length === 2 && /^[a-z0-9-]+$/i.test(sg[1]) && !['page', 'genre', 'tag', 'author', 'category', 'wp-content', 'feed'].includes(sg[0])) counts[sg[0]] = (counts[sg[0]] || 0) + 1;
    } catch { /* skip */ }
  });
  const pref = ['manga', 'webtoon', 'webtoons', 'series', 'serie', 'manhwa', 'manhua', 'comic', 'comics', 'read'];
  const sub = Object.entries(counts).sort((a, b) => b[1] - a[1] || pref.indexOf(a[0]) - pref.indexOf(b[0])).map(x => x[0]).find(x => pref.includes(x)) || 'manga';
  const name = ((doc.querySelector('meta[property="og:site_name"]') || {}).content || u.hostname.replace(/^www\./, '')).slice(0, 40);
  const id = 'custom-' + u.hostname.replace(/[^a-z0-9]/g, '-');
  const cfg = { id, name, base: u.origin, sub, nsfw: false, hosts: [u.hostname] };
  // prove it: read its series list before adding
  const trial = madaraSource({ ...cfg, custom: true });
  for (const fn of [() => trial.popular(1), () => trial.latest(1)]) {
    try { const r = await fn(); if (r.items.length) return { ok: true, cfg, count: r.items.length }; } catch { /* try the next listing */ }
  }
  return plain(`${esc(u.hostname)} looks compatible, but its series list couldn't be read. It may use a modified layout. Send the address to the developer.`);
}

async function removeCustomSite(id) {
  const src = Sources.get(id);
  if (!src || !src.custom) return false;
  if (!(await UI.confirm('Remove site', `Remove ${src.name}? Series from it stay in your library but can't refresh.`, 'Remove'))) return false;
  await DB.setMeta('customSources', (await DB.meta('customSources', [])).filter(c => c.id !== id));
  Sources.list = Sources.list.filter(s => s.id !== id); delete Sources.byId[id];
  BrowseView.render();
  UI.toast('Removed ' + src.name);
  return true;
}

async function quickCheckSources() {
  const list = Sources.list.filter(s => s.cap === 'integrated');
  UI.toast('Checking ' + list.length + ' sources…');
  await Promise.all(list.map(s => srcCall(s, 'popular', 1).catch(() => null)));
  UI.toast('Source check finished');
}

// ======================================================================== quick add from Browse (long press)
async function quickToggleLibrary(srcId, it, redraw) {
  const key = Store.key(srcId, it.id);
  let s = Store.get(key);
  navigator.vibrate && navigator.vibrate(25);
  if (s && s.inLibrary) {
    await Store.removeFromLibrary([key]);
    redraw && redraw();
    UI.toast('Removed ' + s.title + ' from library', { action: 'Undo', onAction: async () => { await Store.addToLibrary(s); redraw && redraw(); } });
    return;
  }
  if (!s) { s = { key, source: srcId, id: it.id, title: it.title, cover: it.cover || '', url: it.url || '', inLibrary: 0, categories: [], prefs: {}, unread: 0, dlCount: 0, chapterCount: 0, baseline: false, status: 'unknown', tags: [] }; Store.series.set(key, s); }
  await Store.addToLibrary(s, []);
  redraw && redraw();
  UI.toast('Added ' + s.title + ' to library', { ms: 5000, action: Store.categories.length ? 'Category' : '', onAction: async () => { const c = await pickCategories([]); if (c) { s.categories = c; await Store.saveSeries(s); Store.emit('library'); } } });
  // Fetch details and chapters in the background so the library entry is complete.
  Store.refreshSeries(s).then(() => { Store.emit('library'); redraw && redraw(); }).catch(() => {});
}

// ======================================================================== Source listing
function openSource(src, mode = 'popular', query = '') {
  Prefs.set('lastUsedSource', src.id);
  const v = { el: screen('source'), page: 1, mode, query, items: [], next: true, loading: false, error: null, gen: 0 };
  const load = async (reset) => {
    if (v.loading) return;
    if (reset) { v.page = 1; v.items = []; v.next = true; v.error = null; v.gen++; }
    if (!v.next) return;
    const gen = v.gen;
    v.loading = true; draw();
    try {
      const r = v.mode === 'search' ? await srcCall(src, 'search', v.query, v.page) : await srcCall(src, v.mode, v.page);
      if (gen !== v.gen) return;
      const seen = new Set(v.items.map(i => i.id));
      v.items.push(...r.items.filter(i => !seen.has(i.id)));
      v.next = !!r.next && r.items.length > 0; v.page++;
      if (src.probeLock) LockInfo.probe(src, r.items, () => { if (gen === v.gen) drawSoon(); }, () => gen === v.gen && v.el.isConnected);
    } catch (e) { if (gen === v.gen) v.error = e; }
    v.loading = false; draw();
  };
  let drawT = null;
  const drawSoon = () => { clearTimeout(drawT); drawT = setTimeout(draw, 250); };
  const draw = () => {
    const grid = $('.tiles', v.el), st = $('.state', v.el);
    $$('[data-mode]', v.el).forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === v.mode));
    const hide = Prefs.data.hidePaidSeries;
    const shown = v.items.filter(it => !hide || !['locked', 'none'].includes(LockInfo.get(src.id, it.id)));
    const hidden = v.items.length - shown.length;
    grid.innerHTML = String(tileContainer(shown.map(it => {
      const s = Store.get(Store.key(src.id, it.id));
      const lk = LockInfo.get(src.id, it.id);
      return seriesTile({ ...it, source: src.id }, {
        cls: lk === 'locked' || lk === 'none' ? 'dim' : '', attrs: `data-id="${esc(it.id)}"`,
        label: it.title + (lk === 'locked' ? ', official paid site only' : ''),
        badges: html`${s && s.inLibrary ? html`<span class="badge unread">In library</span>` : ''}${lockBadge(lk)}`,
        sub: s && s.inLibrary ? 'In your library' : '',
      });
    })));
    const hp = $('[data-hidepaid]', v.el);
    if (hp) { hp.setAttribute('aria-pressed', !!hide); hp.innerHTML = hide ? `Hide paid${hidden ? ' (' + hidden + ')' : ''}` : 'Hide paid'; }
    const stuck = v.error && v.error.kind === 'verification' && v.verified;
    st.innerHTML = v.loading ? '<div class="spinner"></div>' : v.error ? String(html`<div class="notice err" style="margin:16px">${stuck ? `${src.name} is still blocking the app after the check, so it can't be used right now. Some sites only allow a real browser.` : errorText(v.error)}<div class="btnrow" style="margin-top:10px">${v.error.kind === 'verification' && !stuck ? html`<button class="btn" data-act="verify">Verify</button>` : ''}<button class="btn tonal" data-act="retry">Retry</button><button class="btn ghost" data-act="web">Open website</button>${src.custom ? html`<button class="btn ghost" data-act="rmsite">Remove this site</button>` : ''}</div></div>`) : !v.items.length ? String(html`<div class="empty"><b>No results</b></div>`) : '';
  };
  v.el.innerHTML = String(html`${topbar({ title: src.name, back: true, actions: html`<button class="iconbtn" data-act="display" aria-label="Display mode">${icon('grid')}</button><button class="iconbtn" data-act="web" aria-label="Open website">${icon('web')}</button>` })}
    <div style="padding:0 16px 8px"><form class="searchbar" data-form><input type="search" placeholder="Search ${src.name}" value="${query}" aria-label="Search ${src.name}"><button class="iconbtn" aria-label="Search">${icon('search')}</button></form></div>
    <div class="chiprow"><button class="chip" data-mode="popular">Popular</button><button class="chip" data-mode="latest">Latest</button><button class="chip" data-hidepaid aria-pressed="false" title="Hide series that are only on official paid sites">Hide paid</button><span style="color:var(--text3);font-size:13px;align-self:center;white-space:nowrap">Hold a cover to add it</span>${src.note ? html`<span style="color:var(--text3);font-size:13px;align-self:center;white-space:normal;min-width:200px">${src.note}</span>` : ''}</div>
    <div class="scroll"><div class="tiles"></div><div class="state"></div></div>`);
  $('[data-form]', v.el).onsubmit = e => { e.preventDefault(); const q = $('input', v.el).value.trim(); if (!q) return; v.mode = 'search'; v.query = q; load(true); };
  v.el.addEventListener('click', e => {
    const t = e.target.closest('[data-act],[data-mode],[data-id],[data-hidepaid]');
    if (!t) return;
    if (t.dataset.hidepaid != null) { Prefs.set('hidePaidSeries', !Prefs.data.hidePaidSeries); draw(); if (Prefs.data.hidePaidSeries && !src.probeLock) UI.toast('Paid series are only detected for MangaDex before opening; other sources show locks once a series is opened'); return; }
    if (t.dataset.act === 'back') UI.pop();
    else if (t.dataset.act === 'display') displayMenu(t, draw);
    else if (t.dataset.act === 'web') Browser.open(src.site);
    else if (t.dataset.act === 'retry') { v.error = null; load(false); }
    else if (t.dataset.act === 'verify') verifyAndRetry(v.error, src, () => { v.verified = true; v.error = null; load(false); });
    else if (t.dataset.act === 'rmsite') removeCustomSite(src.id).then(ok => { if (ok) UI.pop(); });
    else if (t.dataset.mode) { v.mode = t.dataset.mode; load(true); }
    else if (t.dataset.id) { const it = v.items.find(i => i.id === t.dataset.id); openDetails({ source: src.id, ...it }); }
  });
  UI.longPress(v.el, '[data-id]', t => { const it = v.items.find(i => i.id === t.dataset.id); if (it) quickToggleLibrary(src.id, it, draw); });
  const sc = $('.scroll', v.el);
  sc.addEventListener('scroll', () => { if (sc.scrollTop + sc.clientHeight > sc.scrollHeight - 600) load(false); }, { passive: true });
  UI.push(v);
  if (mode === 'search' && query) v.mode = 'search';
  load(true);
}

function openGlobalSearch(q) {
  const v = { el: screen('global'), gen: 0 };
  v.el.innerHTML = String(html`${topbar({ title: 'Search all sources', back: true, actions: html`<button class="iconbtn" data-act="display" aria-label="Display mode">${icon('grid')}</button>` })}
    <div style="padding:0 16px 8px"><form class="searchbar" data-form><input type="search" placeholder="Title" value="${q}" aria-label="Search title" data-autofocus><button class="iconbtn" aria-label="Search">${icon('search')}</button></form></div>
    <div class="scroll"><div class="res"></div></div>`);
  const run = async query => {
    const gen = ++v.gen;
    const list = Sources.visible().filter(s => s.cap === 'integrated' && !Prefs.data.disabledSources.includes(s.id));
    const box = $('.res', v.el);
    box.innerHTML = String(html`${list.map(s => html`<div data-sec="${s.id}"><div class="group" style="display:flex;align-items:center;gap:8px">${s.name}<span class="state" style="flex:1"></span><button class="textbtn" data-more="${s.id}">More</button></div><div class="hs" style="display:flex;gap:10px;overflow-x:auto;padding:0 16px 8px"><div class="spinner sm" style="margin:12px"></div></div></div>`)}`);
    const queue = [...list];
    const worker = async () => {
      while (queue.length) {
        const s = queue.shift();
        const sec = $(`[data-sec="${CSS.escape(s.id)}"]`, box);
        try {
          const r = await Promise.race([srcCall(s, 'search', query, 1), sleep(25000).then(() => { throw new SourceError('offline', '(Timed out.)'); })]);
          if (gen !== v.gen || !sec) return;
          const paint = () => { $('.hs', sec).innerHTML = r.items.length ? String(html`${r.items.slice(0, 12).map(it => { const lk = LockInfo.get(s.id, it.id); const m = displayMode() === 'list' ? 'comfortable' : displayMode(); return raw(String(seriesTile({ ...it, source: s.id }, { force: m, cls: lk === 'locked' || lk === 'none' ? 'dim' : '', attrs: `data-src="${esc(s.id)}" data-id="${esc(it.id)}" style="width:120px;flex:none"`, badges: html`${Store.get(Store.key(s.id, it.id)) && Store.get(Store.key(s.id, it.id)).inLibrary ? html`<span class="badge unread inlib">In library</span>` : ''}${lockBadge(lk)}` }))); })}`) : '<span style="color:var(--text3);padding:8px 0">No results</span>'; };
          paint();
          sec._items = r.items;
          if (s.probeLock) LockInfo.probe(s, r.items.slice(0, 12), debounce(paint, 200), () => gen === v.gen);
        } catch (e) {
          if (gen !== v.gen || !sec) return;
          $('.hs', sec).innerHTML = String(html`<span style="color:var(--danger);padding:8px 0;font-size:14px">${e.kind === 'verification' ? 'Needs a quick check.' : errorText(e)}</span>${e.kind === 'verification' ? html`<button class="textbtn" data-verify="${s.id}">Verify</button>` : ''}`);
          sec._err = e;
        }
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
  };
  $('[data-form]', v.el).onsubmit = e => { e.preventDefault(); const query = $('input', v.el).value.trim(); if (query) run(query); };
  v.el.addEventListener('click', e => {
    const t = e.target.closest('[data-act],[data-id],[data-more],[data-verify]');
    if (!t) return;
    if (t.dataset.act === 'display') { displayMenu(t, () => { const q2 = $('input', v.el).value.trim(); if (q2) run(q2); }); return; }
    if (t.dataset.verify) { const sec = t.closest('[data-sec]'); verifyAndRetry(sec._err, Sources.get(t.dataset.verify), () => run($('input', v.el).value.trim())); return; }
    if (t.dataset.act === 'back') UI.pop();
    else if (t.dataset.more) openSource(Sources.get(t.dataset.more), 'search', $('input', v.el).value.trim());
    else if (t.dataset.id) { const sec = t.closest('[data-sec]'); const it = (sec._items || []).find(i => i.id === t.dataset.id); openDetails({ source: t.dataset.src, ...it }); }
  });
  UI.longPress(v.el, '.card[data-id]', t => {
    const sec = t.closest('[data-sec]');
    const it = sec && (sec._items || []).find(i => i.id === t.dataset.id);
    if (it) quickToggleLibrary(t.dataset.src, it, () => { const inLib = Store.get(Store.key(t.dataset.src, it.id)); const b = t.querySelector('.badges'); if (b) { b.querySelectorAll('.inlib').forEach(x => x.remove()); if (inLib && inLib.inLibrary) b.insertAdjacentHTML('afterbegin', '<span class="badge unread inlib">In library</span>'); } });
  });
  v.onPop = () => { v.gen++; };
  UI.push(v);
  if (q) run(q);
}

// ======================================================================== Series details
async function openDetails(stub) {
  if (!stub) return;
  const src = Sources.get(stub.source);
  if (!src) { const ex = Store.get(key); if (ex && ex.inLibrary) { pendingSheet(ex, () => LibraryView.render()); return; } UI.toast('This source is no longer available'); return; }
  const key = stub.key || Store.key(stub.source, stub.id);
  let s = Store.get(key) || { key, source: stub.source, id: stub.id, title: stub.title || 'Loading…', cover: stub.cover || '', url: stub.url || '', inLibrary: 0, categories: [], prefs: {}, unread: 0, dlCount: 0, chapterCount: 0, baseline: false };
  if (src.website && !s.experimental) { if (NATIVE && s.url && s.inLibrary) { Browser.open(s.url, s.key); return; } websiteSeriesSheet(s); return; }
  if (src.pending) { pendingSheet(Store.get(key) || s, () => LibraryView.render()); return; }
  const v = { el: screen('details'), chapters: [], loading: false, error: null, sel: new Set(), descOpen: false, filter: { unread: false, downloaded: false, bookmarked: false, locked: !!Prefs.data.hideLockedChapters, dedupe: Prefs.data.dedupeReleases === 'prefer-first', q: '' }, sortDesc: Prefs.data.chapterSortDesc };
  const load = async () => {
    v.chapters = await Store.chapters(key);
    draw();
    const stale = !s.lastFetchOk || Date.now() - s.lastFetchOk > 30 * 60000 || !v.chapters.length;
    if (src.cap === 'integrated' && stale) refresh();
  };
  const refresh = async () => {
    if (v.loading) return;
    v.loading = true; v.error = null; draw();
    try {
      if (!Store.get(key)) Store.series.set(key, s);
      await Store.refreshSeries(s);
      s = Store.get(key) || s;
      v.chapters = await Store.chapters(key);
    } catch (e) { v.error = e; }
    v.loading = false; draw();
  };
  const visible = () => {
    let list = v.chapters.filter(c => !c.gone || c.read);
    const f = v.filter;
    if (f.unread) list = list.filter(c => !c.read);
    if (f.downloaded) list = list.filter(c => (Downloads.get(c.key) || {}).state === 'complete');
    if (f.bookmarked) list = list.filter(c => c.bookmark);
    if (f.locked) list = list.filter(c => !c.locked && !c.external);
    if (f.q) { const q = f.q.toLowerCase(); list = list.filter(c => (c.label + ' ' + (c.title || '') + ' ' + (c.group || '')).toLowerCase().includes(q)); }
    if (f.dedupe) { const seen = new Set(); list = list.filter(c => { if (!c.num) return true; const k = (c.vol || '') + '|' + c.num; if (seen.has(k)) return false; seen.add(k); return true; }); }
    return v.sortDesc ? [...list].reverse() : list;
  };
  const resumeTarget = async () => {
    const order = v.chapters.filter(c => !c.gone && !c.locked);
    if (!order.length) return null;
    let best = null, bestAt = 0;
    for (const c of order) { const p = await Store.progress(c.key); if (p && !p.done && !c.read && p.at > bestAt) { best = c; bestAt = p.at; } }
    if (best) return { c: best, resume: true };
    let lastRead = -1; order.forEach((c, i) => { if (c.read) lastRead = i; });
    const next = order.slice(lastRead + 1).find(c => !c.read);
    if (next) return { c: next, resume: lastRead >= 0 };
    return { c: order[0], resume: false, again: true };
  };
  let drawSeq = 0;
  const draw = async () => {
    const seq = ++drawSeq;
    const list = visible();
    const rt = await resumeTarget();
    const rows = await chapterRows(list, v.sel);
    if (seq !== drawSeq) return; // a newer draw superseded this one
    const oldScroll = $('.scroll', v.el);
    const keepTop = oldScroll ? oldScroll.scrollTop : 0;
    const sel = v.sel.size;
    const tagHtml = (s.tags || []).slice(0, 30).map(t => html`<span class="tag">${t}</span>`);
    const head = sel ? html`<div class="selbar"><button class="iconbtn" data-act="clearsel" aria-label="Clear selection">${icon('close')}</button><b>${sel} selected</b>
        <button class="iconbtn" data-act="cselall" aria-label="Select all">${icon('selectAll')}</button>
        <button class="iconbtn" data-act="cread" aria-label="Mark read">${icon('doneAll')}</button>
        <button class="iconbtn" data-act="cunread" aria-label="Mark unread">${icon('refresh')}</button>
        <button class="iconbtn" data-act="cprev" aria-label="Mark previous as read">${icon('down')}</button>
        <button class="iconbtn" data-act="cdl" aria-label="Download">${icon('download')}</button>
        <button class="iconbtn" data-act="cbm" aria-label="Bookmark">${icon('bookmarkOff')}</button></div>`
      : topbar({ title: '', back: true, actions: html`<button class="iconbtn" data-act="refresh" aria-label="Refresh">${v.loading ? raw('<div class="spinner sm"></div>') : icon('refresh')}</button><button class="iconbtn" data-act="share" aria-label="Share">${icon('share')}</button><button class="iconbtn" data-act="menu" aria-label="More">${icon('more')}</button>` });
    v.el.innerHTML = String(html`${head}<div class="scroll">
      <div class="dhead">${s.source === 'local' ? html`<img class="cover" data-local="${s.key}" alt="">` : html`<img class="cover" src="${coverSrc(s)}" alt="" data-alt="${coverAlt(s)}" data-fallback="${(s.title || '?')[0]}">`}
        <div style="min-width:0"><h2>${s.title}</h2><div class="meta">
          ${s.author ? html`<span>${s.author}${s.artist && s.artist !== s.author ? ' · ' + s.artist : ''}</span>` : ''}
          <span>${statusLabel(s.status)} · ${src.name}</span>
          <span>${capBadge(src)}${s.rating && s.rating !== 'safe' ? html` <span class="tag">${s.rating}</span>` : ''}</span>
          ${s.lastFetchOk ? html`<span style="color:var(--text3);font-size:13px">Checked ${agoLabel(s.lastFetchOk)}</span>` : ''}</div></div></div>
      <div class="actions">
        <button class="act ${s.inLibrary ? 'on' : ''}" data-act="lib">${icon(s.inLibrary ? 'heart' : 'heartOff')}<span>${s.inLibrary ? 'In library' : 'Add to library'}</span></button>
        ${s.inLibrary ? html`<button class="act" data-act="cats">${icon('label')}<span>${(s.categories || []).length ? s.categories.slice(0, 2).join(', ') : 'Category'}</span></button>` : ''}
        ${s.url ? html`<button class="act" data-act="web">${icon('web')}<span>Website</span></button>` : ''}
        <button class="act" data-act="migrate" ${s.inLibrary ? '' : 'hidden'}>${icon('migrate')}<span>Migrate</span></button>
      </div>
      ${v.error ? html`<div class="notice err">${errorText(v.error)}<div class="btnrow" style="margin-top:10px">${v.error.kind === 'verification' ? html`<button class="btn" data-act="verify">Verify</button>` : ''}<button class="btn tonal" data-act="refresh">Retry</button>${s.url ? html`<button class="btn ghost" data-act="web">Open website</button>` : ''}<button class="btn ghost" data-act="diag">Copy diagnostic details</button></div></div>` : ''}
      ${s.desc ? html`<div class="desc ${v.descOpen ? '' : 'clamp'}" data-act="desc">${s.desc}</div>` : ''}
      ${tagHtml.length ? html`<div class="chips" style="padding:10px 16px">${tagHtml}</div>` : ''}
      ${s.alt && s.alt.length && v.descOpen ? html`<div class="pad" style="color:var(--text3);font-size:14px">Also known as: ${s.alt.join(' · ')}</div>` : ''}
      ${rt ? html`<div class="resume"><button class="btn" style="width:100%" data-act="resume">${icon('play')} ${rt.again ? 'Read again: ' : rt.resume ? 'Resume: ' : 'Start: '}${rt.c.label}</button></div>` : ''}
      ${s.allLocked ? html`<div class="notice warn">Every chapter of this series is locked or on an official paid site, so it cannot be read here. ${s.url ? 'You can still open it on the website.' : ''}</div>` : ''}
      <div class="chhead"><b>${v.loading && !v.chapters.length ? 'Loading chapters…' : plural(list.length, 'chapter')}${s.lockedCount && !s.allLocked ? html` <span style="color:var(--text3);font-weight:400;font-size:14px">· ${s.lockedCount} locked</span>` : ''}</b>
        <button class="iconbtn" data-act="csearch" aria-label="Search chapters">${icon('search')}</button>
        <button class="iconbtn ${v.filter.unread || v.filter.downloaded || v.filter.bookmarked || v.filter.dedupe || v.filter.locked ? 'on' : ''}" data-act="cfilter" aria-label="Filter chapters">${icon('filter')}</button>
        <button class="iconbtn" data-act="csort" aria-label="Reverse order">${icon('swap')}</button></div>
      ${v.searchOpen ? html`<div style="padding:0 16px 8px"><div class="searchbar"><input type="search" placeholder="Find chapter" value="${v.filter.q}" data-csq aria-label="Find chapter"></div></div>` : ''}
      <div class="chlist">${rows}</div>
      ${!v.loading && !v.chapters.length && !v.error ? html`<div class="notice warn">No chapters were found for this series. ${s.url ? 'You can still open it on the website.' : ''}</div>` : ''}
      <div style="height:40px"></div></div>`);
    const newScroll = $('.scroll', v.el);
    if (newScroll && keepTop) newScroll.scrollTop = keepTop;
    hydrateLocalCovers(v.el);
    const q = $('[data-csq]', v.el);
    if (q) { q.oninput = debounce(() => { v.filter.q = q.value; draw().then(() => { const i = $('[data-csq]', v.el); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }); }, 250); }
  };
  v.el.addEventListener('click', async e => {
    const t = e.target.closest('[data-act],[data-c],[data-dl]');
    if (!t) return;
    if (t.dataset.dl) { e.stopPropagation(); dlAction(t, t.dataset.dl); return; }
    if (t.dataset.c && !t.dataset.act) return; // handled by longPress tap
    const selected = () => v.chapters.filter(c => v.sel.has(c.key));
    switch (t.dataset.act) {
      case 'back': UI.pop(); break;
      case 'refresh': refresh(); break;
      case 'verify': verifyAndRetry(v.error, src, refresh); break;
      case 'desc': v.descOpen = !v.descOpen; draw(); break;
      case 'web': if (s.url) Browser.open(s.url); break;
      case 'share': Native.share(s.title + '\n' + (s.url || '')); break;
      case 'diag': copyDiagnostics(src, s, v.error); break;
      case 'lib':
        if (s.inLibrary) {
          if (s.dlCount) {
            const r = await UI.dialog({ title: 'Remove from library', body: 'Downloaded chapters can be kept or deleted.', buttons: [{ label: 'Cancel', value: null }, { label: 'Keep downloads', value: 'keep' }, { label: 'Delete downloads', value: 'delete', primary: true }] });
            if (!r) break;
            await Store.removeFromLibrary([s.key], { deleteDownloads: r === 'delete' });
          } else {
            await Store.removeFromLibrary([s.key]);
            UI.toast('Removed from library', { action: 'Undo', onAction: async () => { await Store.addToLibrary(s); draw(); } });
          }
        } else {
          let cats = [];
          if (Store.categories.length) { cats = await pickCategories([]); if (cats === null) break; }
          if (!Store.get(key)) Store.series.set(key, s);
          await Store.addToLibrary(s, cats);
          UI.toast('Added to library');
        }
        s = Store.get(key) || s; draw(); break;
      case 'cats': { const c = await pickCategories(s.categories); if (c) { s.categories = c; await Store.saveSeries(s); Store.emit('library'); draw(); } break; }
      case 'migrate': Migration.start(s); break;
      case 'menu': UI.menu(t, [
        { label: 'Reader settings for this series', action: () => readerSettingsSheet(s) },
        { label: 'Download all unread', action: async () => { const n = await Downloads.enqueue(s.key, v.chapters.filter(c => !c.read && !c.gone)); UI.toast(n ? `Queued ${plural(n, 'chapter')}` : 'Nothing to download'); } },
        { label: 'Mark all as read', action: async () => { const ch = v.chapters.filter(c => !c.read); await Store.setRead(ch, true); v.chapters = await Store.chapters(key); draw(); UI.toast('Marked all read', { action: 'Undo', onAction: async () => { await Store.setRead(ch, false); v.chapters = await Store.chapters(key); draw(); } }); } },
        { label: 'Delete all downloads', hidden: !s.dlCount, action: async () => { if (await UI.confirm('Delete downloads', 'Deletes downloaded pages for this series. Read progress stays.', 'Delete')) { await Downloads.deleteSeries(s.key); draw(); } } },
        { label: 'Copy link', hidden: !s.url, action: () => { navigator.clipboard && navigator.clipboard.writeText(s.url); UI.toast('Link copied'); } },
      ]); break;
      case 'resume': { const r = await resumeTarget(); if (r) Reader.openChapter(s, r.c); break; }
      case 'csort': v.sortDesc = !v.sortDesc; Prefs.set('chapterSortDesc', v.sortDesc); draw(); break;
      case 'csearch': v.searchOpen = !v.searchOpen; if (!v.searchOpen) v.filter.q = ''; draw().then(() => { const i = $('[data-csq]', v.el); if (i) i.focus(); }); break;
      case 'cfilter': chapterFilterSheet(v.filter, draw); break;
      case 'clearsel': v.sel.clear(); draw(); break;
      case 'cselall': visible().forEach(c => v.sel.add(c.key)); draw(); break;
      case 'cread': case 'cunread': {
        const ch = selected(); await Store.setRead(ch, t.dataset.act === 'cread'); v.sel.clear(); v.chapters = await Store.chapters(key); draw();
        UI.toast(`Marked ${plural(ch.length, 'chapter')} ${t.dataset.act === 'cread' ? 'read' : 'unread'}`, { action: 'Undo', onAction: async () => { await DB.putMany('chapters', ch); await Store.recount(s); v.chapters = await Store.chapters(key); draw(); } });
        break;
      }
      case 'cprev': {
        const ch = selected(); const maxIdx = Math.max(...ch.map(c => c.sortIdx));
        const prev = v.chapters.filter(c => c.sortIdx < maxIdx && !c.read);
        await Store.setRead(prev, true); v.sel.clear(); v.chapters = await Store.chapters(key); draw();
        UI.toast(`Marked ${plural(prev.length, 'earlier chapter')} read`, { action: 'Undo', onAction: async () => { await Store.setRead(prev, false); v.chapters = await Store.chapters(key); draw(); } });
        break;
      }
      case 'cdl': { const n = await Downloads.enqueue(s.key, selected()); v.sel.clear(); draw(); UI.toast(n ? `Queued ${plural(n, 'chapter')}` : 'Nothing to download'); break; }
      case 'cbm': { const ch = selected(); const on = !ch.every(c => c.bookmark); for (const c of ch) await Store.setBookmark(c, on); v.sel.clear(); v.chapters = await Store.chapters(key); draw(); break; }
    }
  });
  UI.longPress(v.el, '[data-c]', t => { if (v.sel.has(t.dataset.c)) v.sel.delete(t.dataset.c); else v.sel.add(t.dataset.c); draw(); }, t => {
    if (v.sel.size) { if (v.sel.has(t.dataset.c)) v.sel.delete(t.dataset.c); else v.sel.add(t.dataset.c); draw(); return; }
    const c = v.chapters.find(x => x.key === t.dataset.c);
    if (!c) return;
    if (c.locked || c.external) {
      UI.dialog({ title: 'Read on the source website', body: esc(ERROR_COPY.locked + ' This chapter is locked, premium, or hosted on an official site, so Otaku Vault does not open it.'), buttons: [{ label: 'Cancel', value: false }, { label: 'Open website', value: true, primary: true }] })
        .then(ok => { if (ok) Browser.open(c.extUrl || c.url || s.url); });
      return;
    }
    Reader.openChapter(s, c);
  });
  v.onBack = () => { if (v.sel.size) { v.sel.clear(); draw(); return true; } return false; };
  v.onShow = async () => { s = Store.get(key) || s; v.chapters = await Store.chapters(key); draw(); };
  const unsub = Store.on(w => { if ((w === 'downloads' || w === 'library') && !v.el.hidden && v.el.isConnected) { s = Store.get(key) || s; draw(); } });
  v.onPop = unsub;
  UI.push(v);
  load();
}

async function chapterRows(list, sel) {
  if (!list.length) return '';
  const progress = new Map();
  const recent = list.slice(0, 400);
  await Promise.all(recent.map(async c => { if (!c.read) { const p = await Store.progress(c.key); if (p && p.page > 0) progress.set(c.key, p); } }));
  return raw(list.map(c => {
    const p = progress.get(c.key);
    const meta = [c.date ? dateShort(c.date) : '', c.group || '', c.lang && c.lang !== 'en' ? c.lang.toUpperCase() : ''].filter(Boolean).join(' · ');
    return html`<div class="row ${c.read ? 'read' : ''} ${sel.has(c.key) ? 'sel' : ''}" data-c="${c.key}" role="button" tabindex="0" aria-label="${c.label}${c.read ? ', read' : ''}">
      <div class="body"><div class="t">${c.bookmark ? html`<span style="color:var(--accent)">● </span>` : ''}${c.locked ? '🔒 ' : ''}${c.label}${c.title ? ' - ' + c.title : ''}</div>
      <div class="s">${meta}${p ? html`<span style="color:var(--accent)">${meta ? '· ' : ''}Page ${p.page + 1}${p.pages ? ' of ' + p.pages : ''}</span>` : ''}${c.gone ? html`<span style="color:var(--warn)"> · removed from source</span>` : ''}${c.external ? html`<span style="color:var(--warn)"> · official site</span>` : ''}</div></div>
      ${dlButton(c, Downloads.get(c.key))}</div>`;
  }).join(''));
}

function chapterFilterSheet(f, redraw) {
  const node = el('<div class="sb"></div>');
  const draw = () => {
    const chk = (k, label) => html`<button class="check" role="checkbox" aria-checked="${!!f[k]}" data-k="${k}"><span class="box"></span>${label}</button>`;
    node.innerHTML = String(html`<h4>Show only</h4>${chk('unread', 'Unread')}${chk('downloaded', 'Downloaded')}${chk('bookmarked', 'Bookmarked')}
      <h4>Locked chapters</h4>${chk('locked', 'Hide locked, premium and official-site chapters')}
      <h4>Duplicate releases</h4>${chk('dedupe', 'Show one release per chapter number')}
      <p style="color:var(--text2);font-size:14px">Different translations or groups of the same chapter are kept as separate releases. This option only hides extra releases in the list; nothing is merged or deleted.</p>`);
  };
  node.onclick = e => { const t = e.target.closest('[data-k]'); if (!t) return; f[t.dataset.k] = !f[t.dataset.k]; if (t.dataset.k === 'locked') Prefs.set('hideLockedChapters', f.locked); if (t.dataset.k === 'dedupe') Prefs.set('dedupeReleases', f.dedupe ? 'prefer-first' : 'all'); draw(); redraw(); };
  draw();
  UI.sheet(node, { label: 'Chapter filters' });
}

function websiteSeriesSheet(s) {
  const node = el(html`<div class="sb"><h4>${s.title}</h4><p style="color:var(--text2)">${ERROR_COPY.unsupported} This entry is a website bookmark; automatic chapter progress and updates are not available.</p>
    <dl class="kv"><dt>Site</dt><dd>${(s.url ? new URL(s.url).hostname : s.source.replace('web:', ''))}</dd><dt>Address</dt><dd>${redact(s.url || '')}</dd></dl>
    <div class="btnrow" style="margin-top:16px"><button class="btn" data-open>${icon('open')} Open website</button>
    ${s.inLibrary ? html`<button class="btn tonal" data-rm>Remove bookmark</button>` : html`<button class="btn tonal" data-add>Save bookmark</button>`}
    <button class="btn ghost" data-try>Try clean reader on a chapter</button></div></div>`);
  const o = UI.sheet(node, { label: s.title });
  $('[data-open]', node).onclick = () => { o.close(); Browser.open(s.url, s.key); };
  const rm = $('[data-rm]', node), add = $('[data-add]', node);
  if (rm) rm.onclick = async () => { o.close(); await Store.removeFromLibrary([s.key]); UI.toast('Bookmark removed'); };
  if (add) add.onclick = async () => { o.close(); if (!Store.get(s.key)) Store.series.set(s.key, s); await Store.addToLibrary(s, []); UI.toast('Bookmark saved'); };
  $('[data-try]', node).onclick = async () => { o.close(); const u = await UI.prompt('Try clean reader', 'Chapter address from this site', s.url, 'Analyze'); if (u) AddLink.open(u); };
}

function copyDiagnostics(src, s, err) {
  const lines = [
    'Otaku Vault ' + APP_VERSION + (NATIVE ? ' (Android)' : WEB ? ' (web)' : ' (browser)'),
    'Source: ' + (src ? src.id + ' (' + src.cap + ')' : '?'),
    'Series: ' + (s ? s.id : '?'),
    'Address: ' + redact(s && s.url || ''),
    'Error: ' + (err ? (err.kind || '') + ' ' + redact(err.message || '') + (err.status ? ' HTTP ' + err.status : '') : 'none'),
    'Health: ' + JSON.stringify(src ? Health.data[src.id] || {} : {}),
    'When: ' + new Date().toISOString(),
  ];
  const text = lines.join('\n');
  UI.dialog({ title: 'Diagnostic details', body: html`<p>Review before sharing. Tokens and signed links are removed.</p><pre style="white-space:pre-wrap;font-size:12px;background:#000;padding:10px;border-radius:8px">${text}</pre>`, buttons: [{ label: 'Close', value: false }, { label: 'Copy', value: true, primary: true }] })
    .then(ok => { if (ok) { navigator.clipboard && navigator.clipboard.writeText(text); UI.toast('Copied'); } });
}

/* ==========================================================================
   Otaku Vault — add link, migration, More tab and settings
   ========================================================================== */

// ======================================================================== Add link
const AddLink = {
  open(initial = '') {
    const node = el(html`<div class="sb">
      <h4>Add a link</h4>
      <form data-form novalidate style="display:flex;gap:8px"><input class="field" type="text" inputmode="url" placeholder="Paste a series, chapter or website link" value="${initial}" aria-label="Link" data-autofocus autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn" data-go>Analyze</button></form>
      <div class="out"></div></div>`);
    const out = $('.out', node);
    let ctl = null;
    const o = UI.sheet(node, { label: 'Add link', onClose: () => ctl && ctl.abort() });
    $('[data-form]', node).onsubmit = e => {
      e.preventDefault();
      if (ctl) ctl.abort();
      ctl = new AbortController();
      this.analyze($('input', node).value, out, o, ctl.signal);
    };
    if (initial && /^https?:|\./.test(initial)) setTimeout(() => $('[data-form]', node).requestSubmit(), 50);
  },

  stages(out, names) {
    out.innerHTML = String(html`<div class="stages">${names.map((n, i) => html`<div class="stage" data-st="${i}"><span class="ic">○</span>${n}</div>`)}</div><div class="prev"></div>
      <div class="btnrow" style="margin-top:10px"><button class="btn ghost" data-cancel>Cancel</button></div>`);
    return {
      set(i, state) {
        const s = $(`[data-st="${i}"]`, out); if (!s) return;
        s.className = 'stage ' + state;
        $('.ic', s).innerHTML = state === 'on' ? '<div class="spinner sm"></div>' : state === 'done' ? '✓' : state === 'fail' ? '✕' : '○';
      },
      finish() { const c = $('[data-cancel]', out); if (c) c.remove(); },
    };
  },

  async analyze(input, out, o, signal) {
    let u;
    try { u = normalizeInputUrl(input); } catch (e) { out.innerHTML = String(html`<div class="notice err">${e.message}</div>`); return; }
    const st = this.stages(out, ['Identifying source', 'Loading details', 'Checking chapters']);
    const cancel = $('[data-cancel]', out);
    cancel.onclick = () => { o.close(); };
    const prev = $('.prev', out);
    const fail = (i, e, extra = '') => {
      st.set(i, 'fail'); st.finish();
      prev.innerHTML = String(html`<div class="notice err">${errorText(e)}${e && e.kind === 'verification' ? html`<div class="btnrow" style="margin-top:8px"><button class="btn" data-verify>Verify</button></div>` : ''}</div>${raw(extra)}`);
      const vb = $('[data-verify]', prev);
      if (vb) vb.onclick = () => verifyAndRetry(e, src, () => this.analyze(input, out, o, signal));
    };
    st.set(0, 'on');
    const src = Sources.forHost(u.hostname);
    await sleep(60);
    if (signal.aborted) return;

    // ---------- known site with clean reader
    if (src && src.cap === 'integrated') {
      st.set(0, 'done');
      let cls;
      try { cls = src.classify(u); } catch { cls = { type: 'home' }; }
      if (cls.type === 'home') {
        st.set(1, 'done'); st.set(2, 'done'); st.finish();
        prev.innerHTML = String(html`<div class="preview">${sourceIcon(src, 64)}<div><b>${src.name}</b><div style="color:var(--text2);margin-top:4px">This is the ${src.name} website, not a series or chapter page.</div><div style="margin-top:6px">${capBadge(src)}</div></div></div>
          <div class="btnrow" style="margin-top:14px"><button class="btn" data-browse>Browse ${src.name}</button><button class="btn tonal" data-search>Search ${src.name}</button></div>`);
        $('[data-browse]', prev).onclick = () => { o.close(); openSource(src, 'popular'); };
        $('[data-search]', prev).onclick = async () => { const q = await UI.prompt('Search ' + src.name, 'Title', '', 'Search'); if (q) { o.close(); openSource(src, 'search', q); } };
        return;
      }
      st.set(1, 'on');
      let seriesId = cls.type === 'series' ? cls.id : cls.seriesId;
      try {
        if (!seriesId && cls.type === 'chapter' && src.chapterParent) seriesId = await srcCall(src, 'chapterParent', cls.chapterId);
      } catch (e) { return fail(1, e, this.fallbackButtons(u, src)); }
      if (signal.aborted) return;
      if (!seriesId) return fail(1, new SourceError('layout', '(Could not find the series this chapter belongs to.)'), this.fallbackButtons(u, src));
      const key = Store.key(src.id, seriesId);
      const existed = Store.get(key);
      const s = existed || { key, source: src.id, id: seriesId, title: '', inLibrary: 0, categories: [], prefs: {}, unread: 0, dlCount: 0, chapterCount: 0, baseline: false };
      if (!existed) Store.series.set(key, s);
      try { await Store.refreshSeries(s); } catch (e) { if (!existed) Store.series.delete(key); return fail(1, e, this.fallbackButtons(u, src)); }
      if (signal.aborted) return;
      st.set(1, 'done'); st.set(2, 'on');
      const chapters = await Store.chapters(key);
      const target = cls.type === 'chapter' ? chapters.find(c => c.id === cls.chapterId) : null;
      st.set(2, chapters.length ? 'done' : 'fail'); st.finish();
      const inLib = s.inLibrary;
      prev.innerHTML = String(html`<div class="preview">${s.source === 'local' ? '' : html`<img src="${coverSrc(s)}" alt="" data-fallback="${(s.title || '?')[0]}">`}<div style="min-width:0">
          <b style="font-size:18px">${s.title}</b>
          <div style="color:var(--text2);margin-top:4px;font-size:14px">${src.name} · ${u.hostname}</div>
          <div style="color:var(--text2);font-size:14px">${statusLabel(s.status)} · ${plural(chapters.length, 'chapter')}</div>
          ${target ? html`<div style="margin-top:6px">Chapter: <b>${target.label}</b>${target.locked ? ' (locked)' : ''}</div>` : ''}
          <div style="margin-top:6px">${capBadge(src)} ${inLib ? html`<span class="cap local">Already in library</span>` : ''}</div></div></div>
        ${cls.type === 'chapter' && !target ? html`<div class="notice warn">The series was found, but this exact chapter is not in its chapter list (it may be in another language or removed).</div>` : ''}
        ${!chapters.length ? html`<div class="notice warn">No chapters could be read for this series.</div>` : ''}
        <div class="btnrow" style="margin-top:14px">
          ${target && !target.locked ? html`<button class="btn" data-readch>${icon('play')} Read this chapter</button>` : ''}
          ${!inLib ? html`<button class="btn ${target ? 'tonal' : ''}" data-add>${icon('heart')} Add to library</button>` : html`<button class="btn tonal" data-open>Open in library</button>`}
          ${!target && chapters.length ? html`<button class="btn tonal" data-read>${icon('play')} Read</button>` : ''}
          <button class="btn ghost" data-details>Details</button></div>`);
      const go = fn => async () => { o.close(); await fn(); };
      const btn = (sel, fn) => { const b = $(sel, prev); if (b) b.onclick = go(fn); };
      btn('[data-readch]', () => Reader.openChapter(s, target));
      btn('[data-add]', async () => { let cats = []; if (Store.categories.length) { cats = await pickCategories([]); if (cats === null) return; } await Store.addToLibrary(s, cats); UI.toast('Added ' + s.title); });
      btn('[data-open]', () => openDetails(s));
      btn('[data-details]', () => openDetails(s));
      btn('[data-read]', async () => { const ch = (await Store.chapters(key)).filter(c => !c.locked && !c.gone); const first = ch.find(c => !c.read) || ch[0]; if (first) Reader.openChapter(s, first); });
      return;
    }

    // ---------- known website-only source
    if (src && src.website) {
      st.set(0, 'done'); st.set(1, 'done'); st.set(2, 'done'); st.finish();
      prev.innerHTML = String(html`<div class="preview">${sourceIcon(src, 64)}<div><b>${src.name}</b><div style="margin-top:4px">${capBadge(src)}</div><p style="color:var(--text2);font-size:14px">${src.note}</p></div></div>${raw(this.fallbackButtons(u, null, true))}`);
      this.wireFallback(prev, u, o, src);
      return;
    }

    // ---------- unknown website: bookmark, or bounded experimental extraction
    st.set(0, 'done'); st.set(1, 'on');
    let doc = null, err = null;
    try { doc = await Net.doc(u.href, { timeout: 20000, signal }); } catch (e) { err = e; }
    if (signal.aborted) return;
    const meta = n => doc && (doc.querySelector(`meta[property="${n}"]`) || doc.querySelector(`meta[name="${n}"]`));
    const title = doc ? ((meta('og:title') && meta('og:title').content) || txt(doc.querySelector('title')) || u.hostname) : u.hostname;
    const cover = doc && meta('og:image') ? absUrl(meta('og:image').content, u.href) : '';
    st.set(1, err ? 'fail' : 'done'); st.set(2, 'on');
    let analysis = null;
    if (doc) analysis = Extract.analyze(doc, doc.__url || u.href);
    st.set(2, 'done'); st.finish();
    const sel = analysis ? analysis.candidates.filter(c => c.selected) : [];
    const canTry = sel.length >= 2;
    prev.innerHTML = String(html`<div class="preview">${cover ? html`<img src="${Net.img(cover, u.origin + '/')}" alt="" data-fallback="?">` : ''}<div style="min-width:0"><b>${title.slice(0, 140)}</b><div style="color:var(--text2);font-size:14px;margin-top:4px">${u.hostname}</div>
        <div style="margin-top:6px"><span class="cap website">Unsupported site</span></div></div></div>
      <div class="notice">${ERROR_COPY.unsupported}${err ? ' (' + errorText(err) + ')' : ''}${canTry ? html` A chapter-like set of ${sel.length} images was found, so you can try <b>experimental extraction</b> on this page and review it before reading.` : ''}</div>
      ${raw(this.fallbackButtons(u, null, true, canTry))}`);
    this.wireFallback(prev, u, o, null, { title, cover, doc, analysis });
  },

  fallbackButtons(u, src, primary = false, canTry = false) {
    return String(html`<div class="btnrow" style="margin-top:12px">
      <button class="btn${primary ? '' : ' tonal'}" data-bm>${icon('bookmark')} Save website bookmark</button>
      <button class="btn tonal" data-web>${icon('open')} Open website</button>
      ${canTry ? html`<button class="btn tonal" data-try>Try experimental extraction</button>` : ''}
      <button class="textbtn" data-diag>Copy diagnostic details</button></div>`);
  },

  wireFallback(prev, u, o, src, extra = {}) {

      const id = (u.pathname + u.search).slice(0, 300) || '/';

      s.title = (extra.title || (src && src.name) || u.hostname).slice(0, 200);

};

        ${pick.length ? html`<h4>First · middle · last</h4><div class="thumbs">${pick.map(c => html`<label><img src="${Net.img(c.src, u.href)}" alt="" loading="lazy"><span>#${on.indexOf(c) + 1}</span></label>`)}</div>` : ''}
        <h4>All candidates, in page order</h4>

        const old = await DB.get('chapters', ch.key);

// ======================================================================== migration
const Migration = {
  async start(s) {
    const targets = Sources.visible().filter(x => x.cap === 'integrated' && x.id !== s.source && !Prefs.data.disabledSources.includes(x.id));
    const node = el(html`<div class="sb"><h4>Migrate “${s.title}”</h4>
      <p style="color:var(--text2);font-size:14px">Search every source at once, or pick one. Tap the version you want; you review the match and chapter mapping before anything changes.</p>
      <div class="chips mig-chips"><button class="chip" data-t="*">All sources</button>${targets.map(t => html`<button class="chip" data-t="${t.id}">${t.name}</button>`)}</div>
      <form data-form style="display:flex;gap:8px;margin-top:14px"><input class="field" value="${s.title}" aria-label="Search title"><button class="btn">Search</button></form>
      <div class="res"></div></div>`);
    let target = '*';
    let gen = 0;
    const mark = () => $$('[data-t]', node).forEach(b => b.classList.toggle('sel', b.dataset.t === (target === '*' ? '*' : target.id)));
    mark();
    const o = UI.sheet(node, { label: 'Migrate', onClose: () => { gen++; } });
    const tiles = (src, items) => html`${items.slice(0, 12).map(it => html`<button class="card" data-src="${src.id}" data-pick="${it.id}" style="width:110px;flex:none"><div class="cv">${coverImg({ ...it, source: src.id })}<div class="ttl"><div class="clamp2">${it.title}</div></div></div></button>`)}`;
    const searchOne = async query => {
      const g = ++gen, res = $('.res', node);
      res.innerHTML = '<div class="spinner"></div>';
      try {
        const r = await srcCall(target, 'search', query, 1);
        if (g !== gen) return;
        res._items = { [target.id]: r.items };
        res.innerHTML = r.items.length ? String(html`<div class="thumbs" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">${tiles(target, r.items.slice(0, 18))}</div>`) : '<p>No matches. Try a different title.</p>';
        $$('.card', res).forEach(c => { c.style.width = ''; });
      } catch (e) { if (g === gen) res.innerHTML = String(html`<div class="notice err">${errorText(e)}</div>`); }
    };
    const searchAll = async query => {
      const g = ++gen, res = $('.res', node);
      res._items = {};
      res.innerHTML = String(html`<div class="mig-status" style="color:var(--text2);font-size:13px;margin:12px 0 4px"></div>
        <div class="mig-found"></div>
        <div class="mig-wait">${targets.map(t => html`<div data-sec="${t.id}" hidden></div>`)}</div>
        <div class="mig-none" style="color:var(--text3);font-size:13px;margin-top:12px"></div>`);
      const status = $('.mig-status', res), found = $('.mig-found', res), none = $('.mig-none', res);
      const noHits = [], failed = [];
      let done = 0;
      const upd = () => {
        const n = Object.keys(res._items).length;
        status.textContent = done < targets.length ? `Searching ${done} of ${targets.length} sources… ${n} with matches so far` : `${n} of ${targets.length} sources have matches`;
        none.textContent = [noHits.length ? 'No matches on: ' + noHits.join(', ') + '.' : '', failed.length ? 'Could not search: ' + failed.join(', ') + '.' : ''].filter(Boolean).join(' ');
      };
      upd();
      const queue = [...targets];
      const worker = async () => {
        while (queue.length) {
          const src = queue.shift();
          try {
            const r = await Promise.race([srcCall(src, 'search', query, 1), sleep(25000).then(() => { throw new SourceError('offline', '(Timed out.)'); })]);
            if (g !== gen) return;
            if (r.items.length) {
              res._items[src.id] = r.items;
              found.insertAdjacentHTML('beforeend', String(html`<div data-sec="${src.id}"><div class="group" style="padding:14px 0 6px">${src.name}</div><div class="hs" style="display:flex;gap:10px;overflow-x:auto;padding-bottom:6px">${tiles(src, r.items)}</div></div>`));
            } else noHits.push(src.name);
          } catch (e) { if (g !== gen) return; failed.push(src.name); }
          done++; upd();
        }
      };
      await Promise.all(Array.from({ length: 6 }, worker));
      if (g === gen && !Object.keys(res._items).length) found.innerHTML = '<p>No matches anywhere. Try a shorter or different title (for example the English or Korean name).</p>';
    };
    const search = () => { const q = $('input', node).value.trim(); if (!q) return; return target === '*' ? searchAll(q) : searchOne(q); };
    node.addEventListener('click', e => {
      const t = e.target.closest('[data-t],[data-pick]'); if (!t) return;
      if (t.dataset.t) { target = t.dataset.t === '*' ? '*' : Sources.get(t.dataset.t); mark(); search(); }
      if (t.dataset.pick) {
        const src = Sources.get(t.dataset.src);
        const it = (($('.res', node)._items || {})[t.dataset.src] || []).find(i => i.id === t.dataset.pick);
        if (!src || !it) return;
        gen++; o.close(); this.review(s, src, it);
      }
    });
    $('[data-form]', node).onsubmit = e => { e.preventDefault(); search(); };
    if (targets.length) search();
  },

  async review(s, target, it) {
    const close = UI.toast('Loading ' + it.title + ' from ' + target.name + '…', { ms: 60000 });
    const key = Store.key(target.id, it.id);
    const existed = Store.get(key);
    const ns = existed || { key, source: target.id, id: it.id, title: it.title, cover: it.cover, inLibrary: 0, categories: [], prefs: {}, unread: 0, dlCount: 0, chapterCount: 0, baseline: false };
    if (!existed) Store.series.set(key, ns);
    try { await Store.refreshSeries(ns); } catch (e) { close(); if (!existed) Store.series.delete(key); UI.dialog({ title: 'Could not load the match', body: esc(errorText(e)) }); return; }
    close();
    const oldCh = await Store.chapters(s.key), newCh = await Store.chapters(key);
    const norm = c => c.num ? (c.vol && /vol/i.test(c.label) ? '' : '') + c.num.replace(/^0+(?=\d)/, '') : '';
    const byNum = new Map();
    newCh.forEach(c => { const k = norm(c); if (!k) return; (byNum.get(k) || byNum.set(k, []).get(k)).push(c); });
    const mapped = [], ambiguous = [], missing = [];
    oldCh.filter(c => c.read).forEach(c => {
      const k = norm(c);
      const m = k ? byNum.get(k) : null;
      if (!m) missing.push(c); else if (m.length > 1 && new Set(m.map(x => x.lang)).size > 1) ambiguous.push(c); else mapped.push([c, m[0]]);
    });
    const node = el(html`<div><div style="display:flex;gap:14px;align-items:center">
        <div style="flex:1;text-align:center">${coverImg(s, 'cov')}<div style="font-size:13px;margin-top:4px">${(Sources.get(s.source) || {}).name}<br>${plural(oldCh.length, 'chapter')}</div></div>
        <div>${icon('migrate')}</div>
        <div style="flex:1;text-align:center">${coverImg(ns, 'cov')}<div style="font-size:13px;margin-top:4px">${target.name}<br>${plural(newCh.length, 'chapter')}</div></div></div>
      <p><b>${ns.title}</b></p>
      <dl class="kv"><dt>Read state to copy</dt><dd>${plural(mapped.length, 'chapter')} with an exact chapter-number match</dd>
        <dt>Not copied</dt><dd>${ambiguous.length} ambiguous (several languages), ${missing.length} with no matching number</dd></dl>
      <button class="check" role="checkbox" aria-checked="true" data-o="cats"><span class="box"></span>Copy categories</button>
      <button class="check" role="checkbox" aria-checked="true" data-o="read"><span class="box"></span>Copy read state for matched chapters</button>
      <button class="check" role="checkbox" aria-checked="true" data-o="remove"><span class="box"></span>Remove the old entry from the library (it is kept for undo)</button>
      ${mapped.length ? html`<details style="margin-top:8px"><summary>Show chapter mapping</summary><div style="max-height:200px;overflow:auto;font-size:13px">${mapped.slice(0, 400).map(([a, b]) => html`<div>${a.label} → ${b.label}${b.group ? ' (' + b.group + ')' : ''}</div>`)}</div></details>` : ''}</div>`);
    node.addEventListener('click', e => { const t = e.target.closest('[data-o]'); if (t) t.setAttribute('aria-checked', t.getAttribute('aria-checked') !== 'true'); });
    const ok = await UI.dialog({ title: 'Review migration', node, buttons: [{ label: 'Cancel', value: false }, { label: 'Migrate', value: true, primary: true }] });
    hydrateLocalCovers(node);
    if (!ok) { if (!existed) Store.series.delete(key); return; }
    const opt = k => $(`[data-o="${k}"]`, node).getAttribute('aria-checked') === 'true';
    const wasInLib = ns.inLibrary;
    try {
      await Store.addToLibrary(ns, opt('cats') ? [...(s.categories || [])] : ns.categories);
      const toRead = opt('read') ? mapped.map(([, b]) => b).filter(b => !b.read) : [];
      if (toRead.length) await Store.setRead(toRead, true);
      if (opt('remove')) await Store.removeFromLibrary([s.key]);
      if (needsSource(s)) { s.moveStatus = 'moved'; s.movedTo = key; await Store.saveSeries(s); }
      const record = { from: s.key, to: key, readKeys: toRead.map(c => c.key), removed: opt('remove'), wasInLib, at: Date.now() };
      await DB.setMeta('lastMigration', record);
      UI.toast('Migrated to ' + target.name, { action: 'Undo', ms: 8000, onAction: () => Migration.rollback(record) });
      if (UI.stack.length) UI.pop();
      openDetails(ns);
    } catch (e) {
      UI.dialog({ title: 'Migration failed', body: esc(errorText(e) + ' The original entry was not changed.') });
    }
  },

  async rollback(r) {
    const chs = (await Promise.all(r.readKeys.map(k => DB.get('chapters', k)))).filter(Boolean);
    await Store.setRead(chs, false);
    const to = Store.get(r.to);
    if (to && !r.wasInLib) await Store.removeFromLibrary([r.to]);
    const from = Store.get(r.from);
    if (from && r.removed) await Store.addToLibrary(from);
    await DB.setMeta('lastMigration', null);
    UI.toast('Migration undone');
  },
};

function subScreen(title) {
  const v = { el: screen('sub') };
  v.el.innerHTML = String(html`${topbar({ title, back: true })}<div class="scroll"><div class="sbody"></div></div>`);
  v.el.addEventListener('click', e => { if (e.target.closest('[data-act="back"]')) UI.pop(); });
  v.body = $('.sbody', v.el);
  return v;
}

function openDownloads() {
  const v = subScreen('Download queue');
  const draw = () => {
    const list = [...Downloads.status.values()].sort((a, b) => a.at - b.at);
    const groups = [['running', 'Downloading'], ['queued', 'Queued'], ['waiting', 'Waiting for Wi-Fi'], ['failed', 'Failed'], ['complete', 'Downloaded']];
    const row = d => { const s = Store.get(d.seriesKey); return html`<div class="row"><div class="body"><div class="t">${s ? s.title : '?'}</div><div class="s">${d.label}${d.total ? ` · ${d.done}/${d.total} pages` : ''}${d.bytes ? ' · ' + (d.bytes / 1048576).toFixed(1) + ' MB' : ''}</div>${d.state === 'failed' ? html`<div class="s" style="color:var(--danger)">${d.error}</div>` : ''}</div>
      ${d.state === 'failed' ? html`<button class="iconbtn" data-retry="${d.chapterKey}" aria-label="Retry">${icon('refresh')}</button>` : ''}
      <button class="iconbtn" data-x="${d.chapterKey}" aria-label="${d.state === 'complete' ? 'Delete download' : 'Cancel'}">${icon(d.state === 'complete' ? 'delete' : 'close')}</button></div>`; };
    const pending = list.some(d => ['queued', 'running', 'waiting'].includes(d.state));
    v.body.innerHTML = String(html`<div class="pad" style="padding-top:8px"><div class="btnrow">${pending ? html`<button class="btn tonal" data-pause>${icon(Downloads.paused ? 'play' : 'pause')} ${Downloads.paused ? 'Resume' : 'Pause'}</button>` : ''}${list.some(d => d.state === 'failed') ? html`<button class="btn ghost" data-retryall>Retry failed</button>` : ''}</div></div>
      ${list.length ? groups.map(([st, l]) => { const g = list.filter(d => d.state === st); return g.length ? html`<div class="group">${l} (${g.length})</div>${g.map(row)}` : ''; }) : html`<div class="empty"><b>No downloads</b><span>Download chapters from a series page to read them offline.</span></div>`}`);
  };
  v.el.addEventListener('click', async e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.pause != null) await Downloads.pause(!Downloads.paused);
    if (t.dataset.x) { const d = Downloads.get(t.dataset.x); if (d.state === 'complete') { if (await UI.confirm('Delete download', 'Delete the downloaded pages for ' + d.label + '? Read progress stays.', 'Delete')) await Downloads.remove(t.dataset.x); } else await Downloads.cancel(t.dataset.x); }
    if (t.dataset.retry) { const c = await DB.get('chapters', t.dataset.retry); await Downloads.remove(t.dataset.retry); if (c) await Downloads.enqueue(c.series, [c]); }
    if (t.dataset.retryall != null) for (const d of [...Downloads.status.values()].filter(x => x.state === 'failed')) { const c = await DB.get('chapters', d.chapterKey); await Downloads.remove(d.chapterKey); if (c) await Downloads.enqueue(c.series, [c]); }
    draw();
  });
  const unsub = Store.on(w => { if (w === 'downloads' && v.el.isConnected) draw(); });
  v.onPop = unsub;
  draw(); UI.push(v);
}

function openCategories() {
  const v = subScreen('Categories');
  const draw = () => {

/** Restore from a backup file: validate, preview, merge or replace, then fetch chapter lists. */
async function restoreFlow() {
  const f = await Native.openFile('*/*');
  if (!f) return false;
  const head = new Uint8Array(await f.blob.slice(0, 2).arrayBuffer());
  if (Tachi.isTachi(f.name, head)) { await importTachiFlow(f); return true; }
  let j;
  try {
    if (f.blob.size > 50e6) throw new Error('big');
    j = JSON.parse(await f.blob.text());
  } catch { UI.dialog({ title: 'Restore failed', body: 'That file could not be read as an Otaku Vault backup. Nothing was changed.' }); return false; }
  const val = Backup.validate(j);
  if (!val.ok) { UI.dialog({ title: 'Restore failed', body: esc(val.errs.join(' ') + ' Nothing was changed.') }); return false; }
  const already = val.series.filter(s => Store.get(Store.key(s.source, s.id)) && Store.get(Store.key(s.source, s.id)).inLibrary).length;
  const unknown = val.series.filter(s => !Sources.get(s.source)).length;
  const empty = !Store.library().length;
  const mode = await UI.dialog({ title: 'Restore backup', body: html`<dl class="kv">${val.created ? html`<dt>Backup from</dt><dd>${new Date(val.created).toLocaleString()}</dd>` : ''}<dt>Series</dt><dd>${val.series.length}${val.skipped ? ' (' + val.skipped + ' invalid entries skipped)' : ''}</dd><dt>Already here</dt><dd>${already}</dd><dt>Read chapters</dt><dd>${val.chapters.filter(c => c.read).length}</dd><dt>Saved positions</dt><dd>${val.progress.length}</dd>${unknown ? html`<dt>Unknown sources</dt><dd>${unknown} (kept so you can migrate them later)</dd>` : ''}</dl>
    ${val.localSkipped ? html`<p>${plural(val.localSkipped, 'imported archive')} could not be included in the backup; import those files again.</p>` : ''}
    ${empty ? html`<p>Your library is empty, so everything is simply added.</p>` : html`<p><b>Merge</b> adds to your library and keeps everything you have. <b>Replace</b> takes your current series out of the library first (their data is kept). A safety backup is made either way.</p>`}`,
    buttons: empty ? [{ label: 'Cancel', value: null }, { label: 'Restore', value: 'merge', primary: true }] : [{ label: 'Cancel', value: null }, { label: 'Replace', value: 'replace' }, { label: 'Merge', value: 'merge', primary: true }] });
  if (!mode) return false;
  const close = UI.toast('Restoring…', { ms: 60000 });
  try {
    await Backup.restore(val, mode);
    close();
    LibraryView.render();
    const keys = val.series.map(s => Store.key(s.source, s.id)).filter(k => Store.get(k));
    UI.toast(`Restored ${plural(keys.length, 'series')}. Downloading chapter lists…`, { ms: 5000 });
    Store.updateLibrary({ keys, manual: true }).then(r => { UI.toast(r && r.failed ? `Chapter lists updated · ${r.failed} could not be reached right now` : 'Chapter lists updated. Your progress is back.'); LibraryView.render(); });
    AutoBackup.markDirty();
    return true;
  } catch (err) {
    close();
    UI.dialog({ title: 'Restore stopped', body: esc((err.message || 'Unknown error') + '. Use “Restore the safety backup” in Data and storage to go back.') });
    return false;
  }
}

async function setupAutoBackup() {
  if (!NATIVE) {
    // Web version: no background file access, so save a backup file now (iPhone: save it to iCloud Drive in Files).
    const b = await Backup.build();
    const ok = await Native.saveFile('otakuvault-backup-' + new Date().toISOString().slice(0, 10) + '.json', 'application/json', new TextEncoder().encode(JSON.stringify(b, null, 1)));
    if (ok) { await DB.setMeta('backupNudgeDismissed', Date.now()); UI.toast(`Backup saved (${plural(b.series.length, 'series')}). Keep it in iCloud Drive or Files.`); }
    return;
  }
  const ok = await UI.dialog({ title: 'Set up automatic backup', body: html`<p>Pick where the backup file lives. Choose <b>Google Drive</b> (in the picker menu ☰ → Drive) so it survives losing or replacing this phone.</p><p>After that, Otaku Vault keeps the file updated by itself: a few minutes after changes, when you leave the app, and at least every 6 hours you use it.</p><p>On a new phone: install Otaku Vault, tap <b>Restore from backup</b>, and pick that same file.</p>`, buttons: [{ label: 'Cancel', value: false }, { label: 'Choose file', value: true, primary: true }] });
  if (!ok) return;
  const t = await AutoBackup.pick();
  if (!t) return;
  const r = await AutoBackup.run('manual');
  if (r.ok) {
    UI.toast('Automatic backup is on · saved to ' + t.where);
    if (t.onDevice) UI.dialog({ title: 'Saved on this phone only', body: 'The backup file is on this device. It will not help if the phone is lost or reset. Choose a Google Drive location for real protection.' });
    else if (!t.persisted) UI.dialog({ title: 'Heads up', body: 'This storage app did not grant lasting access, so automatic backups may stop after a restart. If that happens, pick a Google Drive file instead.' });
  } else UI.dialog({ title: 'Backup file could not be written', body: esc((r.err || 'Unknown error') + '. Try choosing a Google Drive location.') });
}

async function autoBackupNotice() {
  if (Store.library().length < 3) return '';
  const st = await AutoBackup.status();
  if (st.target && !st.error) return '';
  if (!st.target && await DB.meta('backupNudgeDismissed', 0) > Date.now() - 14 * 864e5) return '';
  return st.target && st.error
    ? html`<div class="notice err" data-nudge>Automatic backup failed: ${st.error}<div class="btnrow" style="margin-top:8px"><button class="btn tonal" data-act="autofix">Fix it</button></div></div>`
    : html`<div class="notice warn" data-nudge>Protect your library: if you change phones, your progress goes with a backup.<div class="btnrow" style="margin-top:8px"><button class="btn" data-act="autosetup">${NATIVE ? 'Set up automatic backup' : 'Save a backup file'}</button><button class="textbtn" data-act="nudgeoff">Later</button></div></div>`;
}

function openDataStorage() {
  const v = subScreen('Data and storage');

  v.body.innerHTML = String(html`<div class="group">Move to a new device</div>

    if (!NATIVE) { box.innerHTML = String(html`<div class="notice" style="margin:4px 16px 8px">Automatic backup needs the Android app. Here, use <b>Create backup file now</b> every so often and save it to iCloud Drive or Files. On a new phone, use <b>Restore from backup</b>.</div>`); return; }
    box.innerHTML = String(st.target
      ? html`<div class="notice ${st.error ? 'err' : ''}" style="margin:4px 16px 8px"><b>Automatic backup is on</b><br>File: ${st.target.name} · ${st.target.where}<br>Last saved: ${st.last ? agoLabel(st.last) : 'not yet'}${st.error ? html`<br>Last attempt failed: ${st.error}` : ''}${st.target.onDevice ? html`<br><span style="color:var(--warn)">This file is on this phone only. Choose Google Drive for protection if the phone is lost.</span>` : ''}
          <div class="btnrow" style="margin-top:10px"><button class="btn tonal" data-act="autonow">Back up now</button><button class="btn ghost" data-act="autosetup">Change file</button><button class="textbtn" data-act="autooff">Turn off</button></div></div>`
      : html`<button class="set" data-act="autosetup"><span class="i">${icon('upload')}</span><span class="body"><span class="t">Set up automatic backup</span><div class="s">Recommended. Keeps a backup file in Google Drive up to date by itself, so a new phone can pick up exactly where you left off.</div></span></button>`);
  };
  drawAuto();
  v.el.addEventListener('click', async e => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    switch (t.dataset.act) {
      case 'autosetup': await setupAutoBackup(); drawAuto(); break;
      case 'tachi': { const f = await Native.openFile('*/*'); if (f) await importTachiFlow(f); break; }
      case 'autonow': { const r = await AutoBackup.run('manual'); UI.toast(r.ok ? 'Backup saved' : 'Backup failed: ' + (r.err || 'unknown')); drawAuto(); break; }
      case 'autooff': if (await UI.confirm('Turn off automatic backup', 'The existing backup file is left where it is.', 'Turn off')) { Native.call('clearAutoBackup'); await DB.setMeta('autoBackupError', ''); drawAuto(); } break;
      case 'backup': {
        const b = await Backup.build();
        const bytes = new TextEncoder().encode(JSON.stringify(b, null, 1));
        const name = 'otakuvault-backup-' + new Date().toISOString().slice(0, 10) + '.json';
        const ok = await Native.saveFile(name, 'application/json', bytes);
        UI.toast(ok ? `Backup saved (${plural(b.series.length, 'series')})` : 'Backup was not saved');
        break;
      }
      case 'restore': await restoreFlow(); break;
      case 'undo': {
        const b = await DB.meta('preRestoreBackup', null);
        if (!b) { UI.toast('There is no safety backup yet'); break; }
        if (!(await UI.confirm('Restore safety backup', 'Replace the library with the state saved before the last restore (' + b.created.slice(0, 16).replace('T', ' ') + ')?', 'Restore'))) break;
        const val = Backup.validate(b);
        await Backup.restore(val, 'replace');
        UI.toast('Safety backup restored');
        break;
      }
      case 'cache': Native.call('clearCache'); UI.toast('Image cache cleared'); break;
      case 'dlall': if (await UI.confirm('Delete all downloads', 'Every downloaded chapter will be removed. Reading progress stays.', 'Delete all')) { for (const k of [...Downloads.status.keys()]) if (!k.startsWith('local:')) await Downloads.cancel(k); UI.toast('Downloads deleted (imported archives were kept)'); } break;
      case 'cookies': if (await UI.confirm('Clear site logins', 'Otaku Vault will be signed out of every source website.', 'Clear')) { Native.call('clearCookies'); UI.toast('Site logins cleared'); } break;
      case 'history': if (await UI.confirm('Clear reading history', 'Library, progress and downloads stay.', 'Clear')) { await DB.clear('history'); UI.toast('History cleared'); } break;
      case 'updates': await DB.clear('updates'); UI.updateBadges(); UI.toast('Update list cleared'); break;
    }
  });
  UI.push(v);
}

    <p style="color:var(--text2);line-height:1.5">It does not bypass paywalls, premium or locked chapters, logins, region locks, or anti-bot verification. Locked chapters are labeled and open on the source website.</p>
    <h4 style="color:var(--text2);font-weight:500">Credits</h4>
    <p style="color:var(--text2);line-height:1.5">Source adapters are ported from the community-maintained keiyoushi extensions (Apache License 2.0). Interface icons are Material Design icons (Apache License 2.0). The look follows the dark Tachiyomi layout; the name, icon and code are original.</p>
    <button class="btn tonal" data-status>Source compatibility report</button></div>`);
  $('[data-status]', v.el).onclick = () => { UI.pop(); UI.go('browse'); BrowseView.tab = 'status'; BrowseView.render(); };
  UI.push(v);
}

function openHelp() {
  const v = subScreen('Help');
  const qa = [
    ['How do I add a series?', 'Tap Add link in the Library (or the link icon in Browse) and paste a series or chapter address. You can also share a link to Otaku Vault from Chrome or any app. Supported sites open in the clean reader; other sites can be saved as website bookmarks.'],
    ['Which sites work?', 'Browse → Status shows each source, what it can do, and whether it worked recently. Sources that change their websites can stop working until the adapter is updated.'],
    ['What do Clean reader, Website only and Experimental mean?', 'Clean reader: Otaku Vault reads the source directly and shows only the pages. Website only: the entry opens the site; no automatic progress or updates. Experimental: for one page on an unsupported site, the app guesses which images are the chapter and you confirm them first.'],
    ['Why is a chapter locked?', 'Premium, early-access and official-store chapters need the source site or app. Otaku Vault labels them and opens the website instead.'],
    ['How do updates work?', 'When the app opens (at most every few hours, configurable) or when you tap refresh, it checks every series in your library. The first check of a newly added series only sets a baseline, so you are not flooded with old chapters.'],
    ['Pages fail to load', 'Tap Retry on the page, or use Retry failed pages in the reader menu. If a whole source fails, check Browse → Status and try again later; for MangaKatana you can switch the image server in Settings.'],
    ['Reading offline', 'Download chapters from a series page. Downloaded chapters open without a connection. You can also import CBZ/ZIP archives from Library → menu.'],
    ['Back up my library', 'More → Data and storage → Create backup. Keep the file somewhere safe; restore it on a new device with Restore backup.'],
  ];
  v.body.innerHTML = String(html`<div class="pad">${qa.map(([q, a]) => html`<details style="border-bottom:1px solid var(--divider);padding:12px 0"><summary style="font-size:17px;cursor:pointer">${q}</summary><p style="color:var(--text2);line-height:1.5">${a}</p></details>`)}</div>`);
  UI.push(v);
